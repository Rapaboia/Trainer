html,body{
  margin:0;padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior-y:none;
  height:100%;
}
body{
  display:flex;flex-direction:column;
  min-height:100vh;
  min-height:100dvh;
}
button, input{font-family:inherit;color:inherit;}
h1,h2,h3,p{margin:0 0 8px 0;}
.app-header{
  padding:calc(14px + var(--safe-t)) 16px 12px 16px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:5;
}
.app-header h1{font-size:19px;font-weight:700;}
.app-header .sub{color:var(--muted);font-size:13px;}
main{
  flex:1 1 auto;
  overflow-y:auto;
  padding:14px 14px calc(90px + var(--safe-b)) 14px;
  -webkit-overflow-scrolling:touch;
}
.view{display:none;}
.view.active{display:block;}
.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:14px;
}
.card h2{font-size:16px;color:var(--accent);}
.card h3{font-size:14px;color:var(--text);}
.muted{color:var(--muted);}
.small{font-size:12.5px;}
.row{display:flex;align-items:center;gap:10px;}
.row.between{justify-content:space-between;}
.wrap{flex-wrap:wrap;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid2 > div{min-width:0;}
.grid2 input{width:100%;}
.stat{
  background:var(--panel2);
  border-radius:12px;
  padding:12px;
  text-align:center;
}
.stat .num{font-size:22px;font-weight:700;color:var(--accent);}
.stat .label{font-size:12px;color:var(--muted);margin-top:2px;}

button{
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:600;
  -webkit-user-select:none;user-select:none;
}
.btn{
  min-height:52px;
  padding:12px 18px;
  font-size:16px;
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--border);
  width:100%;
}
.btn.primary{background:var(--accent);color:var(--accent-text);border:none;}
.btn.primary:active{background:var(--accent-dark);}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.btn.ghost{background:transparent;border:1px solid var(--border);}
.btn.small{min-height:44px;padding:8px 12px;font-size:14px;}
.btn-row{display:flex;gap:10px;}
.btn-row .btn{flex:1;}

.stepper{
  display:flex;align-items:center;
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}
.stepper button{
  width:54px;height:54px;
  min-height:54px;
  font-size:24px;
  background:transparent;
  color:var(--accent);
  border-radius:0;
  flex:0 0 auto;
}
.stepper button:active{background:rgba(79,209,143,0.15);}
.stepper .val{
  flex:1 1 auto;
  text-align:center;
  font-size:19px;
  font-weight:700;
  min-width:64px;
  padding:0 4px;
}
.stepper .unit{font-size:11px;color:var(--muted);font-weight:400;display:block;}

.exercise{
  border-top:1px solid var(--border);
  padding-top:14px;
  margin-top:14px;
}
.exercise:first-child{border-top:none;margin-top:0;padding-top:0;}
.exercise .exname{font-size:15.5px;font-weight:700;}
.exercise .exmeta{font-size:12.5px;color:var(--muted);margin-top:1px;}
.suggestion{
  display:inline-block;
  margin-top:6px;
  padding:4px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
}
.suggestion.up{background:rgba(79,209,143,0.15);color:var(--accent);}
.suggestion.hold{background:rgba(154,164,175,0.15);color:var(--muted);}
.last-time{font-size:12.5px;color:var(--muted);margin-top:6px;}
.set-row{
  display:grid;
  grid-template-columns:22px 1fr 1fr 54px;
  gap:6px;
  align-items:stretch;
  margin-top:10px;
}
.set-row .setlabel{
  font-size:12.5px;color:var(--muted);
  writing-mode:vertical-rl;text-orientation:mixed;
  display:flex;align-items:center;justify-content:center;
}
.stepper-v{
  display:flex;flex-direction:column;
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}
.stepper-v button{
  width:100%;min-height:52px;
  font-size:24px;font-weight:700;
  background:transparent;color:var(--accent);
  border-radius:0;
}
.stepper-v button:active{background:rgba(79,209,143,0.15);}
.stepper-v .val{
  text-align:center;padding:6px 4px;
  font-size:19px;font-weight:700;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
}
.stepper-v .val .unit{font-size:10.5px;color:var(--muted);font-weight:400;display:block;}
.val-input{
  width:100%;display:block;
  background:transparent;border:none;outline:none;
  color:var(--text);font-family:inherit;
  font-size:19px;font-weight:700;text-align:center;
  padding:0;-moz-appearance:textfield;
}
.val-input::-webkit-inner-spin-button,.val-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.field input[type=date]{
  width:auto;min-height:44px;
  background:var(--panel2);color:var(--text);
  border:1px solid var(--border);border-radius:10px;
  padding:8px 12px;font-size:14px;
}
.done-btn{
  width:100%;min-height:52px;
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:12px;
  color:var(--muted);
  font-size:22px;
  display:flex;align-items:center;justify-content:center;
}
.done-btn.done{background:var(--accent);border-color:var(--accent);color:var(--accent-text);}

nav.tabbar{
  position:fixed;left:0;right:0;bottom:0;
  display:flex;
  background:var(--panel);
  border-top:1px solid var(--border);
  padding-bottom:var(--safe-b);
  z-index:10;
}
nav.tabbar button{
  flex:1;
  background:transparent;
  border-radius:0;
  padding:9px 2px 8px 2px;
  min-height:58px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
}
nav.tabbar button .ic{font-size:20px;}
nav.tabbar button.active{color:var(--accent);}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th,td{text-align:left;padding:6px 5px;border-bottom:1px solid var(--border);}
th{color:var(--muted);font-weight:600;font-size:12px;}

.badge{
  display:inline-block;padding:3px 9px;border-radius:999px;
  font-size:11.5px;font-weight:700;
  background:var(--panel2);color:var(--accent);border:1px solid var(--border);
}
.badge.variant{color:#f2c14e;}

.session-item{
  border-bottom:1px solid var(--border);
  padding:10px 0;
}
.session-item:last-child{border-bottom:none;}
.session-item .head{cursor:pointer;}
.session-detail{display:none;margin-top:8px;font-size:13px;}
.session-detail.open{display:block;}
.session-detail table{margin-top:6px;}

.meal-row{border-top:1px solid var(--border);padding-top:8px;}
.meal-row:first-child{border-top:none;padding-top:0;}
.meal-row .meal-row-head{cursor:pointer;}
.meal-row .meal-row-head .chev{color:var(--accent);font-size:12px;}
.meal-row-body{display:none;margin-top:8px;}
.meal-row-body.open{display:block;}

.check-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.check-item:last-of-type{border-bottom:none;}
.check-item .checkbox{flex:0 0 auto;width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--panel2);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:15px;font-weight:700;margin-top:1px;}
.check-item.checked .checkbox{background:var(--accent);color:var(--accent-text);border-color:var(--accent);}
.check-item .check-text{flex:1 1 auto;min-width:0;}
.check-item.checked .check-text{opacity:.5;text-decoration:line-through;}
.opt-detail{background:var(--panel2);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:12.5px;}
.opt-detail .macros{font-weight:700;color:var(--text);}

textarea.export-box{
  width:100%;min-height:140px;
  background:var(--panel2);color:var(--text);
  border:1px solid var(--border);border-radius:10px;
  padding:10px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}

.field{margin-bottom:12px;}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;}
.field input[type=number]{
  width:100%;min-height:48px;
  background:var(--panel2);color:var(--text);
  border:1px solid var(--border);border-radius:10px;
  padding:8px 12px;font-size:16px;
}

.toast{
  position:fixed;left:50%;bottom:calc(96px + var(--safe-b));
  transform:translateX(-50%);
  background:var(--accent);color:var(--accent-text);
  padding:10px 18px;border-radius:999px;
  font-size:13.5px;font-weight:700;
  box-shadow:0 4px 18px rgba(0,0,0,0.4);
  z-index:50;
  opacity:0;pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

.sparkline{width:100%;height:60px;display:block;}

hr.sep{border:none;border-top:1px solid var(--border);margin:14px 0;}
</style>
</head>

var MEAL_TYPE_RE = /^\s*(prima colazione|colazione|met[aà]\s+mattina|spuntino mattutino|spuntino pomeridiano|spuntino pomeriggio|merenda|pranzo|cena|spuntino)\b[:\-,]?\s*/i;

function extractMealType(text){
  var raw = String(text);
  var m = raw.match(MEAL_TYPE_RE);
  if(m){
    var key = m[1].toLowerCase().replace(/\s+/g," ").trim();
    var label = MEAL_TYPE_LABELS[key];
    if(label) return {mealType: label, text: raw.slice(m[0].length)};

}
function guessMealTypeByHour(){
  var h = new Date().getHours();

var WEEKDAYS = [
  {key:"lun", label:"Lunedì"}, {key:"mar", label:"Martedì"}, {key:"mer", label:"Mercoledì"},
  {key:"gio", label:"Giovedì"}, {key:"ven", label:"Venerdì"}, {key:"sab", label:"Sabato"}, {key:"dom", label:"Domenica"}
];

// Default: template lun/mer/ven allenamento (coerente col template proposto in
// programma.md), resto riposo; ogni pasto sull'opzione 1. Solo un punto di
// partenza modificabile — non pretende di indovinare la settimana reale di Marco.
function defaultWeekMenu(){
  return {
    giorni: WEEKDAYS.map(function(d, idx){
      var tipo = (d.key === "lun" || d.key === "mer" || d.key === "ven") ? "allenamento" : "riposo";
      var pasti = {};
      MEALI_ORDER[tipo].forEach(function(mk){
        var meal = PASTI_TIPO[tipo][mk];
        // Ruota tra le opzioni lungo la settimana invece di fissare tutto su "Opzione 1"
        // (corretto il 2026-09-18 su richiesta di Marco) — segue quanto scritto in dieta.md
        // stesso ("più opzioni isocaloriche da ruotare... invece di ripetere sempre lo
        // stesso alimento"), non un criterio inventato qui. Le opzioni "rapide" (es. la
        // colazione allenamento 3/4/5, pensate solo per le uscite in bici immediate e che
        // non coprono il target pieno) restano escluse dalla rotazione automatica: sono
        // situazionali, si scelgono a mano quando servono.
        var full = meal.options.filter(function(o){ return o.kcal >= meal.targetKcal * 0.85; });
        var pool = full.length ? full : meal.options;
        pasti[mk] = pool[idx % pool.length].id;
      });
      return {day: d.key, tipo: tipo, pasti: pasti};
    })
  };
}

function weekMenuDay(dayKey){
  return state.weekMenu.giorni.find(function(g){ return g.day === dayKey; });
}

// Cambiare il tipo giornata resetta le scelte pasto sull'opzione 1 di default,
// perché i pasti disponibili sono diversi tra riposo e allenamento (es. "Cena"
// vs "Cena post-workout") — non ha senso tenere un id vecchio che non esiste
// più in quel set.
function weekMenuSetTipo(dayKey, tipo){
  var g = weekMenuDay(dayKey);
  if(!g || g.tipo === tipo) return;
  g.tipo = tipo;
  var pasti = {};
  MEALI_ORDER[tipo].forEach(function(mk){ pasti[mk] = 1; });
  g.pasti = pasti;
}

function weekMenuSetPasto(dayKey, mealKey, optionId){
  var g = weekMenuDay(dayKey);
  if(!g) return;
  g.pasti[mealKey] = optionId;
}

// Somma gli ingredienti di tutte le opzioni scelte nei 7 giorni pianificati —
// stessa logica di aggregazione di buildShoppingList, ma dal piano pasti reale
// invece che dalle combo del catalogo.
function buildMealPlanShoppingList(){
  var totals = {};
  var order = [];
  state.weekMenu.giorni.forEach(function(g){
    MEALI_ORDER[g.tipo].forEach(function(mealKey){
      var meal = PASTI_TIPO[g.tipo][mealKey];
      var opt = meal.options.find(function(o){ return o.id === g.pasti[mealKey]; });
      if(!opt) return;
      opt.ingredients.forEach(function(ing){
        var key = ing.name+"|"+ing.unit;
        if(!(key in totals)){ totals[key] = {name: ing.name, unit: ing.unit, qty: 0}; order.push(key); }
        totals[key].qty += ing.qty;
      });
    });
  });
  return order.map(function(k){ return totals[k]; });
}

// Suggerimenti di preparazione in anticipo: match semplice per parola chiave tra
// un ingrediente della lista della spesa e le combo del catalogo tecniche sopra —
// solo per i pochi casi chiari (pollo, riso basmati), niente mapping esteso per
// non rischiare abbinamenti sbagliati.
var MEALPLAN_PREP_HINTS = [
  {match:/pollo/i, comboId:"pollo_spac"},
  {match:/manzo|scamone|picanha/i, comboId:"manzo_spac"},
  {match:/pesce|merluzzo|salmone/i, comboId:"pesce_forno"},
  {match:/riso basmati/i, comboId:"riso_precotto"},
  {match:/cous ?cous/i, comboId:"cous_cous_precotto"},
  {match:/quinoa/i, comboId:"quinoa_precotta"},
  {match:/patate/i, comboId:"patate_arrosto"},
  {match:/carne macinata|polpette/i, comboId:"polpette_carne"}
];
function prepHintForIngredient(name){
  var hit = MEALPLAN_PREP_HINTS.find(function(h){ return h.match.test(name); });
  if(!hit) return null;
  return mealprepCatalogById(hit.comboId);
}

/* ============================================================
   FORMATI CONFEZIONE (2026-09-18, su richiesta di Marco: "dammi le
   confezioni" nella lista della spesa). Solo formati VERIFICATI (ricerca web
   sui prodotti reali citati in dieta.md, settembre 2026) o dichiarati da
   Marco stesso — nessun formato inventato. Ingredienti sfusi/venduti a peso
   (verdure, frutta fresca, pollo, farina, mandorle, fiocchi d'avena, ecc.) o
   con formati troppo variabili per una cifra unica (mirtilli freschi:
   125/160/250g a seconda della linea; Coco Pops: 365-500g) restano in
   grammi soltanto — non è ambiguità mia, è che il mercato reale non ha un

   uovo / formato cartone, editabili) tolta su richiesta di Marco il 2026-09-19

var PACKAGE_HINTS = [
  {match:/^Yogurt greco 0%$/i, unitG:150, label:"vasetto da 150g"}, // dichiarato da Marco
  {match:/^Latte Zymil$/i, unitG:1000, label:"cartone da 1L (esistono anche 500ml/250ml)"},

  {match:/^Confettura Zuegg mirtilli 100% frutta$/i, unitG:250, label:"vasetto da 250g — verifica in etichetta: la \"composta\" Zuegg mirtilli selvatici (diversa) è da 230g"}
];
function packageHintForIngredient(name){
  return PACKAGE_HINTS.find(function(h){ return h.match.test(name); }) || null;
}

// Prodotti confezionati senza un formato unico verificabile (vedi ricerca sopra:
// gallette di riso 130-150g a seconda del brand, Pan di Stelle in scatoloni da
// 350/700g enormi rispetto ai 23g usati in una ricetta, Coco Pops 365-500g) —
// per questi scrivere i grammi è fuorviante al supermercato (non si compra "23g
// di Coco Pops", si compra la confezione): mostriamo solo il nome, niente
// quantità (proposta di Marco, 2026-09-18).
var NO_QTY_PACKAGED = [/^Gallette di riso$/i, /^Pan di Stelle$/i, /^Coco Pops$/i];
function isNoQtyPackaged(name){
  return NO_QTY_PACKAGED.some(function(re){ return re.test(name); });
}

// Riga descrittiva della quantità per un ingrediente (usata sia nella lista a
// spunte sia nel testo copiato negli appunti) — null per i prodotti confezionati
// senza formato verificabile (vedi sopra: lì basta il nome).
function shoppingQtyLine(item){
  if(isNoQtyPackaged(item.name)) return null;
  var qtyLine = fmtNum(item.qty)+' '+item.unit;
  // Uova/Albume: niente conversione a uova/cartoni (tolta su richiesta di Marco,
  // 2026-09-19: "non mi interessano") — restano in grammi come gli altri ingredienti
  // sfusi, coerente col resto della lista.
  if(item.unit === "g"){
    var pkg = packageHintForIngredient(item.name);
    if(pkg){
      var n = Math.ceil(item.qty / pkg.unitG);
      qtyLine += ' (≈ '+n+' × '+pkg.label+')';
    }
  }
  return qtyLine;
}

// Lista della spesa come elenco a spunte (proposta di Marco, 2026-09-18) — le
// spunte sono per-ingrediente (state.shoppingChecked, chiave = nome), non legate
// a una data precisa perché il piano pasti stesso è una "settimana tipo": prima
// di una nuova spesa si azzerano a mano col tasto sotto, invece di essere
// resettate da sole (rischierebbe di perdere spunte fatte a metà spesa).
function shoppingListHTML(){
  var wmList = buildMealPlanShoppingList();
  var html = '';
  wmList.forEach(function(item){
    var hint = prepHintForIngredient(item.name);
    var qtyLine = shoppingQtyLine(item);
    var attrName = item.name.replace(/"/g, "&quot;");
    var checked = !!state.shoppingChecked[item.name];
    html += '<div class="check-item'+(checked?' checked':'')+'" data-act="toggle-shopping-item" data-name="'+attrName+'">';
    html += '<div class="checkbox">'+(checked?'✓':'')+'</div>';
    html += '<div class="check-text"><div>'+item.name+'</div>';
    if(qtyLine) html += '<div class="small muted">'+qtyLine+'</div>';
    if(hint) html += '<div class="small muted">🔧 vedi piano di cucina: '+hint.name+'</div>';
    html += '</div></div>';
  });
  html += '<button class="btn ghost small" style="width:auto;margin-top:10px;" data-act="shopping-clear-checks">Svuota spunte</button>';
  return html;
}

/* ============================================================
   PIANO DI CUCINA SETTIMANALE (2026-09-18, su richiesta di Marco): giorni fissi
   di batch-cooking scelti da lui (default domenica + mercoledì, per dividere la
   settimana in due metà — suggerito da me, nessun dato del corso su "ogni quanti
   giorni cucinare", è solo un punto di partenza modificabile con i toggle).
   Per ogni ingrediente del piano pasti che corrisponde a una tecnica del
   catalogo (via prepHintForIngredient), il trattamento dipende dal batchType
   già scritto sopra, letto dalla tecnica reale del corso — nessuna scadenza in
   giorni inventata dove il corso non la dà:
   - "cookAhead": si cuoce/prepara una volta sola nel giorno di cucina e si
     rigenera nei giorni successivi (cereali "fino a una settimana" dal corso,
     salse/contorni "sempre a freddo"/rigenerabili).
   - "freezerDaily": si condisce e congela CRUDO una volta (tutta la scorta
     della settimana, non serve ripeterlo per ogni sessione), ma si CUOCE
     fresco da surgelato ogni giorno in cui compare nel piano — non è "cucina
     una volta, mangia tutta la settimana", il corso lo dice esplicitamente
     (pollo/manzo/pesce a fette SPAC).
   - "freshDaily": il corso dice esplicitamente di farlo fresco al momento
     (cous cous), niente batch.
   ============================================================ */
function weekdayIndex(key){
  for(var i=0;i<WEEKDAYS.length;i++){ if(WEEKDAYS[i].key === key) return i; }
  return -1;
}

// Giorno di cucina "responsabile" di un giorno normale: l'ultimo giorno di
// cucina uguale o precedente nella settimana; se non ce n'è uno prima (es.
// lunedì con l'unico giorno di cucina il mercoledì), si prende ciclicamente
// l'ultimo della settimana precedente (l'ultimo giorno di cucina nell'ordine).
function responsibleCookDay(dayKey){
  if(!state.cookDays || !state.cookDays.length) return null;
  var idx = weekdayIndex(dayKey);
  var sorted = state.cookDays.slice().sort(function(a,b){ return weekdayIndex(a)-weekdayIndex(b); });
  var best = null;
  sorted.forEach(function(ck){ if(weekdayIndex(ck) <= idx) best = ck; });
  if(best === null) best = sorted[sorted.length-1];
  return best;
}

// Per ogni giorno di cucina scelto, aggrega (dal piano pasti reale, quantità
// vere non quelle placeholder del catalogo) gli ingredienti batchType
// "cookAhead" dei giorni che copre; separatamente, un'unica lista "da
// congelare" per gli ingredienti "freezerDaily" (basta farla una volta sola,
// il vincolo è il freezer non il calendario).
function buildCookPlan(){
  var cookDays = (state.cookDays || []).slice().sort(function(a,b){ return weekdayIndex(a)-weekdayIndex(b); });
  if(!cookDays.length) return {sessions: [], freezerPrep: []};

  var coverage = {};
  cookDays.forEach(function(ck){ coverage[ck] = []; });
  WEEKDAYS.forEach(function(d){
    var resp = responsibleCookDay(d.key);
    if(resp) coverage[resp].push(d.key);
  });

  var freezerTotals = {}, freezerOrder = [];

  var sessions = cookDays.map(function(ck){
    var totals = {}, order = [];
    coverage[ck].forEach(function(dayKey){
      var g = weekMenuDay(dayKey);
      MEALI_ORDER[g.tipo].forEach(function(mealKey){
        var meal = PASTI_TIPO[g.tipo][mealKey];
        var opt = meal.options.find(function(o){ return o.id === g.pasti[mealKey]; });
        if(!opt) return;
        opt.ingredients.forEach(function(ing){
          var combo = prepHintForIngredient(ing.name);
          if(!combo) return;
          if(combo.batchType === "freezerDaily"){
            if(!(combo.id in freezerTotals)){ freezerTotals[combo.id] = {combo: combo, qty: 0, unit: ing.unit}; freezerOrder.push(combo.id); }
            freezerTotals[combo.id].qty += ing.qty;
            return;
          }
          if(combo.batchType !== "cookAhead") return;
          if(!(combo.id in totals)){ totals[combo.id] = {combo: combo, qty: 0, unit: ing.unit}; order.push(combo.id); }
          totals[combo.id].qty += ing.qty;
        });
      });
    });
    return {
      day: WEEKDAYS.find(function(d){ return d.key === ck; }),
      coversLabel: coverage[ck].map(function(dk){ return WEEKDAYS.find(function(w){ return w.key===dk; }).label; }).join(", "),
      items: order.map(function(id){ return totals[id]; })
    };
  });

  return {sessions: sessions, freezerPrep: freezerOrder.map(function(id){ return freezerTotals[id]; })};
}

// Cosa fare "al momento" in un giorno specifico: cotture fresche (freezerDaily
// + freshDaily) lette direttamente dal pasto scelto quel giorno — non passano
// da una sessione di cucina, si fanno sempre il giorno stesso.
function dailyCookTasksFor(dayKey){
  var g = weekMenuDay(dayKey);
  var tasks = [];
  MEALI_ORDER[g.tipo].forEach(function(mealKey){
    var meal = PASTI_TIPO[g.tipo][mealKey];
    var opt = meal.options.find(function(o){ return o.id === g.pasti[mealKey]; });
    if(!opt) return;
    opt.ingredients.forEach(function(ing){
      var combo = prepHintForIngredient(ing.name);
      if(!combo) return;
      if(combo.batchType === "freezerDaily" || combo.batchType === "freshDaily"){
        tasks.push({combo: combo, qty: ing.qty, unit: ing.unit, meal: meal.label});
      }
    });
  });
  return tasks;
}

// Riepilogo in cima al piano di cucina (aggiunto 2026-09-19 dopo che a Marco
// sembrava che l'app suggerisse "solo riso"): un'unica lista di TUTTO quello
// da preparare questa settimana (congelati + cotture in blocco insieme, non
// più separati in card diverse da scoprire scorrendo), più l'elenco esplicito
// degli ingredienti del piano pasti che NON hanno una preparazione (uova,
// legumi in scatola, mozzarella, pane...) — non è un buco del sistema, è che
// per quegli ingredienti non serve alcuna preparazione in anticipo, ma senza
// dirlo esplicitamente sembra che l'app li abbia dimenticati.
function weekPrepSummary(cookPlan){
  var matched = {}, matchedOrder = [];
  cookPlan.freezerPrep.forEach(function(item){
    if(!(item.combo.id in matched)){ matched[item.combo.id] = {name: item.combo.name, qty: 0, unit: item.unit, kind: "congelare"}; matchedOrder.push(item.combo.id); }
    matched[item.combo.id].qty += item.qty;
  });
  cookPlan.sessions.forEach(function(s){
    s.items.forEach(function(item){
      if(!(item.combo.id in matched)){ matched[item.combo.id] = {name: item.combo.name, qty: 0, unit: item.unit, kind: "cuocere"}; matchedOrder.push(item.combo.id); }
      matched[item.combo.id].qty += item.qty;
    });
  });

  var allIngredientNames = {}, unmatchedNames = {}, unmatchedOrder = [];
  WEEKDAYS.forEach(function(d){
    var g = weekMenuDay(d.key);
    MEALI_ORDER[g.tipo].forEach(function(mealKey){
      var meal = PASTI_TIPO[g.tipo][mealKey];
      var opt = meal.options.find(function(o){ return o.id === g.pasti[mealKey]; });
      if(!opt) return;
      opt.ingredients.forEach(function(ing){
        allIngredientNames[ing.name] = true;
        if(!prepHintForIngredient(ing.name) && !(ing.name in unmatchedNames)){
          unmatchedNames[ing.name] = true;
          unmatchedOrder.push(ing.name);
        }
      });
    });
  });

  return {
    matched: matchedOrder.map(function(id){ return matched[id]; }),
    unmatched: unmatchedOrder
  };
}

//    (projectinvictus.it/mini-cut/) — scelto un valore medio, editabile come gli
//    altri (unico valore già sourced prima di questo aggiornamento).
var MESOCICLO_DURATA_DEFAULT = {
  ricomposizione: 4,
  mantenimento: 8,
  massa: 8,
  reverse: 6,
  cut: 4
};

// Limiti massimi/minimi impostabili per la durata (2026-09-19) — Marco ha chiesto
// di imporre i parametri massimi secondo Invictus. Messo un min/max SOLO dove PI dà
// davvero una fascia numerica (Cut e Massa, vedi commento sopra); per Ricomposizione,
// Mantenimento e Reverse PI non dà nessuna fascia, quindi restano liberi (nessun
// limite inventato) — solo il minimo pratico di 1 settimana per tutti.
var MESOCICLO_DURATA_RANGE = {
  cut:   {min: 2, max: 6},   // mini-cut, projectinvictus.it/mini-cut/
  massa: {min: 4, max: 10}   // blocco prima della pausa da insulino-resistenza, projectinvictus.it/dieta-per-la-massa-muscolare/
};

// Target Mantenimento/Massa/Reverse-diet (2026-09-19) — Marco ha giustamente fatto
// notare che i piani di Mattia Mauro già analizzati (stesso nutrizionista, Dr.
// Angotti) HANNO kcal reali diverse per fase, e che andavano studiati meglio invece
// di dire "non ho un deficit/surplus verificato". Riletti i 4 PDF con pdfplumber,
// pagina delle tabelle "TOT. KCAL" (non stimati, letti dal documento):
//   REVERSE_1: riposo 2011 kcal (prot 138g/carb 224g/grassi 57g) — allenamento 2312 kcal
//   REVERSE_2: riposo 2142 kcal — allenamento 2358 kcal
//   REVERSE_3: riposo 2213 kcal — allenamento 2513 kcal
//   BULK:      riposo 2353 kcal — allenamento 2754 kcal
// Da qui SOLO il pattern percentuale di crescita da uno step al successivo (non i
// kcal assoluti di Mattia, calibrati su di lui): riposo +6,51% / +3,31% / +6,33%,
// allenamento +1,99% / +6,57% / +9,59%. Applicato ai TARGETS fissi di Marco (che per
// coincidenza sono già vicinissimi a REVERSE_1 di Mattia: 1970/2250 contro 2011/2312)
// invece di copiare i numeri di Mattia. Proteine e grassi restano ai grammi fissi
// attuali di Marco a ogni step (osservato nei piani reali: variano di pochi grammi,
// l'aumento va quasi tutto nei carboidrati) — i carboidrati si ricavano a riempimento
// dalle kcal risultanti, stesso metodo già usato in computeFormulaTargets.
var REVERSE_STEP_MULT = [
  {step: 1, riposo: 2142/2011, allenamento: 2358/2312},
  {step: 2, riposo: 2213/2142, allenamento: 2513/2358},
  {step: 3, riposo: 2353/2213, allenamento: 2754/2513}
];

function scaleTargetsByMult(mult){
  var out = {};
  ["riposo","allenamento"].forEach(function(key){
    var base = TARGETS[key];
    var kcal = Math.round(base.kcal * mult[key]);
    var prot = base.prot, grassi = base.grassi;
    var carb = Math.round((kcal - prot*4 - grassi*9) / 4);
    out[key] = {kcal: kcal, prot: prot, carb: carb, grassi: grassi, label: base.label};
  });
  return out;
}
// Target Cut (rifatto il 2026-09-19, seconda versione — la prima, basata sul rapporto
// con la scheda Cut reale di Mattia Mauro, non teneva: vedi roadmap.md per il perché).
// Marco ha chiesto "Invictus cosa farebbe?" — studiato su projectinvictus.it invece di
// continuare a tirare a indovinare dai PDF di Mattia:
//  - Il deficit va calcolato sulla normocalorica (mantenimento), MAI direttamente sopra
//    un altro deficit già in corso — fonte: guida reverse diet PI ("dalla ipercalorica
//    torna alla normocalorica e solo poi scendi in ipocalorica", stesso principio esteso
//    da bulk→cut a deficit→deficit). La tua Ricomposizione attuale è già descritta come
//    "deficit leggero" in programma.md, quindi NON va usata come base per il Cut — si usa
//    invece il Mantenimento già calcolato in app (≈ normocalorica), verificato prima con
//    1-2 settimane di peso stabile (media 7gg) nella pratica.
//  - Entità del deficit: 350-500 kcal/die, tipicamente 500 per un uomo (meno, 100-200,
//    solo se già molto magro — non il tuo caso, ti descrivi "un po' in sovrappeso").
//  - Durata: "mini cut" di 2-6 settimane invece di un unico cut lungo, poi si ritorna a
//    normocalorica prima del prossimo — coerente con l'idea di "minicut progressivi" che
//    hai proposto tu, corretta solo sul punto di partenza (da normocalorica, non dal
//    mesociclo immediatamente precedente se quello è già un deficit).
// Fonti: projectinvictus.it/deficit-calorico-calcolo/ (entità deficit, verifica empirica
// del mantenimento) e projectinvictus.it/mini-cut/ (durata, punto di partenza).
// Nota: per ora Marco non prevede un Cut a breve (piano attuale: Ricomposizione → Reverse
// → Massa) — questa è la formula pronta per quando servirà.
var CUT_DEFICIT_KCAL = 500;
function scaleTargetsByDelta(baseTargets, deltaKcal){
  var out = {};
  ["riposo","allenamento"].forEach(function(key){
    var base = baseTargets[key];
    var kcal = base.kcal + deltaKcal;
    var prot = base.prot, grassi = base.grassi;
    var carb = Math.round((kcal - prot*4 - grassi*9) / 4);
    out[key] = {kcal: kcal, prot: prot, carb: carb, grassi: grassi, label: base.label};
  });
  return out;
}
// Target per obiettivo del Mesociclo: Ricomposizione = i TARGETS fissi attuali
// (il piano vero di Angotti, invariato); Mantenimento = il più piccolo/prudente
// degli step di reverse (step 1), come proxy ragionevole di "qualcosa in più del
// deficit ma non ancora un vero bulk", usato anche come normocalorica di riferimento
// per il Cut; Reverse-diet = step scelto (1/2/3, cumulativo dallo step precedente);
// Massa = tutti e 3 gli step applicati in sequenza (equivalente al salto totale fino
// al livello BULK di Mattia); Cut = Mantenimento meno CUT_DEFICIT_KCAL (vedi sopra).
function computeMesocicloTargets(){
  var ob = state.mesociclo.obiettivo;
  if(ob === "ricomposizione") return TARGETS;
  var mantenimento = scaleTargetsByMult(REVERSE_STEP_MULT[0]);
  if(ob === "cut") return scaleTargetsByDelta(mantenimento, -CUT_DEFICIT_KCAL);
  if(ob === "mantenimento") return mantenimento;
  var uptoStep = ob === "massa" ? 3 : Math.min(Math.max(state.mesociclo.reverseStep || 1, 1), 3);
  var cum = {riposo: 1, allenamento: 1};
  for(var i=0; i<uptoStep; i++){
    cum.riposo *= REVERSE_STEP_MULT[i].riposo;
    cum.allenamento *= REVERSE_STEP_MULT[i].allenamento;
  }
  return scaleTargetsByMult(cum);
}

var MESOCICLO_OBJ_LABELS = {ricomposizione:"Ricomposizione", cut:"Cut", mantenimento:"Mantenimento", massa:"Massa", reverse:"Reverse-diet"};

// Suggeritore di fase successiva a fine Mesociclo (2026-09-19) — chiude il cerchio
// sulla teoria Invictus studiata con Marco in questa stessa sessione: Cut → Reverse è
// obbligatorio (non si salta la normocalorica, projectinvictus.it/mini-cut/);
// Ricomposizione → Reverse segue il piano già scritto in dieta.md (Ricomposizione poi
// Massa via reverse diet, non un salto diretto); Massa lunga → valutare un mini-cut per
// contenere il grasso (stessa fonte); Reverse e Mantenimento arrivano entrambi alla
// normocalorica, da lì è una scelta di Marco (Massa o Cut) — nessuna direzione può
// essere suggerita in automatico, si propongono entrambe.
var NEXT_PHASE_SUGGESTION = {
  ricomposizione: {obiettivo:"reverse", why:"verso la fase di Massa già pianificata (dieta.md) — si passa dalla normocalorica prima del bulk, non si salta direttamente"},
  cut:            {obiettivo:"reverse", why:"dopo un Cut si torna sempre alla normocalorica in modo graduale prima di decidere il prossimo passo (Project Invictus)"},
  massa:          {obiettivo:"cut", why:"in una fase di massa lunga conviene inserire un mini-cut periodico per contenere il grasso accumulato (Project Invictus)"},
  reverse:        {obiettivo:null, why:"hai raggiunto la normocalorica: da qui è una scelta tua se costruire (Massa) o tagliare ancora (Cut)"},
  mantenimento:   {obiettivo:null, why:"sei a normocalorica: punto di decisione, scegli la direzione in base a cosa vuoi fare ora (Massa o Cut)"}
};
function mesocicloFinePrevista(){
  var inizio = state.mesociclo.dataInizio || todayISO();
  var durata = state.mesociclo.durataSettimane || MESOCICLO_DURATA_DEFAULT[state.mesociclo.obiettivo] || 8;
  return addWeeksToDate(inizio, durata);
}
function mesocicloEnded(){
  return todayISO() >= mesocicloFinePrevista();
}
// Banner mostrato in cima a "Oggi" quando il mesociclo corrente ha superato la sua
// durata — non sposta nulla in automatico (le kcal restano quelle scelte finché Marco
// non conferma), è solo un promemoria pratico per non far scadere la fase in silenzio.
function nextPhaseSuggestionHTML(){
  if(!mesocicloEnded()) return "";
  var ob = state.mesociclo.obiettivo;
  var sug = NEXT_PHASE_SUGGESTION[ob];
  if(!sug) return "";
  var html = '<div class="card" style="border:1px solid #f2c14e;">';
  html += '<h3 style="margin:0;">📅 Mesociclo terminato</h3>';
  html += '<div class="small" style="margin-top:6px;">Il mesociclo "'+(MESOCICLO_OBJ_LABELS[ob]||ob)+'" doveva finire il '+fmtDateIt(mesocicloFinePrevista())+'. ';
  if(sug.obiettivo){
    html += 'Prossimo passo tipico: <strong>'+MESOCICLO_OBJ_LABELS[sug.obiettivo]+'</strong> — '+sug.why+'.</div>';
    html += '<div class="btn-row" style="margin-top:10px;flex-wrap:wrap;">';
    html += '<button class="btn primary small" style="width:auto;" data-act="set-obiettivo" data-obiettivo="'+sug.obiettivo+'">Passa a '+MESOCICLO_OBJ_LABELS[sug.obiettivo]+'</button>';
    html += '<button class="btn ghost small" style="width:auto;" data-act="restart-mesociclo">Continua '+(MESOCICLO_OBJ_LABELS[ob]||ob)+'</button>';
    html += '</div>';
  } else {
    html += 'Sei a normocalorica: '+sug.why+'.</div>';
    html += '<div class="btn-row" style="margin-top:10px;flex-wrap:wrap;">';
    html += '<button class="btn primary small" style="width:auto;" data-act="set-obiettivo" data-obiettivo="massa">Vai a Massa</button>';
    html += '<button class="btn primary small" style="width:auto;" data-act="set-obiettivo" data-obiettivo="cut">Vai a Cut</button>';
    html += '<button class="btn ghost small" style="width:auto;" data-act="restart-mesociclo">Continua '+(MESOCICLO_OBJ_LABELS[ob]||ob)+'</button>';
    html += '</div>';
  }
  html += '</div>';
  return html;
}

// Uscite in bici: kcal/ora calibrate su uscite reali di Marco (dati Garmin, "calorie
// attive" — già al netto del metabolismo basale, che è coperto dal target riposo/
// allenamento sotto), non su una tabella MET generica. Un solo dato reale per profilo
// finora (2026-09-18): Gravel 42km/3h05, FC media 129, 939 kcal attive → ~305 kcal/h;
// Enduro/MTB 58min, FC media 158, 512 kcal attive → ~528 kcal/h. Numeri da questa unica
// uscita per tipo: correggerli man mano che si accumulano più dati reali invece di
// trattarli come definitivi — vedi roadmap.md.
var BIKE_RATES = {
  gravel: {label:"Gravel", kcalPerHour: 305},
  enduro: {label:"Enduro/MTB", kcalPerHour: 528}
};

// Calcola il target del giorno partendo dal giorno base (allenamento pesi/riposo, come
// oggi) e aggiungendo sopra l'eventuale uscita in bici registrata per quella data: le kcal
// extra vanno per intero nei carboidrati (proteine/grassi restano al target base), come
// da regola già scritta in dieta.md per i giorni con uscita lunga in bici.
function computeTargetsForDate(date){
  var hasWorkout = state.workouts.some(function(w){ return w.date === date; });
  var baseKey = hasWorkout ? "allenamento" : "riposo";
  // 2026-09-19: prima leggeva sempre TARGETS (i numeri fissi di Ricomposizione), a
  // prescindere dall'obiettivo scelto in Impostazioni — Marco l'ha notato ("hai
  // testato se cambiando mesociclo cambia di pari passo anche il piano dieta?": no,
  // non cambiava). Ora legge i target della fase attuale del Mesociclo: per
  // Ricomposizione computeMesocicloTargets() restituisce comunque TARGETS
  // (invariato), per le altre fasi (Cut/Mantenimento/Massa/Reverse) restituisce i
  // numeri calcolati per quella fase — quindi il diario/"Oggi" ora segue davvero
  // l'obiettivo impostato, non solo Impostazioni.
  var base = computeMesocicloTargets()[baseKey];
  var ride = state.bikeRides.find(function(r){ return r.date === date; });
  if(!ride) return {kcal: base.kcal, prot: base.prot, carb: base.carb, grassi: base.grassi, label: base.label, baseKey: baseKey, ride: null};
  var rate = BIKE_RATES[ride.tipo];
  var extraKcal = rate ? Math.round(rate.kcalPerHour * ride.ore) : 0;
  var extraCarb = Math.round(extraKcal / 4);
  return {
    kcal: base.kcal + extraKcal,
    prot: base.prot,
    carb: base.carb + extraCarb,
    grassi: base.grassi,
    label: base.label + " + bici",
    baseKey: baseKey,
    ride: {tipo: ride.tipo, ore: ride.ore, extraKcal: extraKcal, extraCarb: extraCarb}
  };
}

  try{

    if(!raw) return fallback;
    return JSON.parse(raw);
  }catch(e){ return fallback; }
}
function saveJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}

// Stima il massimale (1RM) di un esercizio principale dallo storico delle sedute,
// con la formula di Epley: 1RM = peso × (1 + ripetizioni/30). Valida solo su serie
// vicine al cedimento — Marco si allena a cedimento vero su tutte le serie dei
// principali (non solo la RPE 7,5-9,5 prevista dal programma), quindi ogni serie
// storica è di fatto un rep-max reale: si prende la stima più alta mai registrata,
// non una media, perché è quella la vera capacità dimostrata. Nessun decadimento
// temporale: se una prestazione è invecchiata, si ricalcola/corregge a mano.
function computeEstimatedMaxFromHistory(exId){
  var best = null;
  state.workouts.forEach(function(w){
    w.exercises.forEach(function(ex){
      if(ex.id !== exId) return;
      ex.sets.forEach(function(s){
        if(!s.reps || s.peso == null || s.peso <= 0) return;
        var epley = s.peso * (1 + s.reps/30);
        if(!best || epley > best.value){
          best = {value: Math.round(epley*10)/10, date: w.date, fromWeight: s.peso, fromReps: s.reps};
        }
      });
    });
  });
  return best;
}

// Popola automaticamente i massimali stimati dei principali dallo storico già presente,
// la prima volta che non c'è ancora una stima salvata (manuale o precedente) per quell'esercizio.
(function initMaxes(){
  if(!state.maxes) state.maxes = {};
  var changed = false;
  Object.keys(state.exercises).forEach(function(exId){
    var cfg = state.exercises[exId];
    if(cfg.kind === "principal" && !state.maxes[exId]){
      var est = computeEstimatedMaxFromHistory(exId);
      if(est){
        state.maxes[exId] = {value: est.value, date: est.date, source: "storico", fromWeight: est.fromWeight, fromReps: est.fromReps};
        changed = true;
      }
    }
  });
  if(changed) saveJSON(LS.maxes, state.maxes);
})();

/* ============================================================
   TARGET STIMATI DA FORMULA (prerequisito "mesociclo", 2026-09-18)
   Non sostituisce ancora TARGETS (i numeri fissi restano quelli usati ogni
   giorno nel diario/Oggi, già verificati) — questa è una vista di CONFRONTO
   in Impostazioni, per controllare che la formula torni prima di eventualmente
   passare a target "vivi" che si aggiornano da soli col peso reale.
   BMR: Mifflin-St Jeor uomo. Moltiplicatore di attività per Riposo/Allenamento
   calibrato risolvendo TARGETS.kcal = BMR(71kg) × moltiplicatore — 71kg e le
   grammature attuali (150g prot/65g grassi) sono il peso/target già confermati
   in dieta.md, non un'invenzione. g/kg proteine e grassi derivati dallo stesso
   riferimento (150/71 e 65/71) invece del valore arrotondato usato in chat
   (2,1 e 0,9 g/kg), così a 71kg la formula riproduce esattamente kcal/proteine/
   grassi di oggi. I carboidrati sono calcolati "a riempimento" (kcal restanti
   /4), come da regola già scritta in dieta.md — a 71kg questo NON torna
   uguale al carboidrato fisso attuale (180g/250g): il piano fisso lascia un
   margine di circa 65 kcal non assegnato a nessun macro (196g/280g "a
   riempimento" contro 180g/250g fissi) — scoperto calcolando, non è un errore
   della formula, è solo una discrepanza mai notata prima nel piano fisso.
   ============================================================ */
var BMR_REFERENCE_WEIGHT = 71; // peso su cui sono calibrati i TARGETS fissi attuali (dieta.md)
var PROTEIN_G_PER_KG = TARGETS.riposo.prot / BMR_REFERENCE_WEIGHT;
var FAT_G_PER_KG = TARGETS.riposo.grassi / BMR_REFERENCE_WEIGHT;
function estimatedBMR(peso){
  return 10*peso + 6.25*state.bodyConfig.altezza - 5*state.bodyConfig.eta + 5;
}
var ACTIVITY_MULT = {
  riposo: TARGETS.riposo.kcal / estimatedBMR(BMR_REFERENCE_WEIGHT),
  allenamento: TARGETS.allenamento.kcal / estimatedBMR(BMR_REFERENCE_WEIGHT)
};

// --- Stima massa grassa: metodo a nastro US Navy (2026-09-19) ---------
// Discusso con Marco: la sua bilancia BIA Xiaomi giudicata "non particolarmente
// affidabile" — confermato dalla letteratura (le smart scale BIA sottostimano
// la massa grassa anche di 2-4,4kg vs DEXA e sono molto sensibili a
// idratazione/orario/cibo: studio 2021, JMIR mHealth, citato via bodyspec.com).
// Il metodo a nastro è l'alternativa proposta, senza attrezzatura: formula
// metrica per uomini (fonte: omnicalculator.com / med.libretexts.org, metodo
// US Navy). Margine di errore tipico ±3-4 punti percentuali — va letto come un
// trend nel tempo (più misurazioni, stessa logica della media 7gg sul peso),
// mai come un valore assoluto preciso da una singola misurazione.
function navyBodyFatMale(vitaCm, colloCm, altezzaCm){
  if(!vitaCm || !colloCm || !altezzaCm || vitaCm <= colloCm) return null;
  var bf = 495 / (1.0324 - 0.19077*Math.log10(vitaCm - colloCm) + 0.15456*Math.log10(altezzaCm)) - 450;
  if(!isFinite(bf) || bf <= 0 || bf >= 100) return null;
  return Math.round(bf * 10) / 10;
}

// --- Stima target Kathrine (compagna) ---------------------------------
// Formula di Mifflin-St Jeor versione femminile (quella sopra, estimatedBMR,
// è la versione maschile calibrata su Marco): BMR = 10*peso + 6.25*altezza
// - 5*età - 161 (invece di +5). Stessa formula, costante diversa per sesso.
function estimatedBMRDonna(peso, altezza, eta){
  return 10*peso + 6.25*altezza - 5*eta - 161;
}
// Moltiplicatore TDEE "Sedentaria" (poco/nessun esercizio strutturato):
// convenzione standard 1.2, fonte NASM (nasm.org/resource-center/blog/
// nutrition/calorie-calculator) — non è nel paper originale di Mifflin-St
// Jeor 1990 (che definisce solo il BMR, non i moltiplicatori di attività),
// ma è la convenzione più diffusa (stessa scala 1.2/1.375/1.55/1.725/1.9
// usata da NASM/Medscape). Usato come base "giorno normale" per Kathrine.
var TDEE_SEDENTARY_MULT = 1.2;
// MET Yoga Hatha: 2.3 — fonte "2024 Adult Compendium of Physical Activities"
// (Herrmann et al., J Sport Health Sci 2024, codice attività 02150 "Yoga,
// Hatha"; anche 02175 "Yoga, General" = 2.3). Nota: edizioni più vecchie
// (1993/2000) riportavano 2.5 — qui si usa il valore aggiornato 2024.
var YOGA_MET = 2.3;
// MET Corsa per fascia di ritmo — stessa fonte (2024 Adult Compendium),
// righe "Running" per velocità in mph/min-mile convertite in km/h (la
// conversione km/h è mia, il Compendium lista solo mph/min-mile). Ritmo
// reale di Kathrine non noto: fascia selezionabile, non assunta.
var RUNNING_MET_OPTIONS = [
  {id:"jog", label:"Jogging leggero (ritmo libero)", met:7.5},
  {id:"corsa_lenta", label:"Corsa lenta (~8 km/h, 12 min/km)", met:8.5},
  {id:"corsa_media", label:"Corsa media (~10 km/h, 10 min/km)", met:9.3},
  {id:"corsa_sostenuta", label:"Corsa sostenuta (~11.3 km/h, 8:30 min/km)", met:11.0},
  {id:"corsa_veloce", label:"Corsa veloce (~12.9 km/h, 7:30 min/km)", met:12.0}
];
// Extra kcal per la sessione = MET × peso(kg) × ore, la stessa logica già
// usata per le uscite in bici di Marco (BIKE_RATES sopra), qui applicata a
// un MET pubblicato invece che a un dato Garmin calibrato — coerente col
// fatto che per lei non abbiamo (ancora) dati reali di allenamento.
function computePartnerTargets(){
  var p = state.partner;
  if(!p || !p.peso || !p.altezza || !p.eta) return null;
  var bmr = estimatedBMRDonna(p.peso, p.altezza, p.eta);
  var base = Math.round(bmr * TDEE_SEDENTARY_MULT);
  var extraKcal = 0, met = null, runOpt = null;
  if(p.attivita === "yoga"){
    met = YOGA_MET;
    extraKcal = Math.round(met * p.peso * (p.oreSessione || 0));
  } else if(p.attivita === "corsa"){
    runOpt = RUNNING_MET_OPTIONS.find(function(o){ return o.id === p.corsaVelocita; }) || RUNNING_MET_OPTIONS[2];
    met = runOpt.met;
    extraKcal = Math.round(met * p.peso * (p.oreSessione || 0));
  }
  return {bmr: Math.round(bmr), base: base, extraKcal: extraKcal, total: base + extraKcal, met: met, runOpt: runOpt};
}
function formulaWeightNow(){
  var avg = sevenDayAvg();
  if(avg) return avg;
  if(state.bodyweight.length) return state.bodyweight[state.bodyweight.length-1].peso;
  return BMR_REFERENCE_WEIGHT;
}
function computeFormulaTargets(){
  var peso = formulaWeightNow();
  var bmr = estimatedBMR(peso);
  var out = {};
  ["riposo","allenamento"].forEach(function(key){
    var kcal = Math.round(bmr * ACTIVITY_MULT[key]);
    var prot = Math.round(PROTEIN_G_PER_KG * peso);
    var grassi = Math.round(FAT_G_PER_KG * peso);
    var carb = Math.round((kcal - prot*4 - grassi*9) / 4);
    out[key] = {kcal: kcal, prot: prot, carb: carb, grassi: grassi};
  });
  return {peso: peso, bmr: Math.round(bmr), targets: out};
}

function formatRest(sec){
  if(!sec) return "—";
  if(sec % 60 === 0) return (sec/60)+" min";
  var m = Math.floor(sec/60), s = sec % 60;
  return m+"'"+s+'"';
}

/* ============================================================
   DIARIO ALIMENTARE: registro in testo libero.
   Niente riconoscimento di alimenti/calcolo kcal-macro in locale (matching per
   parole chiave troppo fragile). Il calcolo lo fa l'IA: si copia il diario
   ("Copia diario"), lo si incolla in chat, e la risposta dell'IA — che include
   righe in formato id|kcal|proteine|carbo|grassi — si incolla a sua volta
   nell'app ("Incolla i macro") per popolare i totali e vedere quanto resta
   nella giornata (utile per bilanciare cena/spuntino se un pasto è saltato).
   ============================================================ */
function round1(n){ return Math.round(n*10)/10; }

function mealTypeOrder(mt){
  var i = MEAL_TYPES.indexOf(mt);
  return i === -1 ? MEAL_TYPES.length : i;
}

function nutritionDays(limitDays){
  var byDate = {};
  state.nutrition.forEach(function(n){
    if(!byDate[n.date]) byDate[n.date] = [];
    byDate[n.date].push(n);
  });
  var dates = Object.keys(byDate).sort().reverse();
  if(limitDays) dates = dates.slice(0, limitDays);
  return dates.map(function(d){
    var entries = byDate[d].slice().sort(function(a,b){ return mealTypeOrder(a.mealType) - mealTypeOrder(b.mealType); });
    return {date: d, entries: entries};
  });
}

function hasMacro(n){ return typeof n.kcal === "number"; }

// Totali del giorno calcolati solo sui pasti che hanno già i macro (dopo un
// "Incolla i macro"): utile per sapere quanto resta rispetto al target anche
// se non tutti i pasti della giornata sono stati calcolati.
function nutritionTotalsForDate(date){
  var entries = state.nutrition.filter(function(n){ return n.date === date; });
  var t = {kcal:0, prot:0, carb:0, fat:0};
  var computed = 0;
  entries.forEach(function(n){
    if(hasMacro(n)){ t.kcal+=n.kcal; t.prot+=n.prot; t.carb+=n.carb; t.fat+=n.fat; computed++; }
  });
  return {entries: entries, totals: t, computed: computed};
}

// Testo pronto da incollare in una chat con l'IA per farsi calcolare kcal/macro
// e ricevere consigli — include i target di riferimento, il peso medio e
// l'istruzione sul formato di risposta, così il testo è autosufficiente anche
// in una chat nuova senza altro contesto. Ogni pasto porta il suo id tra parentesi
// graffe per permettere di reincollare i numeri nel pasto giusto; i pasti già
// calcolati mostrano il valore così l'IA non deve ricalcolarli.
function buildDiaryText(limitDays){
  var days = nutritionDays(limitDays);
  var lines = [];
  var mt = computeMesocicloTargets(); // target della fase Mesociclo attuale, non più i fissi a prescindere (vedi computeTargetsForDate)
  lines.push("Diario alimentare — " + (limitDays === 1 ? "oggi" : "ultimi " + limitDays + " giorni"));
  lines.push("Target: giorno di allenamento " + mt.allenamento.kcal + " kcal / " + mt.allenamento.prot + "g prot / " + mt.allenamento.carb + "g carb / " + mt.allenamento.grassi + "g grassi — giorno di riposo " + mt.riposo.kcal + " kcal / " + mt.riposo.prot + "g prot / " + mt.riposo.carb + "g carb / " + mt.riposo.grassi + "g grassi.");
  var avg7 = sevenDayAvg();
  if(avg7) lines.push("Peso corporeo (media 7gg): " + fmtNum(avg7) + " kg.");
  lines.push("");
  lines.push("Per ogni pasto qui sotto SENZA valore [già calcolato: ...], calcola kcal/proteine/carboidrati/grassi e includi nella risposta una riga per pasto in questo formato esatto (una riga per pasto, niente altro su quella riga): id|kcal|proteine_g|carbo_g|grassi_g — userò la tua risposta intera, incollata così com'è, per aggiornare l'app.");
  lines.push("");
  if(!days.length){
    lines.push("(nessun pasto registrato)");
  } else {
    days.forEach(function(d){
      var dt = dayTypeFor(d.date);
      var dTarget = computeTargetsForDate(d.date);
      var rideNote = dTarget.ride ? (" + bici " + BIKE_RATES[dTarget.ride.tipo].label + " " + fmtNum(dTarget.ride.ore) + "h (target del giorno: " + dTarget.kcal + " kcal / " + dTarget.carb + "g carb)") : "";
      lines.push(fmtDateIt(d.date) + " — " + (dt === "allenamento" ? "giorno di allenamento" : "giorno di riposo") + rideNote);
      d.entries.forEach(function(n){
        var macroTag = hasMacro(n) ? "  [già calcolato: "+fmtNum(n.kcal)+" kcal / "+fmtNum(n.prot)+"g prot / "+fmtNum(n.carb)+"g carb / "+fmtNum(n.fat)+"g grassi]" : "";
        lines.push("- " + (n.mealType || "Pasto") + ": " + n.text + "  {id: "+n.id+"}" + macroTag);
      });
      lines.push("");
    });
  }
  return lines.join("\n").trim();
}

/* ============================================================
   ANALISI ALLENAMENTO (IA) — stesso giro di "copia testo, analizza
   in chat, incolla il report" usato per il diario alimentare.
   Qui però il testo incollato non viene parsato: è salvato così
   com'è e mostrato in cima a "Prossima seduta".
   ============================================================ */
function kindLabel(kind){
  if(kind === "principal") return "principale";
  if(kind === "legraise") return "isolamento/finisher";
  return "accessorio";
}
function setsText(sets){
  return sets.map(function(s){ return fmtNum(s.peso)+"x"+s.reps; }).join(", ");
}
function exerciseLine(exId, sets){
  var cfg = state.exercises[exId];
  if(cfg.kind === "principal"){
    var scheme = weekSchemeFor(exId);
    var m = state.maxes[exId];
    return cfg.name + " (principale, settimana " + currentCycleWeek(exId) + "/5 del ciclo, target " + scheme.sets + "x" + scheme.reps + " @" + Math.round(scheme.pct*100) + "%" + (m ? (" di 1RM stimato "+fmtNum(m.value)+"kg") : "") + ", incremento " + fmtNum(cfg.inc) + " " + cfg.unit + "): " + setsText(sets);
  }
  return cfg.name + " (" + kindLabel(cfg.kind) + ", target " + cfg.lo + (cfg.lo!==cfg.hi ? "-"+cfg.hi : "") + " rip, incremento " + fmtNum(cfg.inc) + " " + cfg.unit + "): " + setsText(sets);
}
function trainingRulesText(){
  return "Regole di progressione (Project Invictus): esercizi principali (panca piana, squat, dips zavorrate) — Progressione Lineare di Carico, ciclo di 5 settimane, serie fisse (4x, 2x in scarico), solo le rip scendono mentre il carico sale in base al %1RM stimato (sett.1 4x8@73%, sett.2 4x6@78%, sett.3 4x5@82%, sett.4 4x3@88%, sett.5 scarico 2x3@85%); il carico in kg è ricavato dal massimale stimato con Epley dallo storico (serie più pesante mai registrata, valida perché si allena a cedimento vero). Esercizi accessori (range di ripetizioni), RPE 8,5-10 (0-1 rip di riserva) — si sale prima con le ripetizioni fino al limite alto del range, si aggiunge carico solo quando TUTTE le serie chiudono al limite alto, poi si riparte dal limite basso. Leg raise (isolamento/finisher) può arrivare a RPE 10/cedimento tecnico, ginocchia a 90° per limiti di flessibilità, progressione prima con le ripetizioni poi con zavorra ai piedi. Deload ogni ~5 settimane. Obiettivo attuale: ricomposizione corporea con deficit leggero; da novembre 2026 fase di massa.";
}
function buildSessionAnalysisText(){
  var list = sortedWorkoutsAsc();
  if(!list.length) return "Nessuna seduta ancora registrata.";
  var w = list[list.length-1];
  var scheda = SCHEDE[w.scheda];
  var lines = [];
  lines.push("Analisi ultima seduta — " + fmtDateIt(w.date) + " — Scheda " + w.scheda + " (" + scheda.name + ")" + (w.variant ? " [variante]" : ""));
  lines.push(trainingRulesText());
  lines.push("");
  lines.push("Per ogni esercizio sotto c'è, se esiste, la seduta precedente dello stesso esercizio per il confronto.");
  lines.push("");
  w.exercises.forEach(function(e){
    lines.push("- " + exerciseLine(e.id, e.sets));
    var prev = lastPerformance(e.id, w.id);
    lines.push("  precedente" + (prev ? (" (" + fmtDateIt(prev.workout.date) + "): " + setsText(prev.ex.sets)) : ": nessuno storico"));
  });
  lines.push("");
  lines.push("Dammi un report leggibile (non serve un formato rigido): valutazione della seduta, se la progressione è coerente con le regole sopra, eventuali segnali di stallo o affaticamento, cosa aspettarmi/puntare alla prossima Scheda " + w.scheda + ".");
  return lines.join("\n").trim();
}
function buildWeekAnalysisText(days){
  days = days || 14;
  var cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - days);
  var cutoffISO = isoFromDate(cutoff);
  var list = sortedWorkoutsAsc().filter(function(w){ return w.date >= cutoffISO; });
  var lines = [];
  lines.push("Analisi settimana — ultimi " + days + " giorni (" + list.length + " sedute registrate)");
  lines.push(trainingRulesText());
  var avg7 = sevenDayAvg();
  if(avg7) lines.push("Peso corporeo (media 7gg): " + fmtNum(avg7) + " kg.");
  lines.push("");
  if(!list.length){
    lines.push("(nessuna seduta in questo periodo)");
  } else {
    list.forEach(function(w){
      var scheda = SCHEDE[w.scheda];
      lines.push(fmtDateIt(w.date) + " — Scheda " + w.scheda + " (" + scheda.name + ")" + (w.variant ? " [variante]" : ""));
      w.exercises.forEach(function(e){ lines.push("  - " + exerciseLine(e.id, e.sets)); });
      lines.push("");
    });
  }
  lines.push("Dammi un report leggibile sull'andamento: quali esercizi progrediscono bene, quali sembrano in stallo, se il deload (ogni ~5 settimane) è vicino o già in ritardo, e qualunque altro segnale utile su questo periodo.");
  return lines.join("\n").trim();
}

/* ============================================================
   UTIL
   ============================================================ */
function fmtNum(n){
  n = Math.round(n * 100) / 100;
  return (n % 1 === 0) ? String(n) : String(n).replace(".", ",");
}
function todayISO(){
  return isoFromDate(new Date());
}
function isoFromDate(d){
  var m = String(d.getMonth()+1).padStart(2,"0");
  var day = String(d.getDate()).padStart(2,"0");
  return d.getFullYear()+"-"+m+"-"+day;
}
function fmtDateIt(iso){
  var parts = iso.split("-");
  return parts[2]+"/"+parts[1]+"/"+parts[0];
}
function addWeeksToDate(iso, weeks){
  var parts = iso.split("-").map(Number);
  var d = new Date(parts[0], parts[1]-1, parts[2]);
  d.setDate(d.getDate() + Math.round((weeks||0) * 7));
  return isoFromDate(d);
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

var toastTimer = null;
function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 1800);
}

/* ============================================================
   LOGICA ROTAZIONE
   ============================================================ */
function nextSchedaId(){
  return ROTATION_SEQUENCE[state.rotationIndex % ROTATION_SEQUENCE.length];
}
function advanceRotation(){
  state.rotationIndex = (state.rotationIndex + 1) % ROTATION_SEQUENCE.length;
}

/* ============================================================
   LOGICA STORICO / SUGGERIMENTI
   ============================================================ */
// Ordina le sedute per data (crescente); a parità di data, per ordine di inserimento (id).
// Serve perché con la modifica/aggiunta di sedute retroattive l'ordine nell'array
// non è più garantito coincidere con l'ordine cronologico reale.
function sortedWorkoutsAsc(){
  return state.workouts.slice().sort(function(a,b){
    if(a.date !== b.date) return a.date < b.date ? -1 : 1;
    return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0);
  });
}

function lastPerformance(exId, excludeId){
  var list = sortedWorkoutsAsc();
  for(var i = list.length - 1; i >= 0; i--){
    var w = list[i];
    if(excludeId && w.id === excludeId) continue;
    for(var j = 0; j < w.exercises.length; j++){
      if(w.exercises[j].id === exId) return {workout:w, ex:w.exercises[j]};
    }
  }
  return null;
}

// Peso di riferimento di una seduta: il peso più frequente tra le serie loggate,
// non semplicemente quello della prima serie. Serve a non farsi sballare il
// riferimento da un riscaldamento loggato per errore come "Serie 1" (capita
// quando si logga un primo set più leggero prima delle serie vere di lavoro):
// se 2 serie su 3 condividono lo stesso peso, è quello il peso di lavoro reale.
// A parità di frequenza (es. tre pesi tutti diversi) si preferisce il più alto,
// assumendo che l'eventuale scostamento sia un riscaldamento più leggero e non
// il contrario (pattern mai osservato finora nei log di Marco).
function modeWeight(sets){
  if(!sets.length) return 0;
  var counts = {}, order = [];
  sets.forEach(function(s){
    var key = String(s.peso);
    if(!(key in counts)){ counts[key] = 0; order.push(key); }
    counts[key]++;
  });
  var best = null, bestCount = 0;
  order.forEach(function(key){
    var w = parseFloat(key);
    if(counts[key] > bestCount || (counts[key] === bestCount && (best === null || w > best))){
      best = w; bestCount = counts[key];
    }
  });
  return best;
}

// Settimana corrente (1-5) del ciclo di Progressione Lineare di Carico per un esercizio
// principale. Ogni esercizio principale ha il proprio contatore (panca/squat/dips non
// sono per forza allineati, dato che ognuno si allena una volta a settimana su giorni
// diversi) — avanza in saveLog() ad ogni seduta salvata (non in modifica).
function currentCycleWeek(exId){
  return (state.cycleWeek && state.cycleWeek[exId]) || 1;
}
function weekSchemeFor(exId){
  return WEEK_SCHEME[currentCycleWeek(exId) - 1];
}
// Quante serie fare oggi per un esercizio: per i principali dipende dalla settimana del
// ciclo (4 serie, 2 in settimana di scarico); per gli altri è il default fisso.
function setsCountFor(exId){
  var cfg = state.exercises[exId];
  if(cfg.kind === "principal") return weekSchemeFor(exId).sets;
  return cfg.defSets;
}

// Riscaldamento prima della prima serie allenante di un principale: rampa a scalare
// verso il peso di lavoro del giorno, arrotondata all'incremento dell'esercizio.
// Salta gli step che arrotondano allo stesso peso dello step precedente (carichi bassi
// o zavorra vicina a 0, dove il 50%/70% non fa differenza pratica).
function warmupPlan(exId, workingWeight){
  var cfg = state.exercises[exId];
  if(!workingWeight || workingWeight <= 0) return null;
  var steps = [{pct:0.5, reps:8}, {pct:0.7, reps:4}, {pct:0.85, reps:2}];
  var out = [];
  steps.forEach(function(s){
    var w = Math.round((workingWeight * s.pct) / cfg.inc) * cfg.inc;
    if(w < 0) w = 0;
    if(out.length && out[out.length-1].weight === w) return;
    out.push({weight: w, reps: s.reps});
  });
  return out;
}

// Ritorna {weight, targetLo, targetHi, sets, note, hasHistory}
function suggestFor(exId, setsCount, excludeId){
  var cfg = state.exercises[exId];
  var perf = lastPerformance(exId, excludeId);
  var startWeight = (exId === "leg_raise" || exId === "dips_zavorrate" || exId === "trazioni") ? 0 : 0;
  if(!perf){
    return {
      weight: startWeight,
      reps: new Array(setsCount).fill(cfg.lo),
      note: "Prima volta: parti leggero e trova il carico.",
      noteType:"hold"
    };
  }
  var lastSets = perf.ex.sets;
  var lastWeight = lastSets.length ? modeWeight(lastSets) : startWeight;
  var allAtTop = lastSets.length > 0 && lastSets.every(function(s){ return s.reps >= cfg.hi; });

  var newWeight = lastWeight;
  var repsGuess;
  var note, noteType;

  if(cfg.kind === "principal"){
    var week = currentCycleWeek(exId);
    var scheme = weekSchemeFor(exId);
    var maxInfo = state.maxes[exId];
    if(maxInfo && maxInfo.value){
      var rawW = maxInfo.value * scheme.pct;
      newWeight = Math.round(rawW / cfg.inc) * cfg.inc;
      if(newWeight < 0) newWeight = 0;
      note = "Settimana " + week + "/5" + (scheme.deload ? " (scarico)" : "") + " — " +
             scheme.sets + "x" + scheme.reps + " @" + Math.round(scheme.pct*100) + "% ≈ " +
             fmtNum(newWeight) + " kg · RPE " + scheme.rpe;
      noteType = scheme.deload ? "hold" : "up";
      repsGuess = new Array(setsCount).fill(scheme.reps);
    } else if(allAtTop){
      newWeight = lastWeight + cfg.inc;
      note = "Settimana " + week + "/5 — " + scheme.sets + "x" + scheme.reps +
             ". Nessun massimale stimato (impostalo in Impostazioni): sali a " + fmtNum(newWeight) + " kg";
      noteType = "up";
      repsGuess = new Array(setsCount).fill(scheme.reps);
    } else {
      note = "Settimana " + week + "/5 — " + scheme.sets + "x" + scheme.reps +
             ". Nessun massimale stimato (impostalo in Impostazioni): ripeti " + fmtNum(lastWeight) + " kg";
      noteType = "hold";
      repsGuess = new Array(setsCount).fill(scheme.reps);
    }
  } else {
    if(allAtTop){
      newWeight = lastWeight + cfg.inc;
      note = "Top range raggiunto: sali a " + fmtNum(newWeight) + " kg, riparti da " + cfg.lo;
      noteType = "up";
      repsGuess = new Array(setsCount).fill(cfg.lo);
    } else {
      note = "Ripeti " + fmtNum(lastWeight) + " kg, punta a " + cfg.hi;
      noteType = "hold";
      repsGuess = lastSets.map(function(s){ return s.reps; });
    }
  }
  while(repsGuess.length < setsCount) repsGuess.push(cfg.lo);
  repsGuess = repsGuess.slice(0, setsCount);

  return {
    weight: newWeight,
    reps: repsGuess,
    note: note,
    noteType: noteType,
    lastText: lastSets.map(function(s){ return fmtNum(s.peso)+"x"+s.reps; }).join(", "),
    lastDate: perf.workout.date
  };
}

/* ============================================================
   STATO SESSIONE DI LOG IN CORSO (non persistito finché non salvo)
   ============================================================ */
var logSession = null; // {schedaId, variant, date, editId, exIds, sets: {exId: [{peso,reps,done}, ...]}}
// Ripristino automatico: se l'app si è chiusa/crashata con una seduta in corso, la bozza
// salvata da persistLogDraft() viene ricaricata qui, prima del primo render — la seduta
// riprende esattamente da dove era rimasta, senza bisogno di azioni da parte dell'utente.
logSession = loadJSON(LS.logDraft, null);

function startLog(schedaId, variant){
  var scheda = SCHEDE[schedaId];
  var exIds = scheda.exercises.slice();
  if(schedaId === "B" && variant){
    exIds = exIds.filter(function(id){ return id !== "squat"; });
  }
  var sets = {};
  exIds.forEach(function(exId){
    var cfg = state.exercises[exId];
    var setsCount = setsCountFor(exId);
    if(schedaId === "B" && variant && exId === "leg_press") setsCount = 4;
    var sug = suggestFor(exId, setsCount);
    var arr = [];
    for(var i=0;i<setsCount;i++){
      arr.push({peso: sug.weight, reps: (sug.reps[i] !== undefined ? sug.reps[i] : cfg.lo), done:false});
    }
    sets[exId] = arr;
  });
  logSession = {schedaId: schedaId, variant: !!variant, date: todayISO(), editId: null, exIds: exIds, sets: sets};
  persistLogDraft();
  showTab("oggi");
}

// Riapre una seduta già salvata per correggerla (carichi/rip/data sbagliati,
// o una seduta dimenticata inserita col giorno sbagliato).
function editSession(id){
  var w = state.workouts.find(function(x){ return x.id === id; });
  if(!w) return;
  var exIds = w.exercises.map(function(e){ return e.id; });
  var sets = {};
  w.exercises.forEach(function(e){
    sets[e.id] = e.sets.map(function(s){ return {peso:s.peso, reps:s.reps, done:true}; });
  });
  logSession = {schedaId: w.scheda, variant: !!w.variant, date: w.date, editId: w.id, exIds: exIds, sets: sets};
  persistLogDraft();
  showTab("oggi");
}

function cancelLog(){
  logSession = null;
  persistLogDraft(); // rimuove la bozza salvata, altrimenti riapparirebbe al prossimo avvio
  render();
}

// Pulsante "Salva": checkpoint esplicito durante la seduta, non la chiude — la bozza è già
// salvata automaticamente ad ogni modifica, questo dà solo la conferma visibile a schermo.
function saveLogDraftManual(){
  if(!logSession) return;
  persistLogDraft();
  toast("Progresso salvato ✓");
}

function saveLog(){
  if(!logSession) return;
  var exercisesOut = logSession.exIds.map(function(exId){
    return {id: exId, sets: logSession.sets[exId].map(function(s){ return {peso:s.peso, reps:s.reps}; })};
  });
  if(logSession.editId){
    var idx = state.workouts.findIndex(function(w){ return w.id === logSession.editId; });
    if(idx > -1){
      state.workouts[idx] = {
        id: logSession.editId,
        date: logSession.date || todayISO(),
        scheda: logSession.schedaId,
        variant: logSession.variant,
        exercises: exercisesOut
      };
    }
    persistAll();
    logSession = null;
    persistLogDraft();
    toast("Seduta aggiornata ✓");
    render();
    return;
  }
  var workout = {
    id: uid(),
    date: logSession.date || todayISO(),
    scheda: logSession.schedaId,
    variant: logSession.variant,
    exercises: exercisesOut
  };
  state.workouts.push(workout);
  advanceRotation();
  // Avanza la settimana del ciclo di Progressione Lineare di Carico per ogni principale
  // svolto in questa seduta (contatore indipendente per esercizio, non per scheda).
  exercisesOut.forEach(function(exo){
    var cfgEx = state.exercises[exo.id];
    if(cfgEx && cfgEx.kind === "principal"){
      var w = currentCycleWeek(exo.id);
      state.cycleWeek[exo.id] = (w >= 5) ? 1 : (w + 1);
    }
  });
  persistAll();
  logSession = null;
  persistLogDraft();
  toast("Seduta salvata ✓");
  render();
}

function stepSet(exId, idx, field, delta){
  var s = logSession.sets[exId][idx];
  if(field === "peso"){
    var cfg = state.exercises[exId];
    s.peso = Math.max(0, Math.round((s.peso + delta * cfg.inc) * 100) / 100);
  } else {
    s.reps = Math.max(0, s.reps + delta);
  }
  persistLogDraft();
  render();
}

function setVal(exId, idx, field, raw){
  var s = logSession.sets[exId][idx];
  var v = parseFloat(String(raw).replace(",", "."));
  if(isNaN(v) || v < 0) v = 0;
  s[field] = (field === "peso") ? (Math.round(v*100)/100) : Math.round(v);
  persistLogDraft();
  render();
}

function toggleDone(exId, idx){
  var s = logSession.sets[exId][idx];
  s.done = !s.done;
  persistLogDraft();
  render();
}

/* ============================================================
   RENDER: OGGI
   ============================================================ */
function renderOggi(){
  var el = document.getElementById("view-oggi");

  if(logSession){
    var scheda = SCHEDE[logSession.schedaId];
    var html = "";
    html += '<div class="card">';
    html += '<div class="row between">';
    html += '<h2 style="margin:0">Scheda '+logSession.schedaId+' — '+scheda.name+'</h2>';
    if(logSession.variant) html += '<span class="badge variant">variante no-squat</span>';
    if(logSession.editId) html += '<span class="badge" style="color:#f2c14e;">modifica</span>';

function sevenDayAvg(){
  if(!state.bodyweight.length) return null;
  var sorted = state.bodyweight.slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; });

  var sum = last7.reduce(function(a,b){ return a+b.peso; }, 0);
  return sum / last7.length;
}

function rowsToCSVText(rows){
  return rows.map(function(r){
    return r.map(function(v){
      v = String(v);
      if(v.indexOf(",")>-1 || v.indexOf('"')>-1){ v = '"'+v.replace(/"/g,'""')+'"'; }
      return v;
    }).join(",");
  }).join("\n");
}

function toCSV(){
  var rows = [["=== SEDUTE ==="],["data","scheda","variante","esercizio","serie","peso","ripetizioni"]];
  state.workouts.forEach(function(w){
    w.exercises.forEach(function(ex){
      var cfg = state.exercises[ex.id] || {name: ex.id};
      ex.sets.forEach(function(s, idx){
        rows.push([w.date, w.scheda, w.variant?"si":"no", cfg.name, String(idx+1), fmtNum(s.peso), String(s.reps)]);
      });
    });
  });

  rows.push([]);
  rows.push(["=== PESO CORPOREO ==="]);
  rows.push(["data","peso_kg","vita_cm","collo_cm","grasso_percento"]);
  state.bodyweight.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; }).forEach(function(b){
    rows.push([b.date, fmtNum(b.peso), b.vita!=null?fmtNum(b.vita):"", b.collo!=null?fmtNum(b.collo):"", b.bf!=null?fmtNum(b.bf):""]);
  });

  rows.push([]);
  rows.push(["=== ALIMENTAZIONE ==="]);
  rows.push(["data","pasto","testo","kcal","proteine_g","carbo_g","grassi_g"]);
  state.nutrition.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; }).forEach(function(n){
    rows.push([n.date, n.mealType||"Pasto", n.text, hasMacro(n)?fmtNum(n.kcal):"", hasMacro(n)?fmtNum(n.prot):"", hasMacro(n)?fmtNum(n.carb):"", hasMacro(n)?fmtNum(n.fat):""]);
  });

  return rowsToCSVText(rows);
}

function doExport(format){
  var content = format === "csv" ? toCSV() : toJSON();
  var filename = "trainer-registro-"+todayISO()+"."+format;
  var mime = format === "csv" ? "text/csv" : "application/json";

  var box = document.getElementById("exportBox");

  function showFallback(){
    var h = '<div class="field" style="margin-top:12px;">';
    h += '<label>Contenuto '+format.toUpperCase()+' (copia da qui se la condivisione non funziona)</label>';
    h += '<textarea class="export-box" readonly id="exportTextarea">'+content.replace(/</g,"&lt;")+'</textarea>';
    h += '<button class="btn small" style="margin-top:8px;" data-act="copy-export">Copia negli appunti</button>';
    h += '</div>';
    if(box) box.innerHTML = h;
  }

  if(navigator.share && navigator.canShare){
    try{
      var file = new File([content], filename, {type: mime});
      if(navigator.canShare({files:[file]})){
        navigator.share({files:[file], title: filename}).catch(function(){ showFallback(); });
        return;
      }
    }catch(e){}
  }

  try{
    var blob = new Blob([content], {type: mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }catch(e){}

  showFallback();
}

// Applica i macro incollati dall'IA: cerca righe "id|kcal|proteine|carbo|grassi"
// (5 campi separati da |, il primo che combacia con l'id di un pasto salvato,
// gli altri quattro numerici) e ignora silenziosamente tutto il resto — così si
// può incollare l'intera risposta dell'IA, non serve isolare a mano le righe.
function applyMacroPaste(text){
  var lines = String(text || "").split(/\r?\n/);
  var applied = 0;
  lines.forEach(function(line){
    var parts = line.split("|");
    if(parts.length !== 5) return;
    var id = parts[0].trim();
    var n = state.nutrition.find(function(x){ return x.id === id; });
    if(!n) return;
    var kcal = parseFloat(String(parts[1]).replace(",", "."));
    var prot = parseFloat(String(parts[2]).replace(",", "."));
    var carb = parseFloat(String(parts[3]).replace(",", "."));
    var fat = parseFloat(String(parts[4]).replace(",", "."));
    if([kcal,prot,carb,fat].some(function(v){ return isNaN(v) || v < 0; })) return;
    n.kcal = round1(kcal); n.prot = round1(prot); n.carb = round1(carb); n.fat = round1(fat);
    applied++;
  });
  if(applied) persistAll();
  return {applied: applied};
}

function renderSparkline(){
  var sorted = state.bodyweight.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; }).slice(-14);
  if(sorted.length < 2) return '<p class="muted small">Servono più pesate.</p>';
  var vals = sorted.map(function(b){ return b.peso; });
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  var range = (max - min) || 1;
  var w = 300, h = 56, pad = 4;
  var pts = vals.map(function(v, i){
    var x = pad + (i/(vals.length-1)) * (w - pad*2);
    var y = h - pad - ((v - min)/range) * (h - pad*2);
    return x.toFixed(1)+","+y.toFixed(1);
  }).join(" ");
  return '<svg class="sparkline" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
    '<polyline points="'+pts+'" fill="none" stroke="#4fd18f" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
    '</svg>';
}

function schedaTable(id, variantNote){
  var scheda = SCHEDE[id];

  scheda.exercises.forEach(function(exId){
    var cfg = state.exercises[exId];
    var cell;
    if(cfg.kind === "principal"){
      var scheme = weekSchemeFor(exId);
      cell = scheme.sets+'×'+scheme.reps+' (sett. '+currentCycleWeek(exId)+'/5)';
    } else {
      var rr = cfg.lo === cfg.hi ? cfg.lo : (cfg.lo+"-"+cfg.hi);

    }
    html += '<tr><td>'+cfg.name+(cfg.kind==="principal"?' <span class="badge">principale</span>':'')+'</td><td>'+cell+'</td></tr>';
  });

  return html;
}

      html += '<p class="small muted" style="margin-top:4px;">Condisci e congela in uno qualsiasi dei giorni di cucina: il vincolo è il freezer, non il calendario. Si cuoce fresco dal surgelato giorno per giorno (vedi "Giorno per giorno" più sotto).</p>';
      cookPlan.freezerPrep.forEach(function(item){
        html += '<div class="exercise">';
        html += '<div class="exname">'+item.combo.name+' — '+fmtNum(item.qty)+' '+item.unit+' totali</div>';
        html += '<div class="exmeta">'+item.combo.technique+'</div>';
        html += '</div>';
      });
      html += '</div>';
    }

    cookPlan.sessions.forEach(function(s){
      html += '<div class="card"><h3 style="margin:0;">🔪 '+s.day.label+'</h3>';
      html += '<div class="muted small" style="margin-top:2px;">Copre: '+(s.coversLabel || '—')+'</div>';
      if(!s.items.length){
        html += '<p class="small muted" style="margin-top:8px;">Niente da preparare in blocco per questi giorni con il piano pasti attuale.</p>';
      } else {
        s.items.forEach(function(item){
          html += '<div class="exercise">';
          html += '<div class="exname">'+item.combo.name+' — '+fmtNum(item.qty)+' '+item.unit+'</div>';
          html += '<div class="exmeta">'+item.combo.technique+'</div>';
          html += '</div>';
        });
      }
      html += '</div>';
    });

    html += '<div class="card"><h3 style="margin:0;">Giorno per giorno</h3>';
    html += '<p class="small muted" style="margin-top:4px;">Solo la parte "al momento": cottura fresca da surgelato, o presa dal frigo. Il resto degli ingredienti del pasto (verdure fresche, uova, pane...) è nella lista della spesa in Consulta.</p>';
    WEEKDAYS.forEach(function(d){
      var isCookDay = state.cookDays.indexOf(d.key) > -1;
      var lines = [];
      if(isCookDay){
        var thisSession = cookPlan.sessions.find(function(s){ return s.day.key === d.key; });
        if(thisSession && thisSession.items.length){
          lines.push('🔪 Prepara: '+thisSession.items.map(function(it){ return it.combo.name; }).join(', ')+' (dettagli sopra)');
        }
      }
      dailyCookTasksFor(d.key).forEach(function(t){
        lines.push('🍳 '+t.combo.name+' ('+fmtNum(t.qty)+t.unit+', '+t.meal+') — '+(t.combo.regen || t.combo.technique));
      });
      var resp = responsibleCookDay(d.key);
      if(resp && resp !== d.key){
        var respSession = cookPlan.sessions.find(function(s){ return s.day.key === resp; });
        if(respSession && respSession.items.length){
          respSession.items.forEach(function(item){
            lines.push('🧊 '+item.combo.name+' — prendi dal frigo ('+respSession.day.label+')');
          });
        }
      }
      html += '<div class="exercise">';
      html += '<div class="exname">'+d.label+(isCookDay?' <span class="badge">cucina</span>':'')+'</div>';
      html += lines.length ? ('<div class="last-time">'+lines.join('<br>')+'</div>') : '<div class="last-time muted">Nessuna preparazione da catalogo per questo giorno.</div>';
      html += '</div>';
    });
    html += '</div>';
  }

  html += buildSaluteHTML();

  el.innerHTML = html;
}
