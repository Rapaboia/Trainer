}
body{
  display:flex;flex-direction:column;
  min-height:100vh;
  min-height:100dvh;
}

h1,h2,h3,p{margin:0 0 8px 0;}
.app-header{
  padding:calc(14px + var(--safe-t)) 16px 12px 16px;

main{

.view{display:none;}
.view.active{display:block;}
.card{

}
.card h2{font-size:16px;color:var(--accent);}

.small{font-size:12.5px;}
.row{display:flex;align-items:center;gap:10px;}

.stat{

button{

</main>

<nav class="tabbar">
  <button data-tab="oggi" class="tab-btn active"><span class="ic">🏋️</span><span>Oggi</span></button>

  <button data-tab="peso" class="tab-btn"><span class="ic">⚖️</span><span>Salute</span></button>
  <button data-tab="consulta" class="tab-btn"><span class="ic">📖</span><span>Consulta</span></button>
  <button data-tab="impostazioni" class="tab-btn"><span class="ic">⚙️</span><span>Impostazioni</span></button>
</nav>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ============================================================
   CONFIG DI DEFAULT
   ============================================================ */
var DEFAULT_EXERCISES = {
  panca_piana:        {name:"Panca piana bilanciere",       kind:"principal", lo:6,  hi:6,  inc:2.5,  unit:"kg", defSets:3},
  chest_press:         {name:"Chest press",                  kind:"range",     lo:8,  hi:10, inc:2.5,  unit:"kg", defSets:3},
  pulley_basso:        {name:"Pulley basso",                 kind:"range",     lo:8,  hi:10, inc:2.5,  unit:"kg", defSets:3},
  bayesan_curl:        {name:"Bayesan curl",                 kind:"range",     lo:10, hi:12, inc:2,    unit:"kg", defSets:3},
  curl_manubri_seduto: {name:"Curl manubri seduto",          kind:"range",     lo:10, hi:12, inc:2,    unit:"kg", defSets:3},
  leg_raise:           {name:"Leg raise sedia romana",       kind:"legraise",  lo:12, hi:15, inc:1.25, unit:"kg zavorra", defSets:3},
  squat:               {name:"Squat bilanciere",             kind:"principal", lo:6,  hi:6,  inc:5,    unit:"kg", defSets:3},
  leg_press:           {name:"Leg press",                    kind:"range",     lo:8,  hi:10, inc:5,    unit:"kg", defSets:3},
  calf_raise:          {name:"Calf raise",                   kind:"range",     lo:8,  hi:10, inc:2.5,  unit:"kg", defSets:3},
  lento_avanti:        {name:"Lento avanti manubri",         kind:"range",     lo:8,  hi:10, inc:2,    unit:"kg", defSets:3},
  alzate_laterali:     {name:"Alzate laterali manubri",      kind:"range",     lo:10, hi:12, inc:1,    unit:"kg", defSets:3},
  dips_zavorrate:      {name:"Dips zavorrate",                kind:"principal", lo:6,  hi:6,  inc:2.5,  unit:"kg zavorra", defSets:3},
  croci_cavi:          {name:"Croci ai cavi",                 kind:"range",     lo:10, hi:12, inc:2.5,  unit:"kg", defSets:3},
  trazioni:            {name:"Trazioni",                      kind:"range",     lo:6,  hi:8,  inc:2.5,  unit:"kg zavorra", defSets:3},
  push_down:           {name:"Push down al cavo alto",        kind:"range",     lo:8,  hi:10, inc:2.5,  unit:"kg", defSets:3},
  french_press:        {name:"French press bilanciere EZ",    kind:"range",     lo:8,  hi:10, inc:2.5,  unit:"kg", defSets:3}
};

var SCHEDE = {
  A: {name:"Petto e Dorso", exercises:["panca_piana","chest_press","pulley_basso","bayesan_curl","curl_manubri_seduto","leg_raise"]},
  B: {name:"Gambe e Spalle", exercises:["squat","leg_press","calf_raise","lento_avanti","alzate_laterali"]},
  C: {name:"Spinta e Tricipiti", exercises:["dips_zavorrate","croci_cavi","trazioni","push_down","french_press","leg_raise"]}
};

var ROTATION_SEQUENCE = ["B","A","B","C"];

/* ============================================================
   STORAGE
   ============================================================ */
var LS = {
  config: "pp_config_v1",
  workouts: "pp_workouts_v1",
  bodyweight: "pp_bodyweight_v1",
  rotation: "pp_rotation_index_v1",
  nutrition: "pp_nutrition_v1"
};

var TARGETS = {
  allenamento: {kcal: 2250, prot: 150, carb: 250, grassi: 65, label:"Giorno di allenamento"},
  riposo:      {kcal: 1970, prot: 150, carb: 180, grassi: 65, label:"Giorno di riposo"}
};

function loadJSON(key, fallback){
  try{
    var raw = localStorage.getItem(key);
    if(!raw) return fallback;
    return JSON.parse(raw);
  }catch(e){ return fallback; }
}
function saveJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}

var state = {
  exercises: loadJSON(LS.config, null) || JSON.parse(JSON.stringify(DEFAULT_EXERCISES)),
  workouts: loadJSON(LS.workouts, []),
  bodyweight: loadJSON(LS.bodyweight, []),
  rotationIndex: loadJSON(LS.rotation, 0),
  nutrition: loadJSON(LS.nutrition, [])
};
// merge in any new exercise keys added in future updates without wiping user edits
(function mergeConfig(){
  var changed = false;
  Object.keys(DEFAULT_EXERCISES).forEach(function(k){
    if(!state.exercises[k]){ state.exercises[k] = JSON.parse(JSON.stringify(DEFAULT_EXERCISES[k])); changed = true; }
  });
  if(changed) saveJSON(LS.config, state.exercises);
})();

function persistAll(){
  saveJSON(LS.config, state.exercises);
  saveJSON(LS.workouts, state.workouts);
  saveJSON(LS.bodyweight, state.bodyweight);
  saveJSON(LS.rotation, state.rotationIndex);
  saveJSON(LS.nutrition, state.nutrition);
}

function nutritionForDate(date){
  return state.nutrition.find(function(n){ return n.date === date; }) || null;
}
function dayTypeFor(date){
  var hasWorkout = state.workouts.some(function(w){ return w.date === date; });
  return hasWorkout ? "allenamento" : "riposo";
}

/* ============================================================
   UTIL
   ============================================================ */
function fmtNum(n){
  n = Math.round(n * 100) / 100;
  return (n % 1 === 0) ? String(n) : String(n).replace(".", ",");
}
function todayISO(){
  var d = new Date();
  var m = String(d.getMonth()+1).padStart(2,"0");
  var day = String(d.getDate()).padStart(2,"0");
  return d.getFullYear()+"-"+m+"-"+day;
}
function fmtDateIt(iso){
  var parts = iso.split("-");
  return parts[2]+"/"+parts[1]+"/"+parts[0];
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

var toastTimer = null;
function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 1800);
}

/* ============================================================
   LOGICA ROTAZIONE
   ============================================================ */
function nextSchedaId(){
  return ROTATION_SEQUENCE[state.rotationIndex % ROTATION_SEQUENCE.length];
}
function advanceRotation(){
  state.rotationIndex = (state.rotationIndex + 1) % ROTATION_SEQUENCE.length;
}

/* ============================================================
   LOGICA STORICO / SUGGERIMENTI
   ============================================================ */
function lastPerformance(exId){
  for(var i = state.workouts.length - 1; i >= 0; i--){
    var w = state.workouts[i];
    for(var j = 0; j < w.exercises.length; j++){
      if(w.exercises[j].id === exId) return {workout:w, ex:w.exercises[j]};
    }
  }
  return null;
}

// Ritorna {weight, targetLo, targetHi, sets, note, hasHistory}
function suggestFor(exId, setsCount){
  var cfg = state.exercises[exId];
  var perf = lastPerformance(exId);
  var startWeight = (exId === "leg_raise" || exId === "dips_zavorrate" || exId === "trazioni") ? 0 : 0;
  if(!perf){
    return {
      weight: startWeight,
      reps: new Array(setsCount).fill(cfg.lo),
      note: "Prima volta: parti leggero e trova il carico.",
      noteType:"hold"
    };
  }
  var lastSets = perf.ex.sets;
  var lastWeight = lastSets.length ? lastSets[0].peso : startWeight;
  var allAtTop = lastSets.length > 0 && lastSets.every(function(s){ return s.reps >= cfg.hi; });

  var newWeight = lastWeight;
  var repsGuess;
  var note, noteType;

  if(cfg.kind === "principal"){
    if(allAtTop){
      newWeight = lastWeight + cfg.inc;
      note = "Serie chiuse a " + cfg.hi + ": sali a " + fmtNum(newWeight) + " kg";
      noteType = "up";
      repsGuess = new Array(setsCount).fill(cfg.lo);
    } else {
      note = "Ripeti " + fmtNum(lastWeight) + " kg, punta a " + cfg.hi + " su tutte";
      noteType = "hold";
      repsGuess = lastSets.map(function(s){ return s.reps; });
    }
  } else {
    if(allAtTop){
      newWeight = lastWeight + cfg.inc;
      note = "Top range raggiunto: sali a " + fmtNum(newWeight) + " kg, riparti da " + cfg.lo;
      noteType = "up";
      repsGuess = new Array(setsCount).fill(cfg.lo);
    } else {
      note = "Ripeti " + fmtNum(lastWeight) + " kg, punta a " + cfg.hi;
      noteType = "hold";
      repsGuess = lastSets.map(function(s){ return s.reps; });
    }
  }
  while(repsGuess.length < setsCount) repsGuess.push(cfg.lo);
  repsGuess = repsGuess.slice(0, setsCount);

  return {
    weight: newWeight,
    reps: repsGuess,
    note: note,
    noteType: noteType,
    lastText: lastSets.map(function(s){ return fmtNum(s.peso)+"x"+s.reps; }).join(", "),
    lastDate: perf.workout.date
  };
}

/* ============================================================
   TAB SWITCHING
   ============================================================ */
var currentTab = "oggi";
function showTab(tab){
  currentTab = tab;
  document.querySelectorAll(".view").forEach(function(v){ v.classList.remove("active"); });
  document.getElementById("view-"+tab).classList.add("active");
  document.querySelectorAll(".tab-btn").forEach(function(b){
    b.classList.toggle("active", b.getAttribute("data-tab") === tab);
  });
  render();
}
document.querySelectorAll(".tab-btn").forEach(function(btn){
  btn.addEventListener("click", function(){ showTab(btn.getAttribute("data-tab")); });
});

/* ============================================================
   STATO SESSIONE DI LOG IN CORSO (non persistito finché non salvo)
   ============================================================ */
var logSession = null; // {schedaId, variant, sets: {exId: [{peso,reps}, ...]}}

function startLog(schedaId, variant){
  var scheda = SCHEDE[schedaId];
  var exIds = scheda.exercises.slice();
  if(schedaId === "B" && variant){
    exIds = exIds.filter(function(id){ return id !== "squat"; });
  }
  var sets = {};
  exIds.forEach(function(exId){
    var cfg = state.exercises[exId];
    var setsCount = cfg.defSets;
    if(schedaId === "B" && variant && exId === "leg_press") setsCount = 4;
    var sug = suggestFor(exId, setsCount);
    var arr = [];
    for(var i=0;i<setsCount;i++){
      arr.push({peso: sug.weight, reps: (sug.reps[i] !== undefined ? sug.reps[i] : cfg.lo)});
    }
    sets[exId] = arr;
  });
  logSession = {schedaId: schedaId, variant: !!variant, exIds: exIds, sets: sets};
  showTab("oggi");
}

function cancelLog(){
  logSession = null;
  render();
}

function saveLog(){
  if(!logSession) return;
  var exercisesOut = logSession.exIds.map(function(exId){
    return {id: exId, sets: logSession.sets[exId].map(function(s){ return {peso:s.peso, reps:s.reps}; })};
  });
  var workout = {
    id: uid(),
    date: todayISO(),
    scheda: logSession.schedaId,
    variant: logSession.variant,
    exercises: exercisesOut
  };
  state.workouts.push(workout);
  advanceRotation();
  persistAll();
  logSession = null;
  toast("Seduta salvata ✓");
  render();
}

function stepSet(exId, idx, field, delta){
  var s = logSession.sets[exId][idx];
  if(field === "peso"){
    var cfg = state.exercises[exId];
    s.peso = Math.max(0, Math.round((s.peso + delta * cfg.inc) * 100) / 100);
  } else {
    s.reps = Math.max(0, s.reps + delta);
  }
  render();
}

/* ============================================================
   RENDER: OGGI
   ============================================================ */
function renderOggi(){
  var el = document.getElementById("view-oggi");

  if(logSession){
    var scheda = SCHEDE[logSession.schedaId];
    var html = "";
    html += '<div class="card">';
    html += '<div class="row between">';
    html += '<h2 style="margin:0">Scheda '+logSession.schedaId+' — '+scheda.name+'</h2>';
    if(logSession.variant) html += '<span class="badge variant">variante no-squat</span>';
    html += '</div>';
    html += '<div class="muted small">'+fmtDateIt(todayISO())+'</div>';
    html += '</div>';

    html += '<div class="card">';
    logSession.exIds.forEach(function(exId, exIndex){
      var cfg = state.exercises[exId];
      var sug = suggestFor(exId, logSession.sets[exId].length);
      html += '<div class="exercise">';
      html += '<div class="exname">'+cfg.name+'</div>';
      html += '<div class="exmeta">'+(cfg.kind==="principal" ? "Esercizio principale · " : "")+cfg.lo+(cfg.lo!==cfg.hi?("-"+cfg.hi):"")+" rip · "+logSession.sets[exId].length+" serie</div>";
      if(sug.lastText){
        html += '<div class="last-time">Ultima volta ('+fmtDateIt(sug.lastDate)+'): '+sug.lastText+'</div>';
      }
      html += '<div class="suggestion '+(sug.noteType==="up"?"up":"hold")+'">'+sug.note+'</div>';

      logSession.sets[exId].forEach(function(s, idx){
        html += '<div class="set-row">';
        html += '<div class="setlabel">S'+(idx+1)+'</div>';
        html += '<div class="stepper">';
        html += '<button data-act="step" data-ex="'+exId+'" data-idx="'+idx+'" data-field="peso" data-delta="-1">−</button>';
        html += '<div class="val">'+fmtNum(s.peso)+'<span class="unit">'+cfg.unit+'</span></div>';
        html += '<button data-act="step" data-ex="'+exId+'" data-idx="'+idx+'" data-field="peso" data-delta="1">+</button>';
        html += '</div>';
        html += '<div class="stepper">';
        html += '<button data-act="step" data-ex="'+exId+'" data-idx="'+idx+'" data-field="reps" data-delta="-1">−</button>';
        html += '<div class="val">'+s.reps+'<span class="unit">rip</span></div>';
        html += '<button data-act="step" data-ex="'+exId+'" data-idx="'+idx+'" data-field="reps" data-delta="1">+</button>';
        html += '</div>';
        html += '</div>';
      });
      html += '</div>';
    });
    html += '</div>';

    html += '<div class="btn-row">';
    html += '<button class="btn ghost" data-act="cancel-log">Annulla</button>';
    html += '<button class="btn primary" data-act="save-log">Salva seduta</button>';
    html += '</div>';

    el.innerHTML = html;
    return;
  }

  // Nessun log in corso: schermata proposta
  var nextId = nextSchedaId();
  var nextScheda = SCHEDE[nextId];
  var last = state.workouts.length ? state.workouts[state.workouts.length-1] : null;
  var bwLast = state.bodyweight.length ? state.bodyweight[state.bodyweight.length-1] : null;
  var bwAvg = sevenDayAvg();

  var html = "";

function rowsToCSVText(rows){
  return rows.map(function(r){
    return r.map(function(v){
      v = String(v);
      if(v.indexOf(",")>-1 || v.indexOf('"')>-1){ v = '"'+v.replace(/"/g,'""')+'"'; }
      return v;
    }).join(",");
  }).join("\n");
}

function toCSV(){
  var rows = [["=== SEDUTE ==="],["data","scheda","variante","esercizio","serie","peso","ripetizioni"]];
  state.workouts.forEach(function(w){
    w.exercises.forEach(function(ex){
      var cfg = state.exercises[ex.id] || {name: ex.id};
      ex.sets.forEach(function(s, idx){
        rows.push([w.date, w.scheda, w.variant?"si":"no", cfg.name, String(idx+1), fmtNum(s.peso), String(s.reps)]);
      });
    });
  });

  rows.push([]);
  rows.push(["=== PESO CORPOREO ==="]);
  rows.push(["data","peso_kg"]);
  state.bodyweight.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; }).forEach(function(b){
    rows.push([b.date, fmtNum(b.peso)]);
  });

  rows.push([]);
  rows.push(["=== ALIMENTAZIONE ==="]);
  rows.push(["data","tipo_giorno","kcal_ok","proteine_ok","carbo_ok","grassi_ok"]);
  state.nutrition.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; }).forEach(function(n){
    rows.push([n.date, n.dayType, n.kcal?"si":"no", n.prot?"si":"no", n.carb?"si":"no", n.grassi?"si":"no"]);
  });

  return rowsToCSVText(rows);
}

function doExport(format){
  var content = format === "csv" ? toCSV() : toJSON();
  var filename = "palestra-registro-"+todayISO()+"."+format;
  var mime = format === "csv" ? "text/csv" : "application/json";

  var box = document.getElementById("exportBox");

  function showFallback(){
    var h = '<div class="field" style="margin-top:12px;">';
    h += '<label>Contenuto '+format.toUpperCase()+' (copia da qui se la condivisione non funziona)</label>';
    h += '<textarea class="export-box" readonly id="exportTextarea">'+content.replace(/</g,"&lt;")+'</textarea>';
    h += '<button class="btn small" style="margin-top:8px;" data-act="copy-export">Copia negli appunti</button>';
    h += '</div>';
    if(box) box.innerHTML = h;
  }

  if(navigator.share && navigator.canShare){
    try{
      var file = new File([content], filename, {type: mime});
      if(navigator.canShare({files:[file]})){
        navigator.share({files:[file], title: filename}).catch(function(){ showFallback(); });
        return;
      }
    }catch(e){}
  }

  try{
    var blob = new Blob([content], {type: mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }catch(e){}

  showFallback();
}

function renderSparkline(){
  var sorted = state.bodyweight.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; }).slice(-14);
  if(sorted.length < 2) return '<p class="muted small">Servono più pesate.</p>';
  var vals = sorted.map(function(b){ return b.peso; });
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  var range = (max - min) || 1;
  var w = 300, h = 56, pad = 4;
  var pts = vals.map(function(v, i){
    var x = pad + (i/(vals.length-1)) * (w - pad*2);
    var y = h - pad - ((v - min)/range) * (h - pad*2);
    return x.toFixed(1)+","+y.toFixed(1);
  }).join(" ");
  return '<svg class="sparkline" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
    '<polyline points="'+pts+'" fill="none" stroke="#4fd18f" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
    '</svg>';
}

/* ============================================================
   EVENTI (delegazione)
   ============================================================ */
document.addEventListener("click", function(e){
  var t = e.target.closest("[data-act]");
  if(!t) return;
  var act = t.getAttribute("data-act");

  if(act === "start-log"){
    startLog(t.getAttribute("data-scheda"), t.getAttribute("data-variant") === "1");
  } else if(act === "cancel-log"){
    cancelLog();
  } else if(act === "save-log"){
    saveLog();
  } else if(act === "step"){
    stepSet(t.getAttribute("data-ex"), parseInt(t.getAttribute("data-idx"),10), t.getAttribute("data-field"), parseFloat(t.getAttribute("data-delta")));
  } else if(act === "toggle-session"){
    var id = t.getAttribute("data-id");
    openSessionId = openSessionId === id ? null : id;
    render();
  } else if(act === "delete-session"){
    e.stopPropagation();
    if(confirm("Eliminare questa seduta?")){
      state.workouts = state.workouts.filter(function(w){ return w.id !== t.getAttribute("data-id"); });
      persistAll();
      render();
    }
  } else if(act === "export"){
    doExport(t.getAttribute("data-format"));
  } else if(act === "copy-export"){
    var ta = document.getElementById("exportTextarea");
    if(ta){
      ta.select();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(ta.value).then(function(){ toast("Copiato ✓"); }).catch(function(){ document.execCommand("copy"); toast("Copiato ✓"); });
      } else {
        document.execCommand("copy");
        toast("Copiato ✓");
      }
    }
  } else if(act === "peso-step"){
    var delta = parseFloat(t.getAttribute("data-delta"));
    pesoInput = Math.round((pesoInput + delta) * 10) / 10;
    if(pesoInput < 0) pesoInput = 0;
    render();
  } else if(act === "save-peso"){
    var d = todayISO();
    var existing = state.bodyweight.find(function(b){ return b.date === d; });
    if(existing) existing.peso = pesoInput;
    else state.bodyweight.push({date: d, peso: pesoInput});
    persistAll();
    toast("Peso salvato ✓");
    render();
  } else if(act === "delete-peso"){
    if(confirm("Eliminare questa pesata?")){
      state.bodyweight = state.bodyweight.filter(function(b){ return b.date !== t.getAttribute("data-date"); });
      persistAll();
      render();
    }
  } else if(act === "nutri-daytype"){
    ensureNutriDraft();
    nutriDraft.dayType = t.getAttribute("data-type");
    render();
  } else if(act === "nutri-toggle"){
    ensureNutriDraft();
    var key = t.getAttribute("data-key");
    nutriDraft[key] = !nutriDraft[key];
    render();
  } else if(act === "save-nutri"){
    ensureNutriDraft();
    var dN = todayISO();
    var existingN = nutritionForDate(dN);
    var entry = {date: dN, dayType: nutriDraft.dayType, kcal: nutriDraft.kcal, prot: nutriDraft.prot, carb: nutriDraft.carb, grassi: nutriDraft.grassi};
    if(existingN){
      Object.assign(existingN, entry);
    } else {
      state.nutrition.push(entry);
    }
    persistAll();
    toast("Alimentazione salvata ✓");
    render();
  } else if(act === "delete-nutri"){
    if(confirm("Eliminare questo check alimentare?")){
      state.nutrition = state.nutrition.filter(function(n){ return n.date !== t.getAttribute("data-date"); });
      persistAll();
      render();
    }
  } else if(act === "force-rotation"){
    var target = t.getAttribute("data-scheda");
    var idx = ROTATION_SEQUENCE.indexOf(target);
    if(idx === -1) idx = 0;
    state.rotationIndex = idx;
    persistAll();
    toast("Prossima scheda impostata: "+target);
    render();
  } else if(act === "wipe-data"){
    if(confirm("Cancellare TUTTI i dati salvati (sedute, pesate, alimentazione, impostazioni)? L'operazione non è reversibile.")){
      localStorage.removeItem(LS.config);
      localStorage.removeItem(LS.workouts);
      localStorage.removeItem(LS.bodyweight);
      localStorage.removeItem(LS.rotation);
      localStorage.removeItem(LS.nutrition);
      state.exercises = JSON.parse(JSON.stringify(DEFAULT_EXERCISES));
      state.workouts = [];
      state.bodyweight = [];
      state.rotationIndex = 0;
      state.nutrition = [];
      nutriDraft = null;
      toast("Dati cancellati");
      render();
    }
  }
});

document.addEventListener("change", function(e){
  var t = e.target;
  if(t.getAttribute && t.getAttribute("data-act") === "set-inc"){
    var exId = t.getAttribute("data-ex");
    var v = parseFloat(t.value);
    if(!isNaN(v) && v >= 0){
      state.exercises[exId].inc = v;
      persistAll();
      toast("Incremento aggiornato");
    }
  } else if(t.getAttribute && t.getAttribute("data-act") === "import-file"){
    var file = t.files && t.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        if(!confirm("Importare questo backup? Sovrascriverà i dati attuali su questo telefono.")) return;
        if(data.exercises) state.exercises = data.exercises;
        if(data.workouts) state.workouts = data.workouts;
        if(data.bodyweight) state.bodyweight = data.bodyweight;
        if(data.nutrition) state.nutrition = data.nutrition;
        persistAll();
        toast("Backup importato ✓");
        render();
      }catch(err){
        alert("File non valido.");
      }
    };
    reader.readAsText(file);
  }
});

/* ============================================================
   RENDER PRINCIPALE
   ============================================================ */
function updateHeader(){
  var sub = document.getElementById("headerSub");
  var titles = {oggi:"Oggi", registro:"Registro", peso:"Salute", consulta:"Consulta", impostazioni:"Impostazioni"};
  sub.textContent = titles[currentTab] || "";
}

function render(){
  updateHeader();
  if(currentTab === "oggi") renderOggi();
  else if(currentTab === "registro") renderRegistro();
  else if(currentTab === "peso") renderPeso();
  else if(currentTab === "consulta") renderConsulta();
  else if(currentTab === "impostazioni") renderImpostazioni();
}

render();

/* ============================================================
   SERVICE WORKER (attivo solo se ospitata online, https)
   ============================================================ */
if("serviceWorker" in navigator && window.isSecureContext && location.protocol !== "file:"){
  window.addEventListener("load", function(){
    try{
      navigator.serviceWorker.register("sw.js").catch(function(){ /* nessun sw.js accanto: normale se il file è aperto da solo */ });
    }catch(e){ /* ambiente senza supporto reale: ignora */ }
  });
}

})();
</script>
