  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

}
body{
  display:flex;flex-direction:column;
  min-height:100vh;
  min-height:100dvh;
}
button, input{font-family:inherit;color:inherit;}
h1,h2,h3,p{margin:0 0 8px 0;}
.app-header{
  padding:calc(14px + var(--safe-t)) 16px 12px 16px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:5;
}
.app-header h1{font-size:19px;font-weight:700;}
.app-header .sub{color:var(--muted);font-size:13px;}
main{
  flex:1 1 auto;
  overflow-y:auto;
  padding:14px 14px calc(90px + var(--safe-b)) 14px;
  -webkit-overflow-scrolling:touch;
}
.view{display:none;}
.view.active{display:block;}
.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);

  margin-bottom:14px;
}
.card h2{font-size:16px;color:var(--accent);}
.card h3{font-size:14px;color:var(--text);}
.muted{color:var(--muted);}
.small{font-size:12.5px;}
.row{display:flex;align-items:center;gap:10px;}
.row.between{justify-content:space-between;}
.wrap{flex-wrap:wrap;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid2 > div{min-width:0;}
.grid2 input{width:100%;}
.stat{
  background:var(--panel2);
  border-radius:12px;
  padding:12px;

}
.stat .num{font-size:22px;font-weight:700;color:var(--accent);}
.stat .label{font-size:12px;color:var(--muted);margin-top:2px;}

button{
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:600;
  -webkit-user-select:none;user-select:none;
}
.btn{
  min-height:52px;
  padding:12px 18px;
  font-size:16px;
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--border);

}
.btn.primary{background:var(--accent);color:var(--accent-text);border:none;}
.btn.primary:active{background:var(--accent-dark);}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.btn.ghost{background:transparent;border:1px solid var(--border);}
.btn.small{min-height:44px;padding:8px 12px;font-size:14px;}
.btn-row{display:flex;gap:10px;}

.stepper{

.stepper button{
  width:54px;height:54px;

.stepper button:active{background:rgba(79,209,143,0.15);}
.stepper .val{

  font-size:19px;
  font-weight:700;

}
.stepper .unit{font-size:11px;color:var(--muted);font-weight:400;display:block;}

.exercise{

}
.exercise:first-child{border-top:none;margin-top:0;padding-top:0;}
.exercise .exname{font-size:15.5px;font-weight:700;}
.exercise .exmeta{font-size:12.5px;color:var(--muted);margin-top:1px;}
.suggestion{

}
.suggestion.up{background:rgba(79,209,143,0.15);color:var(--accent);}
.suggestion.hold{background:rgba(154,164,175,0.15);color:var(--muted);}
.last-time{font-size:12.5px;color:var(--muted);margin-top:6px;}
.set-row{

  align-items:stretch;
  margin-top:10px;
}
.set-row .setlabel{

}

}
.stepper-v .val .unit{font-size:10.5px;color:var(--muted);font-weight:400;display:block;}
.val-input{
  width:100%;display:block;
  background:transparent;border:none;outline:none;
  color:var(--text);font-family:inherit;
  font-size:19px;font-weight:700;text-align:center;

.field input[type=date]{

.done-btn{

.done-btn.skipped{background:var(--danger);border-color:var(--danger);color:#fff;}

nav.tabbar{

nav.tabbar button .ic{font-size:20px;}
nav.tabbar button.active{color:var(--accent);}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th,td{text-align:left;padding:6px 5px;border-bottom:1px solid var(--border);}
th{color:var(--muted);font-weight:600;font-size:12px;}

.badge{
  display:inline-block;padding:3px 9px;border-radius:999px;
  font-size:11.5px;font-weight:700;
  background:var(--panel2);color:var(--accent);border:1px solid var(--border);
}
.badge.variant{color:#f2c14e;}

.session-item{
  border-bottom:1px solid var(--border);

}
.session-item:last-child{border-bottom:none;}
.session-item .head{cursor:pointer;}
.session-detail{display:none;margin-top:8px;font-size:13px;}

.meal-row{border-top:1px solid var(--border);padding-top:8px;}
.meal-row:first-child{border-top:none;padding-top:0;}
.meal-row .meal-row-head{cursor:pointer;}
.meal-row .meal-row-head .chev{color:var(--accent);font-size:12px;}
.meal-row-body{display:none;margin-top:8px;}
.meal-row-body.open{display:block;}

.check-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.check-item:last-of-type{border-bottom:none;}
.check-item .checkbox{flex:0 0 auto;width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--panel2);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:15px;font-weight:700;margin-top:1px;}
.check-item.checked .checkbox{background:var(--accent);color:var(--accent-text);border-color:var(--accent);}
.check-item .check-text{flex:1 1 auto;min-width:0;}

.opt-detail .macros{font-weight:700;color:var(--text);}

textarea.export-box{
  width:100%;min-height:140px;
  background:var(--panel2);color:var(--text);
  border:1px solid var(--border);border-radius:10px;
  padding:10px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}

.field{margin-bottom:12px;}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;}
.field input[type=number]{
  width:100%;min-height:48px;
  background:var(--panel2);color:var(--text);
  border:1px solid var(--border);border-radius:10px;
  padding:8px 12px;font-size:16px;
}

.toast{
  position:fixed;left:50%;bottom:calc(96px + var(--safe-b));
  transform:translateX(-50%);
  background:var(--accent);color:var(--accent-text);
  padding:10px 18px;border-radius:999px;
  font-size:13.5px;font-weight:700;
  box-shadow:0 4px 18px rgba(0,0,0,0.4);
  z-index:50;
  opacity:0;pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;
}

.sparkline{width:100%;height:60px;display:block;}

hr.sep{border:none;border-top:1px solid var(--border);margin:14px 0;}
</style>
</head>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ============================================================
   CONFIG DI DEFAULT
   ============================================================ */
var DEFAULT_EXERCISES = {
  panca_piana:        {name:"Panca piana bilanciere",       kind:"principal", lo:3,  hi:8,  inc:2.5,  unit:"kg", defSets:4, rest:180},
  chest_press:         {name:"Chest press",                  kind:"range",     lo:8,  hi:10, inc:2.5,  unit:"kg", defSets:3, rest:120},
  pulley_basso:        {name:"Pulley basso",                 kind:"range",     lo:8,  hi:10, inc:2.5,  unit:"kg", defSets:3, rest:120},
  bayesan_curl:        {name:"Bayesan curl",                 kind:"range",     lo:10, hi:12, inc:2,    unit:"kg", defSets:3, rest:90},
  curl_manubri_seduto: {name:"Curl manubri seduto",          kind:"range",     lo:10, hi:12, inc:2,    unit:"kg", defSets:3, rest:90},
  leg_raise:           {name:"Leg raise sedia romana",       kind:"legraise",  lo:12, hi:15, inc:1.25, unit:"kg zavorra", defSets:3, rest:60},
  squat:               {name:"Squat bilanciere",             kind:"principal", lo:3,  hi:8,  inc:5,    unit:"kg", defSets:4, rest:180},
  leg_press:           {name:"Leg press",                    kind:"range",     lo:8,  hi:10, inc:5,    unit:"kg", defSets:3, rest:120},
  calf_raise:          {name:"Calf raise",                   kind:"range",     lo:8,  hi:10, inc:2.5,  unit:"kg", defSets:3, rest:120},
  lento_avanti:        {name:"Lento avanti manubri",         kind:"range",     lo:8,  hi:10, inc:2,    unit:"kg", defSets:3, rest:120},
  alzate_laterali:     {name:"Alzate laterali manubri",      kind:"range",     lo:10, hi:12, inc:1,    unit:"kg", defSets:3, rest:90},
  dips_zavorrate:      {name:"Dips zavorrate",                kind:"principal", lo:3,  hi:8,  inc:2.5,  unit:"kg zavorra", defSets:4, rest:180},
  croci_cavi:          {name:"Croci ai cavi",                 kind:"range",     lo:10, hi:12, inc:2.5,  unit:"kg", defSets:3, rest:90},
  trazioni:            {name:"Trazioni",                      kind:"range",     lo:6,  hi:8,  inc:2.5,  unit:"kg zavorra", defSets:3, rest:120},
  double_row_panca_inclinata: {name:"Double row panca inclinata", kind:"range", lo:6,  hi:8,  inc:2.5,  unit:"kg", defSets:3, rest:120},
  push_down:           {name:"Push down al cavo alto",        kind:"range",     lo:8,  hi:10, inc:2.5,  unit:"kg", defSets:3, rest:120},
  french_press:        {name:"French press bilanciere EZ",    kind:"range",     lo:8,  hi:10, inc:2.5,  unit:"kg", defSets:3, rest:120},
  face_pull:           {name:"Face pull al cavo (corda)",      kind:"range",     lo:12, hi:15, inc:2.5,  unit:"kg", defSets:3, rest:60}
};

// Progressione Lineare di Carico (Project Invictus, vedi programma.md). pct = %1RM della settimana,
// ricavata con Epley sulle ripetizioni effettive (rip + RIR target): %1RM = 30 / (30 + rip_effettive).
var WEEK_SCHEME = [
  {week:1, sets:4, reps:8, pct:0.73, rpe:"7 (3 rip di riserva)"},
  {week:2, sets:4, reps:6, pct:0.78, rpe:"7,5-8"},
  {week:3, sets:4, reps:5, pct:0.82, rpe:"8-8,5"},
  {week:4, sets:4, reps:3, pct:0.88, rpe:"8,5-9"},
  {week:5, sets:2, reps:3, pct:0.85, rpe:"scarico — riduci se la settimana 4 è stata dura", deload:true}
];

var SCHEDE = {
  A: {name:"Petto e Dorso", exercises:["panca_piana","chest_press","trazioni","pulley_basso","bayesan_curl","curl_manubri_seduto","leg_raise"]},
  B: {name:"Gambe e Spalle", exercises:["squat","leg_press","calf_raise","lento_avanti","alzate_laterali","face_pull"]},
  C: {name:"Spinta e Tricipiti", exercises:["dips_zavorrate","croci_cavi","double_row_panca_inclinata","push_down","french_press","leg_raise"]}
};

var ROTATION_SEQUENCE = ["A","B","C"];

var MEAL_TYPES = ["Colazione","Metà mattina","Pranzo","Merenda","Cena","Spuntino"];
// Riconosce il tipo pasto scritto come prima riga o come prefisso ("Colazione: ...", "Colazione\n...").
// Le forme più specifiche vanno prima delle generiche (es. "spuntino pomeridiano" prima di "spuntino").
var MEAL_TYPE_RE = /^\s*(prima colazione|colazione|met[aà]\s+mattina|spuntino mattutino|spuntino pomeridiano|spuntino pomeriggio|merenda|pranzo|cena|spuntino)\b[:\-,]?\s*/i;
var MEAL_TYPE_LABELS = {
  "prima colazione":"Colazione", "colazione":"Colazione",
  "meta mattina":"Metà mattina", "metà mattina":"Metà mattina", "spuntino mattutino":"Metà mattina",
  "spuntino pomeridiano":"Merenda", "spuntino pomeriggio":"Merenda", "merenda":"Merenda",
  "pranzo":"Pranzo", "cena":"Cena", "spuntino":"Spuntino"
};
function extractMealType(text){
  var raw = String(text);
  var m = raw.match(MEAL_TYPE_RE);
  if(m){
    var key = m[1].toLowerCase().replace(/\s+/g," ").trim();
    var label = MEAL_TYPE_LABELS[key];
    if(label) return {mealType: label, text: raw.slice(m[0].length)};
  }
  return {mealType: null, text: raw};
}
function guessMealTypeByHour(){
  var h = new Date().getHours();
  if(h < 10) return "Colazione";
  if(h < 12) return "Metà mattina";
  if(h < 15) return "Pranzo";
  if(h < 18) return "Merenda";
  if(h < 22) return "Cena";
  return "Spuntino";
}

/* ============================================================
   STORAGE
   ============================================================ */
var LS = {
  config: "pp_config_v1",
  workouts: "pp_workouts_v1",
  bodyweight: "pp_bodyweight_v1",
  rotation: "pp_rotation_index_v1",
  nutrition: "pp_nutrition_v1",
  restVersion: "pp_rest_version_v1",
  trainingAnalysis: "pp_training_analysis_v1",
  logDraft: "pp_log_draft_v1",
  maxes: "pp_maxes_v1",
  cycleWeek: "pp_cycle_week_v1",
  bikeRides: "pp_bike_rides_v1",
  bodyConfig: "pp_body_config_v1",
  weekMenu: "pp_week_menu_v1",
  cookDays: "pp_cook_days_v1",
  mesociclo: "pp_mesociclo_v1",
  partner: "pp_partner_v1",
  shoppingChecked: "pp_shopping_checked_v1"
};

/* ============================================================
   FASI ALIMENTARI (Mesociclo) E TARGET
   La fase attiva (state.mesociclo.obiettivo) decide i target del giorno. Ogni punto
   dell'app (diario, Oggi, Consulta, testo per l'IA) li legge da computeMesocicloTargets().
   ============================================================ */
// Ricomposizione (fino al 2026-10-20): target fissi di dieta.md.
var TARGETS = {
  allenamento: {kcal: 2250, prot: 150, carb: 250, grassi: 65, label:"Giorno di allenamento"},
  riposo:      {kcal: 1970, prot: 150, carb: 180, grassi: 65, label:"Giorno di riposo"}
};
// Dimagrimento (dal 2026-10-20): totali del piano in PDF "Piano nutrizionale per Marco" =
// piano BASE del nutrizionista × 0,8977, rapporto tra i metabolismi basali (Mifflin-St Jeor)
// di Marco e della persona per cui il piano era scritto. SOURCE_INFERRED, vedi roadmap.md.
// Le kcal includono le fibre (~27 g/die): 4P+4C+9G dà circa 50 kcal in meno.
var DIMAGRIMENTO_TARGETS = {
  allenamento: {kcal: 2138, prot: 135, carb: 265, grassi: 54, label:"Giorno di allenamento"},
  riposo:      {kcal: 1802, prot: 134, carb: 180, grassi: 55, label:"Giorno di riposo"}
};
var PHASE_TARGETS = {dimagrimento: DIMAGRIMENTO_TARGETS, ricomposizione: TARGETS};
var MESOCICLO_OBJ_LABELS = {dimagrimento:"Dimagrimento (piano PDF)", ricomposizione:"Ricomposizione"};
// Durata di default in settimane: scelta pratica di Marco ("rivalutare ogni 4-6 settimane"), editabile.
var MESOCICLO_DURATA_DEFAULT = {dimagrimento: 4, ricomposizione: 4};

function computeMesocicloTargets(){
  return PHASE_TARGETS[state.mesociclo.obiettivo] || DIMAGRIMENTO_TARGETS;
}
function mesocicloFinePrevista(){
  var inizio = state.mesociclo.dataInizio || todayISO();
  var durata = state.mesociclo.durataSettimane || MESOCICLO_DURATA_DEFAULT[state.mesociclo.obiettivo] || 4;
  return addWeeksToDate(inizio, durata);
}
function mesocicloEnded(){
  return todayISO() >= mesocicloFinePrevista();
}
// Promemoria in cima ad Allenamento quando la fase ha superato la sua durata: non cambia
// nulla da solo, Marco decide la fase successiva.
function nextPhaseSuggestionHTML(){
  if(!mesocicloEnded()) return "";
  var label = MESOCICLO_OBJ_LABELS[state.mesociclo.obiettivo] || state.mesociclo.obiettivo;
  var html = '<div class="card" style="border:1px solid #f2c14e;">';
  html += '<h3 style="margin:0;">📅 Fase terminata</h3>';
  html += '<div class="small" style="margin-top:6px;">La fase "'+label+'" doveva finire il '+fmtDateIt(mesocicloFinePrevista())+'. Confronta la media del peso e la vita con l\'inizio della fase, poi decidi come proseguire.</div>';
  html += '<div class="btn-row" style="margin-top:10px;flex-wrap:wrap;">';
  html += '<button class="btn ghost small" style="width:auto;" data-act="restart-mesociclo">Continua '+label+'</button>';
  html += '</div></div>';
  return html;
}

// Uscite in bici: kcal/ora dalle "calorie attive" Garmin di uscite reali di Marco (già al netto
// del metabolismo basale). Gravel: media di 3 tratte (~305 kcal/h); Enduro/MTB: 1 uscita (~528 kcal/h).
var BIKE_RATES = {
  gravel: {label:"Gravel", kcalPerHour: 305},
  enduro: {label:"Enduro/MTB", kcalPerHour: 528}
};

// Target del giorno: base della fase (allenamento se quel giorno c'è una seduta, altrimenti riposo)
// più l'eventuale uscita in bici, con le kcal extra tutte in carboidrati (regola di dieta.md).
function computeTargetsForDate(date){
  var hasWorkout = state.workouts.some(function(w){ return w.date === date; });
  var baseKey = hasWorkout ? "allenamento" : "riposo";
  var base = computeMesocicloTargets()[baseKey];
  var ride = state.bikeRides.find(function(r){ return r.date === date; });
  if(!ride) return {kcal: base.kcal, prot: base.prot, carb: base.carb, grassi: base.grassi, label: base.label, baseKey: baseKey, ride: null};
  var rate = BIKE_RATES[ride.tipo];
  var extraKcal = rate ? Math.round(rate.kcalPerHour * ride.ore) : 0;
  var extraCarb = Math.round(extraKcal / 4);
  return {
    kcal: base.kcal + extraKcal,
    prot: base.prot,
    carb: base.carb + extraCarb,
    grassi: base.grassi,
    label: base.label + " + bici",
    baseKey: baseKey,

// Massimale stimato (1RM) con Epley, peso × (1 + rip/30), dalla serie migliore mai registrata
// (Marco si allena vicino al cedimento, quindi le serie sono di fatto rep-max). Correggibile a mano.
function computeEstimatedMaxFromHistory(exId){
  var best = null;
  state.workouts.forEach(function(w){
    w.exercises.forEach(function(ex){
      if(ex.id !== exId) return;
      ex.sets.forEach(function(s){
        if(!s.reps || s.peso == null || s.peso <= 0) return;
        var epley = s.peso * (1 + s.reps/30);
        if(!best || epley > best.value){
          best = {value: Math.round(epley*10)/10, date: w.date, fromWeight: s.peso, fromReps: s.reps};
        }
      });
    });
  });
  return best;
}

})();

// Stima della massa grassa con il metodo a nastro US Navy (formula metrica, uomini). Margine
// tipico ±3-4 punti: va letta come trend nel tempo, non come valore assoluto.
function navyBodyFatMale(vitaCm, colloCm, altezzaCm){
  if(!vitaCm || !colloCm || !altezzaCm || vitaCm <= colloCm) return null;
  var bf = 495 / (1.0324 - 0.19077*Math.log10(vitaCm - colloCm) + 0.15456*Math.log10(altezzaCm)) - 450;
  if(!isFinite(bf) || bf <= 0 || bf >= 100) return null;
  return Math.round(bf * 10) / 10;
}

}

function nutritionDays(limitDays){

  });
  var dates = Object.keys(byDate).sort().reverse();

  return dates.map(function(d){
    var entries = byDate[d].slice().sort(function(a,b){ return mealTypeOrder(a.mealType) - mealTypeOrder(b.mealType); });

function hasMacro(n){ return typeof n.kcal === "number"; }

// Totali del giorno sui soli pasti che hanno già i macro (per sapere quanto resta).
function nutritionTotalsForDate(date){
  var entries = state.nutrition.filter(function(n){ return n.date === date; });
  var t = {kcal:0, prot:0, carb:0, fat:0};
  var computed = 0;
  entries.forEach(function(n){
    if(hasMacro(n)){ t.kcal+=n.kcal; t.prot+=n.prot; t.carb+=n.carb; t.fat+=n.fat; computed++; }
  });
  return {entries: entries, totals: t, computed: computed};
}

   ============================================================ */
// Sedute in ordine di data (a parità, di inserimento): le sedute retroattive non sono in ordine nell'array.
function sortedWorkoutsAsc(){
  return state.workouts.slice().sort(function(a,b){
    if(a.date !== b.date) return a.date < b.date ? -1 : 1;
    return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0);
  });
}

function lastPerformance(exId, excludeId){
  var list = sortedWorkoutsAsc();
  for(var i = list.length - 1; i >= 0; i--){
    var w = list[i];
    if(excludeId && w.id === excludeId) continue;
    for(var j = 0; j < w.exercises.length; j++){
      if(w.exercises[j].id === exId) return {workout:w, ex:w.exercises[j]};
    }
  }
  return null;
}

// Peso di lavoro di una seduta = il più frequente tra le serie (a parità il più alto), così un
// riscaldamento registrato per errore come prima serie non abbassa il riferimento.
function modeWeight(sets){
  if(!sets.length) return 0;
  var counts = {}, order = [];
  sets.forEach(function(s){
    var key = String(s.peso);
    if(!(key in counts)){ counts[key] = 0; order.push(key); }
    counts[key]++;
  });
  var best = null, bestCount = 0;
  order.forEach(function(key){
    var w = parseFloat(key);
    if(counts[key] > bestCount || (counts[key] === bestCount && (best === null || w > best))){
      best = w; bestCount = counts[key];
    }
  });
  return best;
}

// Settimana (1-5) del ciclo di ciascun principale: contatore indipendente, avanza a ogni seduta salvata.
function currentCycleWeek(exId){
  return (state.cycleWeek && state.cycleWeek[exId]) || 1;
}
function weekSchemeFor(exId){
  return WEEK_SCHEME[currentCycleWeek(exId) - 1];
}
// Serie di oggi: per i principali dipendono dalla settimana del ciclo, per gli altri sono fisse.
function setsCountFor(exId){
  var cfg = state.exercises[exId];
  if(cfg.kind === "principal") return weekSchemeFor(exId).sets;
  return cfg.defSets;
}

// Seduta di scarico: un principale della scheda è alla settimana 5. Gli altri esercizi fanno metà serie
// (per eccesso, 3 → 2) con gli stessi carichi (programma.md; arrotondamento = scelta pratica).
function isDeloadSession(exIds){
  return exIds.some(function(id){
    var c = state.exercises[id];
    return c && c.kind === "principal" && weekSchemeFor(id).deload;
  });
}
function deloadSetsCount(n){ return Math.max(1, Math.ceil(n / 2)); }

// Riscaldamento a scalare (50/70/85% del peso di lavoro), senza step che arrotondano allo stesso peso.
function warmupPlan(exId, workingWeight){
  var cfg = state.exercises[exId];
  if(!workingWeight || workingWeight <= 0) return null;
  var steps = [{pct:0.5, reps:8}, {pct:0.7, reps:4}, {pct:0.85, reps:2}];
  var out = [];
  steps.forEach(function(s){
    var w = Math.round((workingWeight * s.pct) / cfg.inc) * cfg.inc;
    if(w < 0) w = 0;
    if(out.length && out[out.length-1].weight === w) return;
    out.push({weight: w, reps: s.reps});
  });
  return out;
}

// Ritorna {weight, targetLo, targetHi, sets, note, hasHistory}
function suggestFor(exId, setsCount, excludeId, deload){
  var cfg = state.exercises[exId];
  var perf = lastPerformance(exId, excludeId);
  var startWeight = 0;
  if(!perf){
    return {
      weight: startWeight,
      reps: new Array(setsCount).fill(cfg.lo),
      note: "Prima volta: parti leggero e trova il carico.",
      noteType:"hold"
    };
  }
  var lastSets = perf.ex.sets;
  var lastWeight = lastSets.length ? modeWeight(lastSets) : startWeight;
  var allAtTop = lastSets.length > 0 && lastSets.every(function(s){ return s.reps >= cfg.hi; });

  var newWeight = lastWeight;
  var repsGuess;
  var note, noteType;

  if(cfg.kind === "principal"){
    var week = currentCycleWeek(exId);
    var scheme = weekSchemeFor(exId);
    var maxInfo = state.maxes[exId];
    if(maxInfo && maxInfo.value){
      var rawW = maxInfo.value * scheme.pct;
      newWeight = Math.round(rawW / cfg.inc) * cfg.inc;
      if(newWeight < 0) newWeight = 0;
      note = "Settimana " + week + "/5" + (scheme.deload ? " (scarico)" : "") + " — " +
             scheme.sets + "x" + scheme.reps + " @" + Math.round(scheme.pct*100) + "% ≈ " +
             fmtNum(newWeight) + " kg · RPE " + scheme.rpe;
      noteType = scheme.deload ? "hold" : "up";
      repsGuess = new Array(setsCount).fill(scheme.reps);
    } else if(allAtTop){
      newWeight = lastWeight + cfg.inc;
      note = "Settimana " + week + "/5 — " + scheme.sets + "x" + scheme.reps +
             ". Nessun massimale stimato (impostalo in Impostazioni): sali a " + fmtNum(newWeight) + " kg";
      noteType = "up";
      repsGuess = new Array(setsCount).fill(scheme.reps);
    } else {
      note = "Settimana " + week + "/5 — " + scheme.sets + "x" + scheme.reps +
             ". Nessun massimale stimato (impostalo in Impostazioni): ripeti " + fmtNum(lastWeight) + " kg";
      noteType = "hold";
      repsGuess = new Array(setsCount).fill(scheme.reps);
    }
  } else {
    if(deload){
      note = "Scarico: " + setsCount + " serie invece di " + cfg.defSets + ", stesso carico dell'ultima volta (" + fmtNum(lastWeight) + " " + cfg.unit + "), senza cercare di salire";
      noteType = "hold";
      repsGuess = lastSets.map(function(s){ return s.reps; });
    } else if(allAtTop){
      newWeight = lastWeight + cfg.inc;
      note = "Top range raggiunto: sali a " + fmtNum(newWeight) + " kg, riparti da " + cfg.lo;
      noteType = "up";
      repsGuess = new Array(setsCount).fill(cfg.lo);
    } else {
      note = "Ripeti " + fmtNum(lastWeight) + " kg, punta a " + cfg.hi;
      noteType = "hold";
      repsGuess = lastSets.map(function(s){ return s.reps; });
    }
  }
  while(repsGuess.length < setsCount) repsGuess.push(cfg.lo);
  repsGuess = repsGuess.slice(0, setsCount);

  return {
    weight: newWeight,
    reps: repsGuess,
    note: note,
    noteType: noteType,
    lastText: lastSets.map(function(s){ return fmtNum(s.peso)+"x"+s.reps; }).join(", "),
    lastDate: perf.workout.date
  };
}

/* ============================================================
   STATO SESSIONE DI LOG IN CORSO (non persistito finché non salvo)
   ============================================================ */
var logSession = null; // {schedaId, variant, date, editId, exIds, sets: {exId: [{peso,reps,done}, ...]}}
// Ripristino automatico della seduta in corso dopo una chiusura o un crash.
logSession = loadJSON(LS.logDraft, null);
// Bozze salvate da versioni precedenti: aggiunge i campi mancanti (non tocca lo storico).
if(logSession){
  if(!logSession.exNotes) logSession.exNotes = {};
  if(!logSession.feedback) logSession.feedback = {};
  if(logSession.closing === undefined) logSession.closing = false;
}

function startLog(schedaId, variant){
  var scheda = SCHEDE[schedaId];
  var exIds = scheda.exercises.slice();
  if(schedaId === "B" && variant){
    exIds = exIds.filter(function(id){ return id !== "squat"; });
  }
  var sets = {};
  var deload = isDeloadSession(exIds);
  exIds.forEach(function(exId){
    var cfg = state.exercises[exId];
    var setsCount = setsCountFor(exId);
    if(schedaId === "B" && variant && exId === "leg_press") setsCount = 4;
    if(deload && cfg.kind !== "principal") setsCount = deloadSetsCount(setsCount);
    var sug = suggestFor(exId, setsCount, null, deload);
    var arr = [];
    for(var i=0;i<setsCount;i++){
      arr.push({peso: sug.weight, reps: (sug.reps[i] !== undefined ? sug.reps[i] : cfg.lo), stato: null});
    }
    sets[exId] = arr;
  });
  logSession = {schedaId: schedaId, variant: !!variant, date: todayISO(), editId: null, exIds: exIds, sets: sets, closing: false, exNotes: {}, feedback: {}, deload: deload};
  persistLogDraft();
  showTab("oggi");
}

// Riapre una seduta salvata per correggerla; i campi che le sedute vecchie non hanno restano vuoti.
function editSession(id){
  var w = state.workouts.find(function(x){ return x.id === id; });
  if(!w) return;
  var exIds = w.exercises.map(function(e){ return e.id; });
  var sets = {};
  var exNotes = {};
  w.exercises.forEach(function(e){
    sets[e.id] = e.sets.map(function(s){ return {peso:s.peso, reps:s.reps, stato: s.stato || null}; });
    if(e.nota) exNotes[e.id] = e.nota;
  });
  logSession = {schedaId: w.scheda, variant: !!w.variant, date: w.date, editId: w.id, exIds: exIds, sets: sets, closing: false, exNotes: exNotes, feedback: w.feedback ? Object.assign({}, w.feedback) : {}};
  persistLogDraft();
  showTab("oggi");
}

function cancelLog(){
  logSession = null;
  persistLogDraft(); // rimuove la bozza salvata, altrimenti riapparirebbe al prossimo avvio
  render();
}

// "Salva": conferma visiva, la bozza è già salvata a ogni modifica.
function saveLogDraftManual(){
  if(!logSession) return;
  persistLogDraft();
  toast("Progresso salvato ✓");
}

// Mini-feedback di fine seduta: tutto facoltativo, solo registrato, non cambia piano o carichi.
var FEEDBACK_FIELDS = ["esito","energia","difficolta","recupero","dolore","doloreZona","doloreZonaAltro","aderenza","nota"];
function cleanFeedback(fb){
  if(!fb) return undefined;
  var out = {};
  FEEDBACK_FIELDS.forEach(function(k){
    var v = fb[k];
    if(v !== undefined && v !== null && v !== "") out[k] = v;
  });
  return Object.keys(out).length ? out : undefined;
}

function saveLog(){
  if(!logSession) return;
  var exercisesOut = logSession.exIds.map(function(exId){
    var out = {id: exId, sets: logSession.sets[exId].map(function(s){
      var so = {peso:s.peso, reps:s.reps};
      if(s.stato) so.stato = s.stato; // COMPLETATO/PARZIALE/SALTATO, facoltativo — assente se mai toccato
      return so;
    })};
    var nota = ((logSession.exNotes && logSession.exNotes[exId]) || "").trim();
    if(nota) out.nota = nota;
    return out;
  });
  var fb = cleanFeedback(logSession.feedback);
  if(logSession.editId){
    var idx = state.workouts.findIndex(function(w){ return w.id === logSession.editId; });
    if(idx > -1){
      // In modifica la settimana del ciclo resta quella salvata e il contatore non avanza.
      var orig = state.workouts[idx];
      exercisesOut.forEach(function(exo){
        var oe = (orig.exercises || []).find(function(x){ return x.id === exo.id; });
        if(oe && oe.cycleWeek) exo.cycleWeek = oe.cycleWeek;
      });
      var updated = {
        id: logSession.editId,
        date: logSession.date || todayISO(),
        scheda: logSession.schedaId,
        variant: logSession.variant,
        exercises: exercisesOut
      };
      if(fb) updated.feedback = fb;
      state.workouts[idx] = updated;
    }
    persistAll();
    logSession = null;
    persistLogDraft();
    toast("Seduta aggiornata ✓");
    render();
    return;
  }
  var workout = {
    id: uid(),
    date: logSession.date || todayISO(),
    scheda: logSession.schedaId,
    variant: logSession.variant,
    exercises: exercisesOut
  };
  if(fb) workout.feedback = fb;
  state.workouts.push(workout);
  advanceRotation();
  // Avanza il contatore del ciclo di ogni principale svolto.
  exercisesOut.forEach(function(exo){
    var cfgEx = state.exercises[exo.id];
    if(cfgEx && cfgEx.kind === "principal"){
      var w = currentCycleWeek(exo.id);
      exo.cycleWeek = w; // settimana in cui è stata fatta questa seduta (campo facoltativo, additivo)
      state.cycleWeek[exo.id] = (w >= 5) ? 1 : (w + 1);
    }
  });
  persistAll();
  logSession = null;
  persistLogDraft();
  toast("Seduta salvata ✓");
  render();
}

function stepSet(exId, idx, field, delta){
  var s = logSession.sets[exId][idx];
  if(field === "peso"){
    var cfg = state.exercises[exId];
    s.peso = Math.max(0, Math.round((s.peso + delta * cfg.inc) * 100) / 100);
  } else {
    s.reps = Math.max(0, s.reps + delta);
  }
  persistLogDraft();
  render();
}

function setVal(exId, idx, field, raw){
  var s = logSession.sets[exId][idx];
  var v = parseFloat(String(raw).replace(",", "."));
  if(isNaN(v) || v < 0) v = 0;
  s[field] = (field === "peso") ? (Math.round(v*100)/100) : Math.round(v);
  persistLogDraft();
  render();
}

// Ciclo a 4 stati (tocco singolo): non specificato → Completato → Parziale → Saltato → non specificato.
var STATO_CYCLE = [null, "COMPLETATO", "PARZIALE", "SALTATO"];
function cycleSetStato(exId, idx){
  var s = logSession.sets[exId][idx];
  var cur = STATO_CYCLE.indexOf(s.stato || null);
  s.stato = STATO_CYCLE[(cur + 1) % STATO_CYCLE.length];
  persistLogDraft();
  render();
}

// Passaggio tra serie e mini-feedback di chiusura (la seduta si registra solo al salvataggio finale).
function startCloseSession(){
  if(!logSession) return;
  logSession.closing = true;
  if(!logSession.feedback) logSession.feedback = {};
  persistLogDraft();
  render();
}
function backToSets(){
  if(!logSession) return;
  logSession.closing = false;
  persistLogDraft();
  render();
}
function setFeedbackField(field, value){
  if(!logSession) return;
  if(!logSession.feedback) logSession.feedback = {};
  logSession.feedback[field] = value;
  if(field === "dolore" && value === "NESSUNO"){
    delete logSession.feedback.doloreZona;
    delete logSession.feedback.doloreZonaAltro;
  }
  persistLogDraft();
  render();
}

function sevenDayAvg(){
  if(!state.bodyweight.length) return null;
  var sorted = state.bodyweight.slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; });

  var sum = last7.reduce(function(a,b){ return a+b.peso; }, 0);
  return sum / last7.length;
}

function rowsToCSVText(rows){
  return rows.map(function(r){
    return r.map(function(v){
      v = String(v);
      if(v.indexOf(",")>-1 || v.indexOf('"')>-1){ v = '"'+v.replace(/"/g,'""')+'"'; }
      return v;
    }).join(",");
  }).join("\n");
}

function toCSV(){
  var rows = [["=== SEDUTE ==="],["data","scheda","variante","esercizio","serie","peso","ripetizioni"]];
  state.workouts.forEach(function(w){
    w.exercises.forEach(function(ex){
      var cfg = state.exercises[ex.id] || {name: ex.id};
      ex.sets.forEach(function(s, idx){
        rows.push([w.date, w.scheda, w.variant?"si":"no", cfg.name, String(idx+1), fmtNum(s.peso), String(s.reps)]);
      });
    });
  });

  rows.push([]);
  rows.push(["=== PESO CORPOREO ==="]);
  rows.push(["data","peso_kg","vita_cm","collo_cm","grasso_percento"]);
  state.bodyweight.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; }).forEach(function(b){
    rows.push([b.date, fmtNum(b.peso), b.vita!=null?fmtNum(b.vita):"", b.collo!=null?fmtNum(b.collo):"", b.bf!=null?fmtNum(b.bf):""]);
  });

  rows.push([]);
  rows.push(["=== ALIMENTAZIONE ==="]);
  rows.push(["data","pasto","testo","kcal","proteine_g","carbo_g","grassi_g"]);
  state.nutrition.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; }).forEach(function(n){
    rows.push([n.date, n.mealType||"Pasto", n.text, hasMacro(n)?fmtNum(n.kcal):"", hasMacro(n)?fmtNum(n.prot):"", hasMacro(n)?fmtNum(n.carb):"", hasMacro(n)?fmtNum(n.fat):""]);
  });

  return rowsToCSVText(rows);
}

function doExport(format){
  var content = format === "csv" ? toCSV() : toJSON();
  var filename = "trainer-registro-"+todayISO()+"."+format;
  var mime = format === "csv" ? "text/csv" : "application/json";

  var box = document.getElementById("exportBox");

  function showFallback(){
    var h = '<div class="field" style="margin-top:12px;">';
    h += '<label>Contenuto '+format.toUpperCase()+' (copia da qui se la condivisione non funziona)</label>';
    h += '<textarea class="export-box" readonly id="exportTextarea">'+content.replace(/</g,"&lt;")+'</textarea>';
    h += '<button class="btn small" style="margin-top:8px;" data-act="copy-export">Copia negli appunti</button>';
    h += '</div>';
    if(box) box.innerHTML = h;
  }

  if(navigator.share && navigator.canShare){
    try{
      var file = new File([content], filename, {type: mime});
      if(navigator.canShare({files:[file]})){
        navigator.share({files:[file], title: filename}).catch(function(){ showFallback(); });
        return;
      }
    }catch(e){}
  }

  try{
    var blob = new Blob([content], {type: mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }catch(e){}

  showFallback();
}

// Applica i macro incollati: legge solo le righe id|kcal|proteine|carbo|grassi e ignora il resto.
function applyMacroPaste(text){
  var lines = String(text || "").split(/\r?\n/);
  var applied = 0;
  lines.forEach(function(line){
    var parts = line.split("|");
    if(parts.length !== 5) return;
    var id = parts[0].trim();
    var n = state.nutrition.find(function(x){ return x.id === id; });
    if(!n) return;
    var kcal = parseFloat(String(parts[1]).replace(",", "."));
    var prot = parseFloat(String(parts[2]).replace(",", "."));
    var carb = parseFloat(String(parts[3]).replace(",", "."));
    var fat = parseFloat(String(parts[4]).replace(",", "."));
    if([kcal,prot,carb,fat].some(function(v){ return isNaN(v) || v < 0; })) return;
    n.kcal = round1(kcal); n.prot = round1(prot); n.carb = round1(carb); n.fat = round1(fat);
    applied++;
  });
  if(applied) persistAll();
  return {applied: applied};
}

function renderSparkline(){
  var sorted = state.bodyweight.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; }).slice(-14);
  if(sorted.length < 2) return '<p class="muted small">Servono più pesate.</p>';
  var vals = sorted.map(function(b){ return b.peso; });
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  var range = (max - min) || 1;
  var w = 300, h = 56, pad = 4;
  var pts = vals.map(function(v, i){
    var x = pad + (i/(vals.length-1)) * (w - pad*2);
    var y = h - pad - ((v - min)/range) * (h - pad*2);
    return x.toFixed(1)+","+y.toFixed(1);
  }).join(" ");
  return '<svg class="sparkline" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
    '<polyline points="'+pts+'" fill="none" stroke="#4fd18f" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
    '</svg>';
}

document.addEventListener("click", function(e){
  var t = e.target.closest("[data-act]");
  if(!t) return;
  var act = t.getAttribute("data-act");

  if(act === "start-log"){
    startLog(t.getAttribute("data-scheda"), t.getAttribute("data-variant") === "1");
  } else if(act === "cancel-log"){
    cancelLog();
  } else if(act === "close-log"){
    startCloseSession();
  } else if(act === "feedback-back"){
    backToSets();
  } else if(act === "feedback-set"){
    setFeedbackField(t.getAttribute("data-field"), t.getAttribute("data-value"));
  } else if(act === "finish-log"){
    saveLog();
  } else if(act === "step"){
    stepSet(t.getAttribute("data-ex"), parseInt(t.getAttribute("data-idx"),10), t.getAttribute("data-field"), parseFloat(t.getAttribute("data-delta")));
  } else if(act === "cycle-stato"){
    cycleSetStato(t.getAttribute("data-ex"), parseInt(t.getAttribute("data-idx"),10));
  } else if(act === "toggle-session"){
    var id = t.getAttribute("data-id");
    openSessionId = openSessionId === id ? null : id;
    render();
  } else if(act === "edit-session"){
    e.stopPropagation();
    editSession(t.getAttribute("data-id"));
  } else if(act === "delete-session"){
    e.stopPropagation();
    if(confirm("Eliminare questa seduta?")){
      state.workouts = state.workouts.filter(function(w){ return w.id !== t.getAttribute("data-id"); });
      persistAll();
      render();
    }
  } else if(act === "export"){
    doExport(t.getAttribute("data-format"));
  } else if(act === "copy-export"){
    var ta = document.getElementById("exportTextarea");
    if(ta){
      ta.select();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(ta.value).then(function(){ toast("Copiato ✓"); }).catch(function(){ document.execCommand("copy"); toast("Copiato ✓"); });
      } else {
        document.execCommand("copy");
        toast("Copiato ✓");
      }
    }
  } else if(act === "peso-step"){
    var delta = parseFloat(t.getAttribute("data-delta"));
    pesoInput = Math.round((pesoInput + delta) * 10) / 10;
    if(pesoInput < 0) pesoInput = 0;
    render();
  } else if(act === "save-peso"){
    var d = todayISO();
    var vitaVal = (vitaInput === "" || vitaInput == null) ? null : parseFloat(vitaInput);
    var colloVal = (colloInput === "" || colloInput == null) ? null : parseFloat(colloInput);
    var bfVal = navyBodyFatMale(vitaVal, colloVal, state.bodyConfig.altezza);
    var entry = {date: d, peso: pesoInput};
    if(vitaVal != null) entry.vita = vitaVal;
    if(colloVal != null) entry.collo = colloVal;
    if(bfVal != null) entry.bf = bfVal;
    var existing = state.bodyweight.find(function(b){ return b.date === d; });
    if(existing) Object.assign(existing, entry);
    else state.bodyweight.push(entry);
    persistAll();
    toast("Peso salvato ✓");
    render();
  } else if(act === "delete-peso"){
    if(confirm("Eliminare questa pesata?")){
      state.bodyweight = state.bodyweight.filter(function(b){ return b.date !== t.getAttribute("data-date"); });
      persistAll();
      render();
    }
  } else if(act === "bike-set-tipo"){
    bikeTipoInput = t.getAttribute("data-tipo");
    if(!bikeOreInput) bikeOreInput = 2;
    render();
  } else if(act === "bike-ore-step"){
    var oreDelta = parseFloat(t.getAttribute("data-delta"));
    bikeOreInput = Math.max(0.5, Math.round((bikeOreInput + oreDelta) * 10) / 10);
    render();
  } else if(act === "save-bike"){
    var bd = todayISO();
    var existingRide = state.bikeRides.find(function(r){ return r.date === bd; });
    if(existingRide){ existingRide.tipo = bikeTipoInput; existingRide.ore = bikeOreInput; }
    else state.bikeRides.push({date: bd, tipo: bikeTipoInput, ore: bikeOreInput});
    persistAll();
    toast("Uscita salvata ✓");
    render();
  } else if(act === "bike-clear"){
    state.bikeRides = state.bikeRides.filter(function(r){ return r.date !== todayISO(); });
    bikeTipoInput = null;
    persistAll();
    render();
  } else if(act === "meal-save-new"){
    var mta = document.getElementById("mealTextInput");
    saveNewMeal(mta ? mta.value : "");
  } else if(act === "nutri-edit-open"){
    openNutriEdit(t.getAttribute("data-id"));
  } else if(act === "nutri-edit-type"){
    if(nutriDraft){ nutriDraft.mealType = t.getAttribute("data-type"); render(); }
  } else if(act === "nutri-edit-cancel"){
    nutriDraft = null;
    render();
  } else if(act === "nutri-edit-save"){
    saveNutriEdit();
  } else if(act === "delete-nutri"){
    e.stopPropagation();
    if(confirm("Eliminare questo pasto?")){
      var delId = t.getAttribute("data-id");
      state.nutrition = state.nutrition.filter(function(n){ return n.id !== delId; });
      if(nutriDraft && nutriDraft.id === delId) nutriDraft = null;
      persistAll();
      render();
    }
  } else if(act === "copy-diary"){
    var days2 = parseInt(t.getAttribute("data-days"),10) || 1;
    var diaryText = buildDiaryText(days2);
    var box2 = document.getElementById("diaryTextBox");
    if(box2){
      box2.innerHTML = '<div class="field" style="margin-top:12px;"><label>Testo pronto da incollare in chat</label><textarea class="export-box" readonly id="diaryTextarea">'+diaryText.replace(/</g,"&lt;")+'</textarea><button class="btn small" style="margin-top:8px;" data-act="copy-diary-text">Copia negli appunti</button></div>';
    }
    var ta2 = document.getElementById("diaryTextarea");
    if(ta2){
      ta2.select();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(diaryText).then(function(){ toast("Copiato ✓"); }).catch(function(){});
      }
    }
  } else if(act === "copy-diary-text"){
    var ta3 = document.getElementById("diaryTextarea");
    if(ta3){
      ta3.select();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(ta3.value).then(function(){ toast("Copiato ✓"); }).catch(function(){ document.execCommand("copy"); toast("Copiato ✓"); });
      } else {
        document.execCommand("copy");
        toast("Copiato ✓");
      }
    }
  } else if(act === "apply-macro-paste"){
    var mpi = document.getElementById("macroPasteInput");
    var result = applyMacroPaste(mpi ? mpi.value : "");
    macroPasteMessage = result.applied ? (result.applied + " pasto/i aggiornati ✓") : "Nessuna riga valida trovata (formato atteso: id|kcal|proteine|carbo|grassi).";
    if(result.applied) toast("Macro applicati ✓");
    render();
  } else if(act === "copy-training-analysis"){
    var tmode = t.getAttribute("data-mode");
    lastTrainingCopyMode = tmode;
    var trainingText = tmode === "settimana" ? buildWeekAnalysisText(14) : buildSessionAnalysisText();
    var tbox = document.getElementById("trainingTextBox");
    if(tbox){
      tbox.innerHTML = '<div class="field" style="margin-top:12px;"><label>Testo pronto da incollare in chat</label><textarea class="export-box" readonly id="trainingTextarea">'+trainingText.replace(/</g,"&lt;")+'</textarea><button class="btn small" style="margin-top:8px;" data-act="copy-training-analysis-text">Copia negli appunti</button></div>';
    }
    var tta = document.getElementById("trainingTextarea");
    if(tta){
      tta.select();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(trainingText).then(function(){ toast("Copiato ✓"); }).catch(function(){});
      }
    }
  } else if(act === "copy-training-analysis-text"){
    var tta2 = document.getElementById("trainingTextarea");
    if(tta2){
      tta2.select();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(tta2.value).then(function(){ toast("Copiato ✓"); }).catch(function(){ document.execCommand("copy"); toast("Copiato ✓"); });
      } else {
        document.execCommand("copy");
        toast("Copiato ✓");
      }
    }
  } else if(act === "save-training-analysis"){
    var tpi = document.getElementById("trainingPasteInput");
    var tval = tpi ? tpi.value.trim() : "";
    if(tval){
      state.trainingAnalysis = {text: tval, date: todayISO(), mode: lastTrainingCopyMode || "sessione"};
      persistAll();
      toast("Analisi salvata ✓");
      render();
    } else {
      toast("Incolla prima il testo dell'IA");
    }
  } else if(act === "delete-training-analysis"){
    state.trainingAnalysis = null;
    persistAll();
    render();
  } else if(act === "force-rotation"){
    var target = t.getAttribute("data-scheda");
    var idx = ROTATION_SEQUENCE.indexOf(target);
    if(idx === -1) idx = 0;
    state.rotationIndex = idx;
    persistAll();
    toast("Prossima scheda impostata: "+target);
    render();
  } else if(act === "recalc-max"){
    var exIdM = t.getAttribute("data-ex");
    var est = computeEstimatedMaxFromHistory(exIdM);
    if(est){
      state.maxes[exIdM] = {value: est.value, date: est.date, source: "storico", fromWeight: est.fromWeight, fromReps: est.fromReps};
      persistAll();
      toast("Massimale ricalcolato: "+fmtNum(est.value)+" kg");
      render();
    } else {
      toast("Nessuno storico per questo esercizio");
    }
  } else if(act === "wipe-data"){
    if(confirm("Cancellare TUTTI i dati salvati (sedute, pesate, alimentazione, impostazioni)? L'operazione non è reversibile.")){
      localStorage.removeItem(LS.config);
      localStorage.removeItem(LS.workouts);
      localStorage.removeItem(LS.bodyweight);
      localStorage.removeItem(LS.rotation);
      localStorage.removeItem(LS.nutrition);
      localStorage.removeItem(LS.trainingAnalysis);
      localStorage.removeItem(LS.logDraft);
      localStorage.removeItem(LS.maxes);
      localStorage.removeItem(LS.cycleWeek);
      localStorage.removeItem(LS.bikeRides);
      localStorage.removeItem(LS.bodyConfig);
      localStorage.removeItem(LS.weekMenu);
      localStorage.removeItem(LS.cookDays);
      localStorage.removeItem(LS.mesociclo);
      localStorage.removeItem(LS.partner);
      localStorage.removeItem(LS.shoppingChecked);
      state.exercises = JSON.parse(JSON.stringify(DEFAULT_EXERCISES));
      state.workouts = [];
      state.bodyweight = [];
      state.rotationIndex = 0;
      state.nutrition = [];
      state.maxes = {};
      state.cycleWeek = {};
      state.bikeRides = [];
      state.bodyConfig = {altezza: 168, eta: 38};
      state.mesociclo = {obiettivo: "dimagrimento", dataInizio: todayISO(), durataSettimane: MESOCICLO_DURATA_DEFAULT.dimagrimento, pianoPdfMigrato: true};
      LEGACY_KEYS.forEach(function(k){ state[k] = null; });
      nutriDraft = null;
      logSession = null;
      toast("Dati cancellati");
      render();
    }
  } else if(act === "save-log-draft"){
    saveLogDraftManual();
  } else if(act === "toggle-consulta"){
    var ckey = t.getAttribute("data-key");
    openConsulta[ckey] = !openConsulta[ckey];
    render();
  } else if(act === "set-obiettivo"){
    var newObiettivo = t.getAttribute("data-obiettivo");
    if(newObiettivo === state.mesociclo.obiettivo) return;
    // Nuova fase: riparte da oggi con la durata di default (entrambe editabili subito sotto).
    state.mesociclo.obiettivo = newObiettivo;
    state.mesociclo.dataInizio = todayISO();
    state.mesociclo.durataSettimane = MESOCICLO_DURATA_DEFAULT[newObiettivo] || 4;
    persistAll();
    toast("Fase impostata: "+(MESOCICLO_OBJ_LABELS[newObiettivo]||newObiettivo)+" ✓");
    render();
  } else if(act === "restart-mesociclo"){
    // "Continua" dal promemoria di fine fase: stessa fase e durata, riparte solo la data.
    state.mesociclo.dataInizio = todayISO();
    persistAll();
    render();
  }
});

document.addEventListener("change", function(e){
  var t = e.target;
  if(t.getAttribute && t.getAttribute("data-act") === "nutri-edit-date"){
    if(nutriDraft){ nutriDraft.date = t.value || todayISO(); render(); }
  } else if(t.getAttribute && t.getAttribute("data-act") === "nutri-edit-text"){
    if(nutriDraft){ nutriDraft.text = t.value; }
  } else if(t.getAttribute && t.getAttribute("data-act") === "set-date"){
    if(logSession){ logSession.date = t.value || todayISO(); persistLogDraft(); render(); }
  } else if(t.getAttribute && t.getAttribute("data-act") === "ex-nota"){
    if(logSession){
      if(!logSession.exNotes) logSession.exNotes = {};
      logSession.exNotes[t.getAttribute("data-ex")] = t.value;
      persistLogDraft();
    }
  } else if(t.getAttribute && t.getAttribute("data-act") === "feedback-nota"){
    if(logSession){
      if(!logSession.feedback) logSession.feedback = {};
      logSession.feedback.nota = t.value;
      persistLogDraft();
    }
  } else if(t.getAttribute && t.getAttribute("data-act") === "feedback-zona-altro"){
    if(logSession){
      if(!logSession.feedback) logSession.feedback = {};
      logSession.feedback.doloreZonaAltro = t.value;
      persistLogDraft();
    }
  } else if(t.getAttribute && t.getAttribute("data-act") === "set-val"){
    if(logSession) setVal(t.getAttribute("data-ex"), parseInt(t.getAttribute("data-idx"),10), t.getAttribute("data-field"), t.value);
  } else if(t.getAttribute && t.getAttribute("data-act") === "set-inc"){
    var exId = t.getAttribute("data-ex");
    var v = parseFloat(t.value);
    if(!isNaN(v) && v >= 0){
      state.exercises[exId].inc = v;
      persistAll();
      toast("Incremento aggiornato");
    }
  } else if(t.getAttribute && t.getAttribute("data-act") === "set-max"){
    var exIdMax = t.getAttribute("data-ex");
    var vMax = parseFloat(String(t.value).replace(",", "."));
    if(!isNaN(vMax) && vMax > 0){
      state.maxes[exIdMax] = {value: Math.round(vMax*10)/10, date: todayISO(), source: "manuale"};
      persistAll();
      toast("Massimale aggiornato");
      render();
    }
  } else if(t.getAttribute && t.getAttribute("data-act") === "set-cycle-week"){
    var exIdCw = t.getAttribute("data-ex");
    var vCw = parseInt(t.value, 10);
    if(!isNaN(vCw) && vCw >= 1 && vCw <= 5){
      if(!state.cycleWeek) state.cycleWeek = {};
      state.cycleWeek[exIdCw] = vCw;
      persistAll();
      toast("Settimana ciclo impostata: "+vCw);
      render();
    }
  } else if(t.getAttribute && t.getAttribute("data-act") === "set-rest"){
    var exIdR = t.getAttribute("data-ex");
    var vR = parseInt(t.value, 10);
    if(!isNaN(vR) && vR >= 0){
      state.exercises[exIdR].rest = vR;
      persistAll();
      toast("Recupero aggiornato");
    }
  } else if(t.getAttribute && t.getAttribute("data-act") === "set-mesociclo"){
    var mField = t.getAttribute("data-field");
    if(mField === "dataInizio"){
      if(t.value) state.mesociclo.dataInizio = t.value;
    } else if(mField === "durataSettimane"){
      var durVal = parseInt(t.value, 10);
      if(!isNaN(durVal) && durVal > 0) state.mesociclo.durataSettimane = durVal;
    }
    persistAll();
    toast("Fase aggiornata ✓");
    render();
  } else if(t.getAttribute && t.getAttribute("data-act") === "set-body"){
    var bField = t.getAttribute("data-field");
    var bVal = parseFloat(String(t.value).replace(",", "."));
    if(!isNaN(bVal) && bVal > 0){
      state.bodyConfig[bField] = bVal;
      persistAll();
      toast("Aggiornato");
      render();
    }
  } else if(t.getAttribute && t.getAttribute("data-act") === "set-circ"){
    var cField = t.getAttribute("data-field");
    var cRaw = String(t.value).replace(",", ".").trim();
    var cVal = cRaw === "" ? "" : parseFloat(cRaw);
    if(cField === "vita") vitaInput = (cVal === "" || isNaN(cVal)) ? "" : cVal;
    else if(cField === "collo") colloInput = (cVal === "" || isNaN(cVal)) ? "" : cVal;
    render();
  } else if(t.getAttribute && t.getAttribute("data-act") === "import-file"){
    var file = t.files && t.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        if(!confirm("Importare questo backup? Sovrascriverà i dati attuali su questo telefono.")) return;
        if(data.exercises) state.exercises = data.exercises;
        if(data.workouts) state.workouts = data.workouts;
        if(data.bodyweight) state.bodyweight = data.bodyweight;
        if(data.nutrition) state.nutrition = data.nutrition;
        if(data.trainingAnalysis) state.trainingAnalysis = data.trainingAnalysis;
        if(data.maxes) state.maxes = data.maxes;
        if(data.cycleWeek) state.cycleWeek = data.cycleWeek;
        if(data.bikeRides) state.bikeRides = data.bikeRides;
        if(data.bodyConfig) state.bodyConfig = data.bodyConfig;
        if(data.mesociclo) state.mesociclo = data.mesociclo;
        LEGACY_KEYS.forEach(function(k){
          if(data[k] !== undefined && data[k] !== null){ state[k] = data[k]; saveJSON(LS[k], data[k]); }
        });
        persistAll();
        toast("Backup importato ✓");
        render();
      }catch(err){
        alert("File non valido.");
      }
    };
    reader.readAsText(file);
  }
});

/* ============================================================
   RENDER PRINCIPALE
   ============================================================ */
function updateHeader(){
  var sub = document.getElementById("headerSub");
  var titles = {oggi:"Allenamento", mealprep:"Alimentazione", consulta:"Consulta", impostazioni:"Impostazioni"};
  sub.textContent = titles[currentTab] || "";
}

function render(){
  updateHeader();
  if(currentTab === "oggi") renderOggi();
  else if(currentTab === "mealprep") renderMealPrep();
  else if(currentTab === "consulta") renderConsulta();
  else if(currentTab === "impostazioni") renderImpostazioni();
}

render();

   SERVICE WORKER (attivo solo se ospitata online, https)
   ============================================================ */
if("serviceWorker" in navigator && window.isSecureContext && location.protocol !== "file:"){
  window.addEventListener("load", function(){
    try{
      navigator.serviceWorker.register("sw.js").catch(function(){ /* nessun sw.js accanto: normale se il file è aperto da solo */ });
    }catch(e){ /* ambiente senza supporto reale: ignora */ }
  });
}

})();
