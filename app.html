html,body{
  margin:0;padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

  height:100%;
}
body{

  min-height:100dvh;
}
button, input{font-family:inherit;color:inherit;}
h1,h2,h3,p{margin:0 0 8px 0;}
.app-header{
  padding:calc(14px + var(--safe-t)) 16px 12px 16px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:5;
}
.app-header h1{font-size:19px;font-weight:700;}
.app-header .sub{color:var(--muted);font-size:13px;}
main{
  flex:1 1 auto;
  overflow-y:auto;
  padding:14px 14px calc(90px + var(--safe-b)) 14px;
  -webkit-overflow-scrolling:touch;
}
.view{display:none;}
.view.active{display:block;}
.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:14px;
}
.card h2{font-size:16px;color:var(--accent);}
.card h3{font-size:14px;color:var(--text);}
.muted{color:var(--muted);}
.small{font-size:12.5px;}
.row{display:flex;align-items:center;gap:10px;}
.row.between{justify-content:space-between;}
.wrap{flex-wrap:wrap;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat{
  background:var(--panel2);
  border-radius:12px;
  padding:12px;
  text-align:center;
}
.stat .num{font-size:22px;font-weight:700;color:var(--accent);}
.stat .label{font-size:12px;color:var(--muted);margin-top:2px;}

button{
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:600;
  -webkit-user-select:none;user-select:none;
}
.btn{
  min-height:52px;
  padding:12px 18px;
  font-size:16px;
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--border);
  width:100%;
}
.btn.primary{background:var(--accent);color:var(--accent-text);border:none;}
.btn.primary:active{background:var(--accent-dark);}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.btn.ghost{background:transparent;border:1px solid var(--border);}
.btn.small{min-height:44px;padding:8px 12px;font-size:14px;}
.btn-row{display:flex;gap:10px;}
.btn-row .btn{flex:1;}

.stepper{

  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}
.stepper button{
  width:54px;height:54px;
  min-height:54px;
  font-size:24px;
  background:transparent;
  color:var(--accent);
  border-radius:0;
  flex:0 0 auto;
}
.stepper button:active{background:rgba(79,209,143,0.15);}
.stepper .val{
  flex:1 1 auto;
  text-align:center;
  font-size:19px;
  font-weight:700;
  min-width:64px;
  padding:0 4px;
}
.stepper .unit{font-size:11px;color:var(--muted);font-weight:400;display:block;}

.exercise{
  border-top:1px solid var(--border);

.exercise:first-child{border-top:none;margin-top:0;padding-top:0;}

.suggestion{

.suggestion.up{background:rgba(79,209,143,0.15);color:var(--accent);}

.last-time{font-size:12.5px;color:var(--muted);margin-top:6px;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}

var DEFAULT_FOODS = {
  yogurt_greco:    {name:"Yogurt greco (intero)",  aliases:["yogurt greco","yogurt","yogurt greco intero"], kcal:115, prot:6.4, carb:2,  fat:9.1},
  muesli_proteico: {name:"Muesli proteico (Prozis Protein Muesli)", aliases:["muesli proteico","musli proteico","protein muesli","protein musli","muesli","musli"], kcal:368, prot:20,  carb:58, fat:4.7},
  burro_arachidi:  {name:"Burro di arachidi",       aliases:["burro di arachidi","burro d'arachidi","burro arachidi","peanut butter"], kcal:588, prot:25.1, carb:19.6, fat:50.4},
  whey:            {name:"Proteine whey (polvere)", aliases:["whey","proteine whey","whey protein","proteine in polvere"], kcal:375, prot:75, carb:7,  fat:5},
  mirtilli:        {name:"Mirtilli",                aliases:["mirtilli","mirtilli freschi"], kcal:57,  prot:0.7, carb:14, fat:0.3},
  banana:          {name:"Banana",                  aliases:["banana"], kcal:89, prot:1.1, carb:23, fat:0.3},
  mandorle:        {name:"Mandorle",                aliases:["mandorle"], kcal:579, prot:21, carb:22, fat:50},
  miele:           {name:"Miele",                   aliases:["miele"], kcal:304, prot:0.3, carb:82, fat:0},
  gallette_riso:   {name:"Gallette di riso",         aliases:["gallette","gallette di riso","gallette riso"], kcal:387, prot:8,  carb:81, fat:3},
  olio_evo:        {name:"Olio extravergine d'oliva",aliases:["olio","olio evo","olio d'oliva","olio extravergine","olio di oliva"], kcal:884, prot:0, carb:0, fat:100},
  petto_pollo:     {name:"Petto di pollo (cotto)",   aliases:["petto di pollo","pollo","petto pollo"], kcal:165, prot:31, carb:0, fat:3.6},
  tonno_naturale:  {name:"Tonno al naturale",        aliases:["tonno","tonno al naturale","tonno naturale"], kcal:116, prot:26, carb:0, fat:1},
  bresaola:        {name:"Bresaola",                 aliases:["bresaola"], kcal:151, prot:32, carb:0.4, fat:2},
  riso:            {name:"Riso (crudo)",             aliases:["riso","riso crudo","riso in bianco"], kcal:360, prot:7, carb:80, fat:1},
  pasta:           {name:"Pasta (cruda)",            aliases:["pasta","pasta cruda"], kcal:359, prot:12.5, carb:72, fat:1.5},
  pane:            {name:"Pane",                     aliases:["pane"], kcal:275, prot:9, carb:56, fat:1.5},
  verdure:         {name:"Verdure miste (generico)", aliases:["verdure","verdura","insalata"], kcal:25, prot:2, carb:4, fat:0.3}
};

// Conversione unità comuni → grammi (approssimata, modificabile a mano nell'anteprima pasto).
var UNIT_GRAMS = {
  "g":1, "gr":1, "grammi":1, "grammo":1,
  "cucchiaino":5, "cucchiaini":5,
  "cucchiaio":15, "cucchiai":15,
  "fetta":30, "fette":30,
  "tazza":200, "tazze":200
};

/* ============================================================
   STORAGE
   ============================================================ */
var LS = {
  config: "pp_config_v1",
  workouts: "pp_workouts_v1",
  bodyweight: "pp_bodyweight_v1",
  rotation: "pp_rotation_index_v1",
  nutrition: "pp_nutrition_v1",
  foods: "pp_foods_v1",
  restVersion: "pp_rest_version_v1"
};

var TARGETS = {
  allenamento: {kcal: 2250, prot: 150, carb: 250, grassi: 65, label:"Giorno di allenamento"},
  riposo:      {kcal: 1970, prot: 150, carb: 180, grassi: 65, label:"Giorno di riposo"}
};

function loadJSON(key, fallback){
  try{
    var raw = localStorage.getItem(key);
    if(!raw) return fallback;
    return JSON.parse(raw);
  }catch(e){ return fallback; }
}
function saveJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}

var state = {
  exercises: loadJSON(LS.config, null) || JSON.parse(JSON.stringify(DEFAULT_EXERCISES)),
  workouts: loadJSON(LS.workouts, []),
  bodyweight: loadJSON(LS.bodyweight, []),
  rotationIndex: loadJSON(LS.rotation, 0),
  nutrition: loadJSON(LS.nutrition, []),
  foods: loadJSON(LS.foods, null) || JSON.parse(JSON.stringify(DEFAULT_FOODS))
};
// Il vecchio "check alimentare" (sì/no per kcal/prot/carb/grassi) è superato dal diario
// con calcolo reale: le voci nel vecchio formato (senza "items") non sono più leggibili,
// vengono scartate al primo avvio della nuova versione.
state.nutrition = state.nutrition.filter(function(n){ return Array.isArray(n.items); });

// merge in any new food keys added in future updates without wiping user edits/aggiunte
(function mergeFoods(){
  var changed = false;
  Object.keys(DEFAULT_FOODS).forEach(function(k){
    if(!state.foods[k]){ state.foods[k] = JSON.parse(JSON.stringify(DEFAULT_FOODS[k])); changed = true; }
  });
  if(changed) saveJSON(LS.foods, state.foods);
})();

// merge in any new exercise keys added in future updates without wiping user edits
var REST_DEFAULTS_VERSION = 2; // v2 = valori di recupero basati su Project Invictus (bracket per range di ripetizioni)
(function mergeConfig(){
  var changed = false;
  Object.keys(DEFAULT_EXERCISES).forEach(function(k){
    if(!state.exercises[k]){ state.exercises[k] = JSON.parse(JSON.stringify(DEFAULT_EXERCISES[k])); changed = true; }
    else if(state.exercises[k].rest === undefined){ state.exercises[k].rest = DEFAULT_EXERCISES[k].rest; changed = true; }
  });
  var storedRestVersion = loadJSON(LS.restVersion, 0);
  if(storedRestVersion < REST_DEFAULTS_VERSION){
    Object.keys(DEFAULT_EXERCISES).forEach(function(k){
      if(state.exercises[k]) state.exercises[k].rest = DEFAULT_EXERCISES[k].rest;
    });
    saveJSON(LS.restVersion, REST_DEFAULTS_VERSION);
    changed = true;
  }
  if(changed) saveJSON(LS.config, state.exercises);
})();

function formatRest(sec){
  if(!sec) return "—";
  if(sec % 60 === 0) return (sec/60)+" min";
  var m = Math.floor(sec/60), s = sec % 60;
  return m+"'"+s+'"';
}

function persistAll(){
  saveJSON(LS.config, state.exercises);
  saveJSON(LS.workouts, state.workouts);
  saveJSON(LS.bodyweight, state.bodyweight);
  saveJSON(LS.rotation, state.rotationIndex);
  saveJSON(LS.nutrition, state.nutrition);
  saveJSON(LS.foods, state.foods);
}

function dayTypeFor(date){
  var hasWorkout = state.workouts.some(function(w){ return w.date === date; });
  return hasWorkout ? "allenamento" : "riposo";
}

/* ============================================================
   DIARIO ALIMENTARE: parsing testo libero, matching alimenti, totali
   ============================================================ */
function normalizeText(s){
  return String(s).toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/[^a-z0-9 ]/g," ")
    .replace(/\s+/g," ").trim();
}

function round1(n){ return Math.round(n*10)/10; }

function matchFood(text){
  var nt = normalizeText(text);
  if(!nt) return null;
  var bestId = null, bestScore = 0;
  Object.keys(state.foods).forEach(function(id){
    var f = state.foods[id];
    var aliases = (f.aliases && f.aliases.length) ? f.aliases : [f.name];
    aliases.forEach(function(a){
      var na = normalizeText(a);
      if(!na) return;
      if(nt === na && bestScore < 100){ bestId = id; bestScore = 100; }
      else if((nt.indexOf(na) > -1 || na.indexOf(nt) > -1) && na.length > 2 && bestScore < 50){
        bestId = id; bestScore = 50;
      }
    });
  });
  return bestId;
}

var UNIT_WORDS_RE = "g|gr|grammi|grammo|cucchiaini|cucchiaino|cucchiai|cucchiaio|fette|fetta|tazze|tazza";

// Scompone una frase tipo "150gr yogurt greco, 30gr protein musli, cucchiaino burro d'arachidi"
// in voci {raw, grams, foodId, foodName}. Non è un parser robusto per frasi qualsiasi:
// gestisce il pattern "numero+unità nome" o "unità nome" (quantità implicita 1), separate da virgola.
function parseMealText(text){
  var parts = String(text).split(/,| e (?=\d)|\n/i).map(function(s){ return s.trim(); }).filter(Boolean);
  if(!parts.length) return [];
  return parts.map(function(part){
    var qty = null, unit = "g", rest = part;
    var m = part.match(new RegExp("^(\\d+[.,]?\\d*)\\s*("+UNIT_WORDS_RE+")?\\s+(.*)$", "i"));
    if(m){
      qty = parseFloat(m[1].replace(",", "."));
      unit = (m[2] || "g").toLowerCase();
      rest = m[3].trim();
    } else {
      var m2 = part.match(new RegExp("^("+UNIT_WORDS_RE+")\\s+(.*)$", "i"));
      if(m2){ qty = 1; unit = m2[1].toLowerCase(); rest = m2[2].trim(); }
    }
    var grams = (qty !== null) ? round1(qty * (UNIT_GRAMS[unit] || 1)) : null;
    var foodId = matchFood(rest);
    return {
      raw: part,
      grams: grams,
      foodId: foodId,
      foodName: foodId ? state.foods[foodId].name : rest
    };
  });
}

function nutritionTotalsForDate(date){
  var entries = state.nutrition.filter(function(n){ return n.date === date; });
  var t = {kcal:0, prot:0, carb:0, fat:0};
  entries.forEach(function(n){ t.kcal += n.kcal; t.prot += n.prot; t.carb += n.carb; t.fat += n.fat; });
  return {entries: entries, totals: t};
}

function nutritionDailyTotals(limitDays){
  var byDate = {};
  state.nutrition.forEach(function(n){
    if(!byDate[n.date]) byDate[n.date] = {date:n.date, kcal:0, prot:0, carb:0, fat:0};
    byDate[n.date].kcal += n.kcal; byDate[n.date].prot += n.prot; byDate[n.date].carb += n.carb; byDate[n.date].fat += n.fat;
  });
  var arr = Object.keys(byDate).map(function(d){ return byDate[d]; });
  arr.sort(function(a,b){ return a.date < b.date ? 1 : -1; });
  return limitDays ? arr.slice(0, limitDays) : arr;
}

   ============================================================ */
// Ordina le sedute per data (crescente); a parità di data, per ordine di inserimento (id).
// Serve perché con la modifica/aggiunta di sedute retroattive l'ordine nell'array
// non è più garantito coincidere con l'ordine cronologico reale.
function sortedWorkoutsAsc(){
  return state.workouts.slice().sort(function(a,b){
    if(a.date !== b.date) return a.date < b.date ? -1 : 1;
    return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0);
  });
}

function lastPerformance(exId, excludeId){
  var list = sortedWorkoutsAsc();
  for(var i = list.length - 1; i >= 0; i--){
    var w = list[i];
    if(excludeId && w.id === excludeId) continue;
    for(var j = 0; j < w.exercises.length; j++){
      if(w.exercises[j].id === exId) return {workout:w, ex:w.exercises[j]};
    }
  }
  return null;
}

// Ritorna {weight, targetLo, targetHi, sets, note, hasHistory}
function suggestFor(exId, setsCount, excludeId){
  var cfg = state.exercises[exId];
  var perf = lastPerformance(exId, excludeId);
  var startWeight = (exId === "leg_raise" || exId === "dips_zavorrate" || exId === "trazioni") ? 0 : 0;
  if(!perf){
    return {
      weight: startWeight,
      reps: new Array(setsCount).fill(cfg.lo),
      note: "Prima volta: parti leggero e trova il carico.",
      noteType:"hold"
    };
  }
  var lastSets = perf.ex.sets;
  var lastWeight = lastSets.length ? lastSets[0].peso : startWeight;
  var allAtTop = lastSets.length > 0 && lastSets.every(function(s){ return s.reps >= cfg.hi; });

  var newWeight = lastWeight;
  var repsGuess;
  var note, noteType;

  if(cfg.kind === "principal"){
    if(allAtTop){
      newWeight = lastWeight + cfg.inc;
      note = "Serie chiuse a " + cfg.hi + ": sali a " + fmtNum(newWeight) + " kg";
      noteType = "up";
      repsGuess = new Array(setsCount).fill(cfg.lo);
    } else {
      note = "Ripeti " + fmtNum(lastWeight) + " kg, punta a " + cfg.hi + " su tutte";
      noteType = "hold";
      repsGuess = lastSets.map(function(s){ return s.reps; });
    }
  } else {
    if(allAtTop){
      newWeight = lastWeight + cfg.inc;
      note = "Top range raggiunto: sali a " + fmtNum(newWeight) + " kg, riparti da " + cfg.lo;
      noteType = "up";
      repsGuess = new Array(setsCount).fill(cfg.lo);
    } else {
      note = "Ripeti " + fmtNum(lastWeight) + " kg, punta a " + cfg.hi;
      noteType = "hold";
      repsGuess = lastSets.map(function(s){ return s.reps; });
    }
  }
  while(repsGuess.length < setsCount) repsGuess.push(cfg.lo);
  repsGuess = repsGuess.slice(0, setsCount);

  return {
    weight: newWeight,
    reps: repsGuess,
    note: note,
    noteType: noteType,
    lastText: lastSets.map(function(s){ return fmtNum(s.peso)+"x"+s.reps; }).join(", "),
    lastDate: perf.workout.date
  };
}

var logSession = null; // {schedaId, variant, date, editId, exIds, sets: {exId: [{peso,reps,done}, ...]}}

function startLog(schedaId, variant){
  var scheda = SCHEDE[schedaId];
  var exIds = scheda.exercises.slice();
  if(schedaId === "B" && variant){
    exIds = exIds.filter(function(id){ return id !== "squat"; });
  }
  var sets = {};
  exIds.forEach(function(exId){
    var cfg = state.exercises[exId];
    var setsCount = cfg.defSets;
    if(schedaId === "B" && variant && exId === "leg_press") setsCount = 4;
    var sug = suggestFor(exId, setsCount);
    var arr = [];
    for(var i=0;i<setsCount;i++){
      arr.push({peso: sug.weight, reps: (sug.reps[i] !== undefined ? sug.reps[i] : cfg.lo), done:false});
    }
    sets[exId] = arr;
  });
  logSession = {schedaId: schedaId, variant: !!variant, date: todayISO(), editId: null, exIds: exIds, sets: sets};
  showTab("oggi");
}

// Riapre una seduta già salvata per correggerla (carichi/rip/data sbagliati,
// o una seduta dimenticata inserita col giorno sbagliato).
function editSession(id){
  var w = state.workouts.find(function(x){ return x.id === id; });
  if(!w) return;
  var exIds = w.exercises.map(function(e){ return e.id; });
  var sets = {};
  w.exercises.forEach(function(e){
    sets[e.id] = e.sets.map(function(s){ return {peso:s.peso, reps:s.reps, done:true}; });
  });
  logSession = {schedaId: w.scheda, variant: !!w.variant, date: w.date, editId: w.id, exIds: exIds, sets: sets};
  showTab("oggi");
}

function cancelLog(){
  logSession = null;
  render();
}

function saveLog(){
  if(!logSession) return;
  var exercisesOut = logSession.exIds.map(function(exId){
    return {id: exId, sets: logSession.sets[exId].map(function(s){ return {peso:s.peso, reps:s.reps}; })};
  });
  if(logSession.editId){
    var idx = state.workouts.findIndex(function(w){ return w.id === logSession.editId; });
    if(idx > -1){
      state.workouts[idx] = {
        id: logSession.editId,
        date: logSession.date || todayISO(),
        scheda: logSession.schedaId,
        variant: logSession.variant,
        exercises: exercisesOut
      };
    }
    persistAll();
    logSession = null;
    toast("Seduta aggiornata ✓");
    render();
    return;
  }
  var workout = {
    id: uid(),
    date: logSession.date || todayISO(),
    scheda: logSession.schedaId,
    variant: logSession.variant,
    exercises: exercisesOut
  };
  state.workouts.push(workout);
  advanceRotation();
  persistAll();
  logSession = null;
  toast("Seduta salvata ✓");
  render();
}

function stepSet(exId, idx, field, delta){
  var s = logSession.sets[exId][idx];
  if(field === "peso"){
    var cfg = state.exercises[exId];
    s.peso = Math.max(0, Math.round((s.peso + delta * cfg.inc) * 100) / 100);
  } else {
    s.reps = Math.max(0, s.reps + delta);
  }
  render();
}

function setVal(exId, idx, field, raw){
  var s = logSession.sets[exId][idx];
  var v = parseFloat(String(raw).replace(",", "."));
  if(isNaN(v) || v < 0) v = 0;
  s[field] = (field === "peso") ? (Math.round(v*100)/100) : Math.round(v);
  render();
}

function toggleDone(exId, idx){
  var s = logSession.sets[exId][idx];
  s.done = !s.done;
  render();
}

function rowsToCSVText(rows){
  return rows.map(function(r){
    return r.map(function(v){
      v = String(v);
      if(v.indexOf(",")>-1 || v.indexOf('"')>-1){ v = '"'+v.replace(/"/g,'""')+'"'; }
      return v;
    }).join(",");
  }).join("\n");
}

function toCSV(){
  var rows = [["=== SEDUTE ==="],["data","scheda","variante","esercizio","serie","peso","ripetizioni"]];
  state.workouts.forEach(function(w){
    w.exercises.forEach(function(ex){
      var cfg = state.exercises[ex.id] || {name: ex.id};
      ex.sets.forEach(function(s, idx){
        rows.push([w.date, w.scheda, w.variant?"si":"no", cfg.name, String(idx+1), fmtNum(s.peso), String(s.reps)]);
      });
    });
  });

  rows.push([]);
  rows.push(["=== PESO CORPOREO ==="]);
  rows.push(["data","peso_kg"]);
  state.bodyweight.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; }).forEach(function(b){
    rows.push([b.date, fmtNum(b.peso)]);
  });

  rows.push([]);
  rows.push(["=== ALIMENTAZIONE ==="]);
  rows.push(["data","alimento","grammi","kcal","proteine_g","carbo_g","grassi_g"]);
  state.nutrition.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; }).forEach(function(n){
    n.items.forEach(function(it){
      rows.push([n.date, it.name, fmtNum(it.grams), fmtNum(it.kcal), fmtNum(it.prot), fmtNum(it.carb), fmtNum(it.fat)]);
    });
  });

  return rowsToCSVText(rows);
}

function toJSON(){
  return JSON.stringify({
    exportedAt: new Date().toISOString(),

    workouts: state.workouts,

function doExport(format){
  var content = format === "csv" ? toCSV() : toJSON();
  var filename = "palestra-registro-"+todayISO()+"."+format;
  var mime = format === "csv" ? "text/csv" : "application/json";

  var box = document.getElementById("exportBox");

  function showFallback(){
    var h = '<div class="field" style="margin-top:12px;">';
    h += '<label>Contenuto '+format.toUpperCase()+' (copia da qui se la condivisione non funziona)</label>';
    h += '<textarea class="export-box" readonly id="exportTextarea">'+content.replace(/</g,"&lt;")+'</textarea>';
    h += '<button class="btn small" style="margin-top:8px;" data-act="copy-export">Copia negli appunti</button>';
    h += '</div>';
    if(box) box.innerHTML = h;
  }

  if(navigator.share && navigator.canShare){
    try{
      var file = new File([content], filename, {type: mime});
      if(navigator.canShare({files:[file]})){
        navigator.share({files:[file], title: filename}).catch(function(){ showFallback(); });
        return;
      }
    }catch(e){}
  }

  try{
    var blob = new Blob([content], {type: mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }catch(e){}

  showFallback();
}

    var c = mealItemComputed(it);

            kcal: c.kcal, prot: c.prot, carb: c.carb, fat: c.fat};
  });
  var totals = items.reduce(function(acc,i){ acc.kcal+=i.kcal; acc.prot+=i.prot; acc.carb+=i.carb; acc.fat+=i.fat; return acc; }, {kcal:0,prot:0,carb:0,fat:0});
  state.nutrition.push({
    id: uid(), date: mealDraft.date, text: mealDraft.rawText, items: items,
    kcal: round1(totals.kcal), prot: round1(totals.prot), carb: round1(totals.carb), fat: round1(totals.fat)
  });
  // Alimenti non riconosciuti in fase di analisi: se in anteprima sono stati compilati
  // dei valori per 100g, li salvo nel database per essere riconosciuti la prossima volta.
  mealDraft.items.forEach(function(it){
    if(!it.foodId && it.name && (it.kcal100 || it.prot100 || it.carb100 || it.fat100)){
      var key = normalizeText(it.name).replace(/ /g,"_").slice(0,40) || uid();
      if(!state.foods[key]){
        state.foods[key] = {name: it.name, aliases:[it.name], kcal:it.kcal100, prot:it.prot100, carb:it.carb100, fat:it.fat100};
      }
    }
  });
  persistAll();
  mealDraft = null;
  toast("Pasto salvato ✓");
  render();
}

function renderSparkline(){
  var sorted = state.bodyweight.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; }).slice(-14);
  if(sorted.length < 2) return '<p class="muted small">Servono più pesate.</p>';
  var vals = sorted.map(function(b){ return b.peso; });
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  var range = (max - min) || 1;
  var w = 300, h = 56, pad = 4;
  var pts = vals.map(function(v, i){
    var x = pad + (i/(vals.length-1)) * (w - pad*2);
    var y = h - pad - ((v - min)/range) * (h - pad*2);
    return x.toFixed(1)+","+y.toFixed(1);
  }).join(" ");
  return '<svg class="sparkline" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
    '<polyline points="'+pts+'" fill="none" stroke="#4fd18f" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
    '</svg>';
}

document.addEventListener("click", function(e){
  var t = e.target.closest("[data-act]");
  if(!t) return;
  var act = t.getAttribute("data-act");

  if(act === "start-log"){
    startLog(t.getAttribute("data-scheda"), t.getAttribute("data-variant") === "1");
  } else if(act === "cancel-log"){
    cancelLog();
  } else if(act === "save-log"){
    saveLog();
  } else if(act === "step"){
    stepSet(t.getAttribute("data-ex"), parseInt(t.getAttribute("data-idx"),10), t.getAttribute("data-field"), parseFloat(t.getAttribute("data-delta")));
  } else if(act === "toggle-done"){
    toggleDone(t.getAttribute("data-ex"), parseInt(t.getAttribute("data-idx"),10));
  } else if(act === "toggle-session"){
    var id = t.getAttribute("data-id");
    openSessionId = openSessionId === id ? null : id;
    render();
  } else if(act === "edit-session"){
    e.stopPropagation();
    editSession(t.getAttribute("data-id"));
  } else if(act === "delete-session"){
    e.stopPropagation();
    if(confirm("Eliminare questa seduta?")){
      state.workouts = state.workouts.filter(function(w){ return w.id !== t.getAttribute("data-id"); });
      persistAll();
      render();
    }
  } else if(act === "export"){
    doExport(t.getAttribute("data-format"));
  } else if(act === "copy-export"){
    var ta = document.getElementById("exportTextarea");
    if(ta){
      ta.select();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(ta.value).then(function(){ toast("Copiato ✓"); }).catch(function(){ document.execCommand("copy"); toast("Copiato ✓"); });
      } else {
        document.execCommand("copy");
        toast("Copiato ✓");
      }
    }
  } else if(act === "peso-step"){
    var delta = parseFloat(t.getAttribute("data-delta"));
    pesoInput = Math.round((pesoInput + delta) * 10) / 10;
    if(pesoInput < 0) pesoInput = 0;
    render();
  } else if(act === "save-peso"){
    var d = todayISO();
    var existing = state.bodyweight.find(function(b){ return b.date === d; });
    if(existing) existing.peso = pesoInput;
    else state.bodyweight.push({date: d, peso: pesoInput});
    persistAll();
    toast("Peso salvato ✓");
    render();
  } else if(act === "delete-peso"){
    if(confirm("Eliminare questa pesata?")){
      state.bodyweight = state.bodyweight.filter(function(b){ return b.date !== t.getAttribute("data-date"); });
      persistAll();
      render();
    }
  } else if(act === "meal-analyze"){
    var ta = document.getElementById("mealTextInput");
    var txt = ta ? ta.value.trim() : "";
    if(txt){ analyzeMealText(txt, todayISO()); render(); }
  } else if(act === "meal-remove-item"){
    if(mealDraft){
      mealDraft.items.splice(parseInt(t.getAttribute("data-idx"),10), 1);
      render();
    }
  } else if(act === "meal-add-item"){
    if(mealDraft){
      mealDraft.items.push({foodId:null, name:"Nuovo alimento", grams:100, kcal100:0, prot100:0, carb100:0, fat100:0});
      render();
    }
  } else if(act === "meal-cancel"){
    mealDraft = null;
    render();
  } else if(act === "meal-save"){
    saveMeal();
  } else if(act === "toggle-nutri"){
    var nid = t.getAttribute("data-id");
    openNutriId = openNutriId === nid ? null : nid;
    render();
  } else if(act === "delete-nutri"){
    e.stopPropagation();
    if(confirm("Eliminare questo pasto?")){
      state.nutrition = state.nutrition.filter(function(n){ return n.id !== t.getAttribute("data-id"); });
      persistAll();
      render();
    }
  } else if(act === "force-rotation"){
    var target = t.getAttribute("data-scheda");
    var idx = ROTATION_SEQUENCE.indexOf(target);
    if(idx === -1) idx = 0;
    state.rotationIndex = idx;
    persistAll();
    toast("Prossima scheda impostata: "+target);
    render();
  } else if(act === "wipe-data"){
    if(confirm("Cancellare TUTTI i dati salvati (sedute, pesate, alimentazione, impostazioni)? L'operazione non è reversibile.")){
      localStorage.removeItem(LS.config);
      localStorage.removeItem(LS.workouts);
      localStorage.removeItem(LS.bodyweight);
      localStorage.removeItem(LS.rotation);
      localStorage.removeItem(LS.nutrition);
      localStorage.removeItem(LS.foods);
      state.exercises = JSON.parse(JSON.stringify(DEFAULT_EXERCISES));
      state.workouts = [];
      state.bodyweight = [];
      state.rotationIndex = 0;
      state.nutrition = [];
      state.foods = JSON.parse(JSON.stringify(DEFAULT_FOODS));
      mealDraft = null;
      toast("Dati cancellati");
      render();
    }
  }
});

document.addEventListener("change", function(e){
  var t = e.target;
  if(t.getAttribute && t.getAttribute("data-act") === "meal-date"){
    if(mealDraft){ mealDraft.date = t.value || todayISO(); render(); }
  } else if(t.getAttribute && t.getAttribute("data-act") === "meal-name"){
    if(mealDraft){
      var idx = parseInt(t.getAttribute("data-idx"),10);
      var it = mealDraft.items[idx];
      // Riassocia automaticamente a un alimento del database solo se questa voce non ha
      // ancora valori nutrizionali (es. una voce nuova, vuota): altrimenti rinominare
      // sovrascriverebbe in silenzio valori già confermati o corretti a mano.
      var isBlank = !it.kcal100 && !it.prot100 && !it.carb100 && !it.fat100;
      it.name = t.value;
      if(isBlank){
        var fid = matchFood(t.value);
        if(fid){
          var f = state.foods[fid];
          it.foodId = fid; it.name = f.name; it.kcal100 = f.kcal; it.prot100 = f.prot; it.carb100 = f.carb; it.fat100 = f.fat;
        }
      } else {
        it.foodId = null; // ora è un nome personalizzato, scollegato dal database
      }
      render();
    }
  } else if(t.getAttribute && t.getAttribute("data-act") === "meal-grams"){
    if(mealDraft){
      var v = parseFloat(t.value);
      mealDraft.items[parseInt(t.getAttribute("data-idx"),10)].grams = (isNaN(v)||v<0) ? 0 : v;
      render();
    }
  } else if(t.getAttribute && t.getAttribute("data-act") === "meal-macro"){
    if(mealDraft){
      var v2 = parseFloat(t.value);
      mealDraft.items[parseInt(t.getAttribute("data-idx"),10)][t.getAttribute("data-field")] = (isNaN(v2)||v2<0) ? 0 : v2;
      render();
    }
  } else if(t.getAttribute && t.getAttribute("data-act") === "set-date"){
    if(logSession){ logSession.date = t.value || todayISO(); render(); }
  } else if(t.getAttribute && t.getAttribute("data-act") === "set-val"){
    if(logSession) setVal(t.getAttribute("data-ex"), parseInt(t.getAttribute("data-idx"),10), t.getAttribute("data-field"), t.value);
  } else if(t.getAttribute && t.getAttribute("data-act") === "food-macro"){
    var fid = t.getAttribute("data-food");
    var field = t.getAttribute("data-field");
    var vf = parseFloat(t.value);
    if(!isNaN(vf) && vf >= 0 && state.foods[fid]){
      state.foods[fid][field] = vf;
      saveJSON(LS.foods, state.foods);
    }
  } else if(t.getAttribute && t.getAttribute("data-act") === "set-inc"){
    var exId = t.getAttribute("data-ex");
    var v = parseFloat(t.value);
    if(!isNaN(v) && v >= 0){
      state.exercises[exId].inc = v;
      persistAll();
      toast("Incremento aggiornato");
    }
  } else if(t.getAttribute && t.getAttribute("data-act") === "set-rest"){
    var exIdR = t.getAttribute("data-ex");
    var vR = parseInt(t.value, 10);
    if(!isNaN(vR) && vR >= 0){
      state.exercises[exIdR].rest = vR;
      persistAll();
      toast("Recupero aggiornato");
    }
  } else if(t.getAttribute && t.getAttribute("data-act") === "import-file"){
    var file = t.files && t.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        if(!confirm("Importare questo backup? Sovrascriverà i dati attuali su questo telefono.")) return;
        if(data.exercises) state.exercises = data.exercises;
        if(data.workouts) state.workouts = data.workouts;
        if(data.bodyweight) state.bodyweight = data.bodyweight;
        if(data.nutrition) state.nutrition = data.nutrition;
        if(data.foods) state.foods = data.foods;
        persistAll();
        toast("Backup importato ✓");
        render();
      }catch(err){
        alert("File non valido.");
      }
    };
    reader.readAsText(file);
  }
});

/* ============================================================
   RENDER PRINCIPALE
   ============================================================ */
function updateHeader(){
  var sub = document.getElementById("headerSub");
  var titles = {oggi:"Oggi", registro:"Registro", peso:"Salute", consulta:"Consulta", impostazioni:"Impostazioni"};
  sub.textContent = titles[currentTab] || "";
}

function render(){
  updateHeader();
  if(currentTab === "oggi") renderOggi();
  else if(currentTab === "registro") renderRegistro();
  else if(currentTab === "peso") renderPeso();
  else if(currentTab === "consulta") renderConsulta();
  else if(currentTab === "impostazioni") renderImpostazioni();
}

render();

/* ============================================================
   SERVICE WORKER (attivo solo se ospitata online, https)
   ============================================================ */
if("serviceWorker" in navigator && window.isSecureContext && location.protocol !== "file:"){
  window.addEventListener("load", function(){
    try{
      navigator.serviceWorker.register("sw.js").catch(function(){ /* nessun sw.js accanto: normale se il file è aperto da solo */ });
    }catch(e){ /* ambiente senza supporto reale: ignora */ }
  });
}

})();
</script>
