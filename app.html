  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior-y:none;
  height:100%;
}
body{
  display:flex;flex-direction:column;
  min-height:100vh;
  min-height:100dvh;
}
button, input{font-family:inherit;color:inherit;}
h1,h2,h3,p{margin:0 0 8px 0;}
.app-header{
  padding:calc(14px + var(--safe-t)) 16px 12px 16px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:5;
}
.app-header h1{font-size:19px;font-weight:700;}
.app-header .sub{color:var(--muted);font-size:13px;}
main{
  flex:1 1 auto;
  overflow-y:auto;
  padding:14px 14px calc(90px + var(--safe-b)) 14px;
  -webkit-overflow-scrolling:touch;
}
.view{display:none;}
.view.active{display:block;}
.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:14px;
}
.card h2{font-size:16px;color:var(--accent);}
.card h3{font-size:14px;color:var(--text);}
.muted{color:var(--muted);}
.small{font-size:12.5px;}
.row{display:flex;align-items:center;gap:10px;}
.row.between{justify-content:space-between;}
.wrap{flex-wrap:wrap;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid2 > div{min-width:0;}
.grid2 input{width:100%;}
.stat{
  background:var(--panel2);
  border-radius:12px;
  padding:12px;
  text-align:center;
}
.stat .num{font-size:22px;font-weight:700;color:var(--accent);}
.stat .label{font-size:12px;color:var(--muted);margin-top:2px;}

button{
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:600;
  -webkit-user-select:none;user-select:none;
}
.btn{
  min-height:52px;
  padding:12px 18px;
  font-size:16px;
  background:var(--panel2);
  color:var(--text);
  border:1px solid var(--border);
  width:100%;
}
.btn.primary{background:var(--accent);color:var(--accent-text);border:none;}
.btn.primary:active{background:var(--accent-dark);}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.btn.ghost{background:transparent;border:1px solid var(--border);}
.btn.small{min-height:44px;padding:8px 12px;font-size:14px;}
.btn-row{display:flex;gap:10px;}
.btn-row .btn{flex:1;}

.stepper{
  display:flex;align-items:center;
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}
.stepper button{
  width:54px;height:54px;
  min-height:54px;
  font-size:24px;
  background:transparent;
  color:var(--accent);
  border-radius:0;
  flex:0 0 auto;
}
.stepper button:active{background:rgba(79,209,143,0.15);}
.stepper .val{
  flex:1 1 auto;
  text-align:center;
  font-size:19px;
  font-weight:700;
  min-width:64px;
  padding:0 4px;
}
.stepper .unit{font-size:11px;color:var(--muted);font-weight:400;display:block;}

.exercise{
  border-top:1px solid var(--border);
  padding-top:14px;
  margin-top:14px;
}
.exercise:first-child{border-top:none;margin-top:0;padding-top:0;}
.exercise .exname{font-size:15.5px;font-weight:700;}
.exercise .exmeta{font-size:12.5px;color:var(--muted);margin-top:1px;}
.suggestion{
  display:inline-block;
  margin-top:6px;
  padding:4px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
}
.suggestion.up{background:rgba(79,209,143,0.15);color:var(--accent);}
.suggestion.hold{background:rgba(154,164,175,0.15);color:var(--muted);}
.last-time{font-size:12.5px;color:var(--muted);margin-top:6px;}
.set-row{
  display:grid;
  grid-template-columns:22px 1fr 1fr 54px;
  gap:6px;
  align-items:stretch;
  margin-top:10px;
}
.set-row .setlabel{
  font-size:12.5px;color:var(--muted);
  writing-mode:vertical-rl;text-orientation:mixed;
  display:flex;align-items:center;justify-content:center;
}
.stepper-v{
  display:flex;flex-direction:column;
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}
.stepper-v button{
  width:100%;min-height:52px;
  font-size:24px;font-weight:700;
  background:transparent;color:var(--accent);
  border-radius:0;
}
.stepper-v button:active{background:rgba(79,209,143,0.15);}
.stepper-v .val{
  text-align:center;padding:6px 4px;
  font-size:19px;font-weight:700;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
}
.stepper-v .val .unit{font-size:10.5px;color:var(--muted);font-weight:400;display:block;}
.val-input{
  width:100%;display:block;
  background:transparent;border:none;outline:none;
  color:var(--text);font-family:inherit;
  font-size:19px;font-weight:700;text-align:center;
  padding:0;-moz-appearance:textfield;
}
.val-input::-webkit-inner-spin-button,.val-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.field input[type=date]{
  width:auto;min-height:44px;
  background:var(--panel2);color:var(--text);
  border:1px solid var(--border);border-radius:10px;
  padding:8px 12px;font-size:14px;
}
.done-btn{
  width:100%;min-height:52px;
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:12px;
  color:var(--muted);
  font-size:22px;
  display:flex;align-items:center;justify-content:center;
}
.done-btn.done{background:var(--accent);border-color:var(--accent);color:var(--accent-text);}
.done-btn.partial{background:#f2c14e;border-color:#f2c14e;color:#04150c;}
.done-btn.skipped{background:var(--danger);border-color:var(--danger);color:#fff;}

nav.tabbar{
  position:fixed;left:0;right:0;bottom:0;
  display:flex;
  background:var(--panel);
  border-top:1px solid var(--border);
  padding-bottom:var(--safe-b);
  z-index:10;
}
nav.tabbar button{
  flex:1;
  background:transparent;
  border-radius:0;
  padding:9px 2px 8px 2px;
  min-height:58px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
}
nav.tabbar button .ic{font-size:20px;}
nav.tabbar button.active{color:var(--accent);}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th,td{text-align:left;padding:6px 5px;border-bottom:1px solid var(--border);}
th{color:var(--muted);font-weight:600;font-size:12px;}

.badge{
  display:inline-block;padding:3px 9px;border-radius:999px;
  font-size:11.5px;font-weight:700;
  background:var(--panel2);color:var(--accent);border:1px solid var(--border);
}
.badge.variant{color:#f2c14e;}

.session-item{
  border-bottom:1px solid var(--border);
  padding:10px 0;
}
.session-item:last-child{border-bottom:none;}
.session-item .head{cursor:pointer;}
.session-detail{display:none;margin-top:8px;font-size:13px;}
.session-detail.open{display:block;}
.session-detail table{margin-top:6px;}

.meal-row{border-top:1px solid var(--border);padding-top:8px;}
.meal-row:first-child{border-top:none;padding-top:0;}
.meal-row .meal-row-head{cursor:pointer;}
.meal-row .meal-row-head .chev{color:var(--accent);font-size:12px;}
.meal-row-body{display:none;margin-top:8px;}
.meal-row-body.open{display:block;}

.check-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;}
.check-item:last-of-type{border-bottom:none;}
.check-item .checkbox{flex:0 0 auto;width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--panel2);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:15px;font-weight:700;margin-top:1px;}
.check-item.checked .checkbox{background:var(--accent);color:var(--accent-text);border-color:var(--accent);}
.check-item .check-text{flex:1 1 auto;min-width:0;}
.check-item.checked .check-text{opacity:.5;text-decoration:line-through;}
.opt-detail{background:var(--panel2);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:12.5px;}
.opt-detail .macros{font-weight:700;color:var(--text);}

textarea.export-box{
  width:100%;min-height:140px;
  background:var(--panel2);color:var(--text);
  border:1px solid var(--border);border-radius:10px;
  padding:10px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}

.field{margin-bottom:12px;}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;}
.field input[type=number]{
  width:100%;min-height:48px;
  background:var(--panel2);color:var(--text);
  border:1px solid var(--border);border-radius:10px;
  padding:8px 12px;font-size:16px;
}

.toast{
  position:fixed;left:50%;bottom:calc(96px + var(--safe-b));
  transform:translateX(-50%);
  background:var(--accent);color:var(--accent-text);
  padding:10px 18px;border-radius:999px;
  font-size:13.5px;font-weight:700;
  box-shadow:0 4px 18px rgba(0,0,0,0.4);
  z-index:50;
  opacity:0;pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

.sparkline{width:100%;height:60px;display:block;}

hr.sep{border:none;border-top:1px solid var(--border);margin:14px 0;}
</style>
</head>

var WEEK_SCHEME = [

};

var ROTATION_SEQUENCE = ["A","B","C"];

/* ============================================================
   STORAGE
   ============================================================ */
var LS = {
  config: "pp_config_v1",
  workouts: "pp_workouts_v1",
  bodyweight: "pp_bodyweight_v1",
  rotation: "pp_rotation_index_v1",
  nutrition: "pp_nutrition_v1",
  restVersion: "pp_rest_version_v1",
  trainingAnalysis: "pp_training_analysis_v1",
  logDraft: "pp_log_draft_v1",
  maxes: "pp_maxes_v1",
  cycleWeek: "pp_cycle_week_v1",
  bikeRides: "pp_bike_rides_v1",
  bodyConfig: "pp_body_config_v1",
  weekMenu: "pp_week_menu_v1",
  cookDays: "pp_cook_days_v1",
  mesociclo: "pp_mesociclo_v1",
  partner: "pp_partner_v1",
  shoppingChecked: "pp_shopping_checked_v1",
  pasti: "pp_pasti_v1"
};

/* ============================================================
   FASI ALIMENTARI E TARGET
   La fase attiva (state.mesociclo) decide i target del giorno. Ogni punto dell'app
   (pasti, Consulta, testo per l'IA) li legge da computeMesocicloTargets().
   Le fasi si cambiano solo dal wizard "Fai il punto" (vedi più sotto).
   ============================================================ */
// Ricomposizione (fino al 2026-10-20): target fissi di dieta.md. Solo per la fase salvata, non più sceglibile.
var TARGETS = {
  allenamento: {kcal: 2250, prot: 150, carb: 250, grassi: 65, label:"Giorno di allenamento"},
  riposo:      {kcal: 1970, prot: 150, carb: 180, grassi: 65, label:"Giorno di riposo"}
};
// Dimagrimento dal 2026-10-20: totali del piano in PDF (piano di base × 0,8977, vedi roadmap.md).
var DIMAGRIMENTO_TARGETS = {
  allenamento: {kcal: 2138, prot: 135, carb: 265, grassi: 54, label:"Giorno di allenamento"},
  riposo:      {kcal: 1802, prot: 134, carb: 180, grassi: 55, label:"Giorno di riposo"}
};
// Totali giornalieri dei piani del nutrizionista (tabelle "TOT." dei PDF): danno la FORMA di ogni fase
// (rapporto tra giorno di allenamento e di riposo, proporzione dei macro). Il LIVELLO delle calorie
// viene dal mantenimento misurato di Marco (wizard). carb = carboidrati disponibili, fib = fibre (in kcal).
var PLANS = {
  base:     {riposo:{kcal:2007, carb:200.09, fib:30.11, prot:149.58, grassi:60.89}, allenamento:{kcal:2382, carb:295.41, fib:29.65, prot:150.52, grassi:59.93}},
  reverse1: {riposo:{kcal:2011, carb:224.39, fib:23.93, prot:138.06, grassi:57.01}, allenamento:{kcal:2312, carb:288.44, fib:30.21, prot:144.65, grassi:57.72}},
  reverse2: {riposo:{kcal:2142, carb:250.11, fib:25.17, prot:141.85, grassi:58.23}, allenamento:{kcal:2358, carb:296.89, fib:32.23, prot:147.20, grassi:57.43}},
  reverse3: {riposo:{kcal:2213, carb:265.51, fib:25.47, prot:143.47, grassi:58.45}, allenamento:{kcal:2513, carb:330.14, fib:33.67, prot:151.25, grassi:57.80}},
  bulk:     {riposo:{kcal:2353, carb:291.55, fib:30.38, prot:147.23, grassi:59.69}, allenamento:{kcal:2754, carb:380.71, fib:37.03, prot:156.38, grassi:59.02}},
  cut:      {riposo:{kcal:2174, carb:202.75, fib:32.66, prot:156.11, grassi:74.86}, allenamento:{kcal:2278, carb:277.96, fib:32.62, prot:144.94, grassi:57.90}}
};
var PLAN_LABELS = {base:"piano di base", reverse1:"piano reverse 1", reverse2:"piano reverse 2", reverse3:"piano reverse 3", bulk:"piano di massa", cut:"piano cut dopo la massa"};
// tipo: deficit (mantenimento − ritmo), mantenimento, reverse (+100 kcal a gradino), surplus (mantenimento + ritmo).
// durata: settimane di default (Invictus: deficit 4-8 sett. poi 1-2 al mantenimento; reverse +50-100 kcal ogni 1-2 sett.;
// massa a blocchi di 4-10 sett.). Valori scelti nel mezzo delle fasce, editabili.
var PHASES = {
  dimagrimento: {label:"Dimagrimento (da sovrappeso)", tipo:"deficit", piano:"base", durata:4},
  pausa:        {label:"Pausa al mantenimento", tipo:"mantenimento", piano:null, durata:2},
  reverse:      {label:"Reverse", tipo:"reverse", piano:null, durata:2},
  massa:        {label:"Massa", tipo:"surplus", piano:"bulk", durata:8},

};
var MESOCICLO_OBJ_LABELS = {dimagrimento:"Dimagrimento (da sovrappeso)", pausa:"Pausa al mantenimento", reverse:"Reverse", massa:"Massa", cut:"Cut (dopo la massa)", ricomposizione:"Ricomposizione"};
var MESOCICLO_DURATA_DEFAULT = {dimagrimento: 4, pausa: 2, reverse: 2, massa: 8, cut: 4, ricomposizione: 4};
// Ritmi (Piramide della nutrizione, Livello 1): deficit 0,5-1% del peso a settimana; massa per un intermedio
// 0,5-1,5% al mese. 7.700 kcal ≈ 1 kg (regola "3.500 kcal ≈ 1 lb").
var RITMI_DEFICIT = [0.005, 0.0075, 0.01];       // frazione del peso a settimana (default 0,5%: scelta pratica)
var RITMI_SURPLUS = [0.005, 0.01, 0.015];        // frazione del peso al mese (default 1%)
var KCAL_PER_KG = 7700;
var REVERSE_STEP_KCAL = 100;

function phaseLabel(m){
  m = m || state.mesociclo;
  var l = MESOCICLO_OBJ_LABELS[m.obiettivo] || m.obiettivo;
  if(m.obiettivo === "reverse" && m.reverseStep) l += " (gradino " + m.reverseStep + ")";
  return l;
}
function seduteSettimana(){
  var n = state.bodyConfig.sedute;
  return (n >= 0 && n <= 7) ? n : 2;
}
function computeMesocicloTargets(){
  var m = state.mesociclo;
  if(m.targets && m.targets.riposo && m.targets.allenamento) return m.targets;
  if(m.obiettivo === "ricomposizione") return TARGETS;
  return DIMAGRIMENTO_TARGETS;
}
// Media giornaliera della settimana con n sedute.
function weeklyAvgKcal(targets, n){
  return ((7 - n) * targets.riposo.kcal + n * targets.allenamento.kcal) / 7;
}
// Target di una fase dal livello medio settimanale T e dalla forma del piano: stesso rapporto
// allenamento/riposo e stessa proporzione dei macro del piano (si scalano tutti gli alimenti).
function buildTargets(planKey, T, n){
  var p = PLANS[planKey], r = p.allenamento.kcal / p.riposo.kcal;
  var rip = 7 * T / (7 - n + n * r);
  function scale(d, kcal, label){
    var f = kcal / d.kcal;
    return {kcal: Math.round(kcal), prot: Math.round(d.prot * f), carb: Math.round(d.carb * f), grassi: Math.round(d.grassi * f), label: label};
  }
  return {
    riposo: scale(p.riposo, rip, "Giorno di riposo"),

  };
}

// Uscite in bici: kcal/ora dalle "calorie attive" Garmin di uscite reali di Marco (già al netto
// del metabolismo basale). Gravel: media di 3 tratte (~305 kcal/h); Enduro/MTB: 1 uscita (~528 kcal/h).
var BIKE_RATES = {
  gravel: {label:"Gravel", kcalPerHour: 305},
  enduro: {label:"Enduro/MTB", kcalPerHour: 528}
};

// Target del giorno: base della fase (allenamento se quel giorno c'è una seduta, altrimenti riposo)
// più l'eventuale uscita in bici, con le kcal extra tutte in carboidrati (regola di dieta.md).
function computeTargetsForDate(date){
  var hasWorkout = state.workouts.some(function(w){ return w.date === date; });
  var baseKey = hasWorkout ? "allenamento" : "riposo";
  var base = computeMesocicloTargets()[baseKey];
  var ride = state.bikeRides.find(function(r){ return r.date === date; });
  if(!ride) return {kcal: base.kcal, prot: base.prot, carb: base.carb, grassi: base.grassi, label: base.label, baseKey: baseKey, ride: null};
  var rate = BIKE_RATES[ride.tipo];
  var extraKcal = rate ? Math.round(rate.kcalPerHour * ride.ore) : 0;
  var extraCarb = Math.round(extraKcal / 4);
  return {
    kcal: base.kcal + extraKcal,
    prot: base.prot,
    carb: base.carb + extraCarb,
    grassi: base.grassi,
    label: base.label + " + bici",
    baseKey: baseKey,
    ride: {tipo: ride.tipo, ore: ride.ore, extraKcal: extraKcal, extraCarb: extraCarb}
  };
}

// Massimale stimato (1RM) con Epley, peso × (1 + rip/30), dalla serie migliore mai registrata
// (Marco si allena vicino al cedimento, quindi le serie sono di fatto rep-max). Correggibile a mano.
function computeEstimatedMaxFromHistory(exId){
  var best = null;
  state.workouts.forEach(function(w){
    w.exercises.forEach(function(ex){
      if(ex.id !== exId) return;
      ex.sets.forEach(function(s){
        if(!s.reps || s.peso == null || s.peso <= 0) return;
        var epley = s.peso * (1 + s.reps/30);
        if(!best || epley > best.value){
          best = {value: Math.round(epley*10)/10, date: w.date, fromWeight: s.peso, fromReps: s.reps};
        }
      });
    });
  });
  return best;
}

      if(est){

})();

// Stima della massa grassa con il metodo a nastro US Navy (formula metrica, uomini). Margine
// tipico ±3-4 punti: va letta come trend nel tempo, non come valore assoluto.
function navyBodyFatMale(vitaCm, colloCm, altezzaCm){
  if(!vitaCm || !colloCm || !altezzaCm || vitaCm <= colloCm) return null;
  var bf = 495 / (1.0324 - 0.19077*Math.log10(vitaCm - colloCm) + 0.15456*Math.log10(altezzaCm)) - 450;
  if(!isFinite(bf) || bf <= 0 || bf >= 100) return null;
  return Math.round(bf * 10) / 10;
}

}

function kindLabel(kind){

/* ============================================================
   UTIL
   ============================================================ */
function fmtNum(n){
  n = Math.round(n * 100) / 100;
  return (n % 1 === 0) ? String(n) : String(n).replace(".", ",");
}
function todayISO(){
  return isoFromDate(new Date());
}
function isoFromDate(d){
  var m = String(d.getMonth()+1).padStart(2,"0");
  var day = String(d.getDate()).padStart(2,"0");
  return d.getFullYear()+"-"+m+"-"+day;
}
function fmtDateIt(iso){
  var parts = iso.split("-");
  return parts[2]+"/"+parts[1]+"/"+parts[0];
}
function addWeeksToDate(iso, weeks){
  var parts = iso.split("-").map(Number);
  var d = new Date(parts[0], parts[1]-1, parts[2]);
  d.setDate(d.getDate() + Math.round((weeks||0) * 7));
  return isoFromDate(d);
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

   LOGICA ROTAZIONE

function nextSchedaId(){

/* ============================================================
   LOGICA STORICO / SUGGERIMENTI
   ============================================================ */
// Sedute in ordine di data (a parità, di inserimento): le sedute retroattive non sono in ordine nell'array.
function sortedWorkoutsAsc(){
  return state.workouts.slice().sort(function(a,b){
    if(a.date !== b.date) return a.date < b.date ? -1 : 1;
    return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0);
  });
}

function lastPerformance(exId, excludeId){
  var list = sortedWorkoutsAsc();
  for(var i = list.length - 1; i >= 0; i--){
    var w = list[i];
    if(excludeId && w.id === excludeId) continue;
    for(var j = 0; j < w.exercises.length; j++){
      if(w.exercises[j].id === exId) return {workout:w, ex:w.exercises[j]};
    }
  }
  return null;
}

// Peso di lavoro di una seduta = il più frequente tra le serie (a parità il più alto), così un
// riscaldamento registrato per errore come prima serie non abbassa il riferimento.
function modeWeight(sets){
  if(!sets.length) return 0;
  var counts = {}, order = [];
  sets.forEach(function(s){
    var key = String(s.peso);
    if(!(key in counts)){ counts[key] = 0; order.push(key); }
    counts[key]++;
  });
  var best = null, bestCount = 0;
  order.forEach(function(key){
    var w = parseFloat(key);
    if(counts[key] > bestCount || (counts[key] === bestCount && (best === null || w > best))){
      best = w; bestCount = counts[key];
    }
  });
  return best;
}

// Settimana (1-5) del ciclo di ciascun principale: contatore indipendente, avanza a ogni seduta salvata.
function currentCycleWeek(exId){
  return (state.cycleWeek && state.cycleWeek[exId]) || 1;
}
function weekSchemeFor(exId){
  return WEEK_SCHEME[currentCycleWeek(exId) - 1];
}
// Serie di oggi: per i principali dipendono dalla settimana del ciclo, per gli altri sono fisse.
function setsCountFor(exId){
  var cfg = state.exercises[exId];
  if(cfg.kind === "principal") return weekSchemeFor(exId).sets;
  return cfg.defSets;
}

// Seduta di scarico: un principale della scheda è alla settimana 5. Gli altri esercizi fanno metà serie
// (per eccesso, 3 → 2) con gli stessi carichi (programma.md; arrotondamento = scelta pratica).
function isDeloadSession(exIds){
  return exIds.some(function(id){
    var c = state.exercises[id];
    return c && c.kind === "principal" && weekSchemeFor(id).deload;
  });
}
function deloadSetsCount(n){ return Math.max(1, Math.ceil(n / 2)); }

// Riscaldamento a scalare (50/70/85% del peso di lavoro), senza step che arrotondano allo stesso peso.
function warmupPlan(exId, workingWeight){
  var cfg = state.exercises[exId];
  if(!workingWeight || workingWeight <= 0) return null;
  var steps = [{pct:0.5, reps:8}, {pct:0.7, reps:4}, {pct:0.85, reps:2}];
  var out = [];
  steps.forEach(function(s){
    var w = Math.round((workingWeight * s.pct) / cfg.inc) * cfg.inc;
    if(w < 0) w = 0;
    if(out.length && out[out.length-1].weight === w) return;
    out.push({weight: w, reps: s.reps});
  });
  return out;
}

// Ritorna {weight, targetLo, targetHi, sets, note, hasHistory}
function suggestFor(exId, setsCount, excludeId, deload){
  var cfg = state.exercises[exId];
  var perf = lastPerformance(exId, excludeId);
  var startWeight = 0;
  if(!perf){
    return {
      weight: startWeight,
      reps: new Array(setsCount).fill(cfg.lo),
      note: "Prima volta: parti leggero e trova il carico.",
      noteType:"hold"
    };
  }
  var lastSets = perf.ex.sets;
  var lastWeight = lastSets.length ? modeWeight(lastSets) : startWeight;
  var allAtTop = lastSets.length > 0 && lastSets.every(function(s){ return s.reps >= cfg.hi; });

  var newWeight = lastWeight;
  var repsGuess;
  var note, noteType;

  if(cfg.kind === "principal"){
    var week = currentCycleWeek(exId);
    var scheme = weekSchemeFor(exId);
    var maxInfo = state.maxes[exId];
    if(maxInfo && maxInfo.value){
      var rawW = maxInfo.value * scheme.pct;
      newWeight = Math.round(rawW / cfg.inc) * cfg.inc;
      if(newWeight < 0) newWeight = 0;
      note = "Settimana " + week + "/5" + (scheme.deload ? " (scarico)" : "") + " — " +
             scheme.sets + "x" + scheme.reps + " @" + Math.round(scheme.pct*100) + "% ≈ " +
             fmtNum(newWeight) + " kg · RPE " + scheme.rpe;
      noteType = scheme.deload ? "hold" : "up";
      repsGuess = new Array(setsCount).fill(scheme.reps);
    } else if(allAtTop){
      newWeight = lastWeight + cfg.inc;
      note = "Settimana " + week + "/5 — " + scheme.sets + "x" + scheme.reps +
             ". Nessun massimale stimato (impostalo in Impostazioni): sali a " + fmtNum(newWeight) + " kg";
      noteType = "up";
      repsGuess = new Array(setsCount).fill(scheme.reps);
    } else {
      note = "Settimana " + week + "/5 — " + scheme.sets + "x" + scheme.reps +
             ". Nessun massimale stimato (impostalo in Impostazioni): ripeti " + fmtNum(lastWeight) + " kg";
      noteType = "hold";
      repsGuess = new Array(setsCount).fill(scheme.reps);
    }
  } else {
    if(deload){
      note = "Scarico: " + setsCount + " serie invece di " + cfg.defSets + ", stesso carico dell'ultima volta (" + fmtNum(lastWeight) + " " + cfg.unit + "), senza cercare di salire";
      noteType = "hold";
      repsGuess = lastSets.map(function(s){ return s.reps; });
    } else if(allAtTop){
      newWeight = lastWeight + cfg.inc;
      note = "Top range raggiunto: sali a " + fmtNum(newWeight) + " kg, riparti da " + cfg.lo;
      noteType = "up";
      repsGuess = new Array(setsCount).fill(cfg.lo);
    } else {
      note = "Ripeti " + fmtNum(lastWeight) + " kg, punta a " + cfg.hi;
      noteType = "hold";
      repsGuess = lastSets.map(function(s){ return s.reps; });
    }
  }
  while(repsGuess.length < setsCount) repsGuess.push(cfg.lo);
  repsGuess = repsGuess.slice(0, setsCount);

  return {
    weight: newWeight,
    reps: repsGuess,
    note: note,
    noteType: noteType,
    lastText: lastSets.map(function(s){ return fmtNum(s.peso)+"x"+s.reps; }).join(", "),
    lastDate: perf.workout.date
  };
}

/* ============================================================
   STATO SESSIONE DI LOG IN CORSO (non persistito finché non salvo)
   ============================================================ */
var logSession = null; // {schedaId, variant, date, editId, exIds, sets: {exId: [{peso,reps,done}, ...]}}
// Ripristino automatico della seduta in corso dopo una chiusura o un crash.
logSession = loadJSON(LS.logDraft, null);
// Bozze salvate da versioni precedenti: aggiunge i campi mancanti (non tocca lo storico).
if(logSession){
  if(!logSession.exNotes) logSession.exNotes = {};
  if(!logSession.feedback) logSession.feedback = {};
  if(logSession.closing === undefined) logSession.closing = false;
}

function startLog(schedaId, variant){
  var scheda = SCHEDE[schedaId];
  var exIds = scheda.exercises.slice();
  if(schedaId === "B" && variant){
    exIds = exIds.filter(function(id){ return id !== "squat"; });
  }
  var sets = {};
  var deload = isDeloadSession(exIds);
  exIds.forEach(function(exId){
    var cfg = state.exercises[exId];
    var setsCount = setsCountFor(exId);
    if(schedaId === "B" && variant && exId === "leg_press") setsCount = 4;
    if(deload && cfg.kind !== "principal") setsCount = deloadSetsCount(setsCount);
    var sug = suggestFor(exId, setsCount, null, deload);
    var arr = [];
    for(var i=0;i<setsCount;i++){
      arr.push({peso: sug.weight, reps: (sug.reps[i] !== undefined ? sug.reps[i] : cfg.lo), stato: null});
    }
    sets[exId] = arr;
  });
  logSession = {schedaId: schedaId, variant: !!variant, date: todayISO(), editId: null, exIds: exIds, sets: sets, closing: false, exNotes: {}, feedback: {}, deload: deload};
  persistLogDraft();
  showTab("oggi");
}

// Riapre una seduta salvata per correggerla; i campi che le sedute vecchie non hanno restano vuoti.
function editSession(id){
  var w = state.workouts.find(function(x){ return x.id === id; });
  if(!w) return;
  var exIds = w.exercises.map(function(e){ return e.id; });
  var sets = {};
  var exNotes = {};
  w.exercises.forEach(function(e){
    sets[e.id] = e.sets.map(function(s){ return {peso:s.peso, reps:s.reps, stato: s.stato || null}; });
    if(e.nota) exNotes[e.id] = e.nota;
  });
  logSession = {schedaId: w.scheda, variant: !!w.variant, date: w.date, editId: w.id, exIds: exIds, sets: sets, closing: false, exNotes: exNotes, feedback: w.feedback ? Object.assign({}, w.feedback) : {}};
  persistLogDraft();
  showTab("oggi");
}

function cancelLog(){
  logSession = null;
  persistLogDraft(); // rimuove la bozza salvata, altrimenti riapparirebbe al prossimo avvio
  render();
}

// "Salva": conferma visiva, la bozza è già salvata a ogni modifica.
function saveLogDraftManual(){
  if(!logSession) return;
  persistLogDraft();
  toast("Progresso salvato ✓");
}

// Mini-feedback di fine seduta: tutto facoltativo, solo registrato, non cambia piano o carichi.
var FEEDBACK_FIELDS = ["esito","energia","difficolta","recupero","dolore","doloreZona","doloreZonaAltro","aderenza","nota"];
function cleanFeedback(fb){
  if(!fb) return undefined;
  var out = {};
  FEEDBACK_FIELDS.forEach(function(k){
    var v = fb[k];
    if(v !== undefined && v !== null && v !== "") out[k] = v;
  });
  return Object.keys(out).length ? out : undefined;
}

function saveLog(){
  if(!logSession) return;
  var exercisesOut = logSession.exIds.map(function(exId){
    var out = {id: exId, sets: logSession.sets[exId].map(function(s){
      var so = {peso:s.peso, reps:s.reps};
      if(s.stato) so.stato = s.stato; // COMPLETATO/PARZIALE/SALTATO, facoltativo — assente se mai toccato
      return so;
    })};
    var nota = ((logSession.exNotes && logSession.exNotes[exId]) || "").trim();
    if(nota) out.nota = nota;
    return out;
  });
  var fb = cleanFeedback(logSession.feedback);
  if(logSession.editId){
    var idx = state.workouts.findIndex(function(w){ return w.id === logSession.editId; });
    if(idx > -1){
      // In modifica la settimana del ciclo resta quella salvata e il contatore non avanza.
      var orig = state.workouts[idx];
      exercisesOut.forEach(function(exo){
        var oe = (orig.exercises || []).find(function(x){ return x.id === exo.id; });
        if(oe && oe.cycleWeek) exo.cycleWeek = oe.cycleWeek;
      });
      var updated = {
        id: logSession.editId,
        date: logSession.date || todayISO(),
        scheda: logSession.schedaId,
        variant: logSession.variant,
        exercises: exercisesOut
      };
      if(fb) updated.feedback = fb;
      state.workouts[idx] = updated;
    }
    persistAll();
    logSession = null;
    persistLogDraft();
    toast("Seduta aggiornata ✓");
    render();
    return;
  }
  var workout = {
    id: uid(),
    date: logSession.date || todayISO(),
    scheda: logSession.schedaId,
    variant: logSession.variant,
    exercises: exercisesOut
  };
  if(fb) workout.feedback = fb;
  state.workouts.push(workout);
  advanceRotation();
  // Avanza il contatore del ciclo di ogni principale svolto.
  exercisesOut.forEach(function(exo){
    var cfgEx = state.exercises[exo.id];
    if(cfgEx && cfgEx.kind === "principal"){
      var w = currentCycleWeek(exo.id);
      exo.cycleWeek = w; // settimana in cui è stata fatta questa seduta (campo facoltativo, additivo)
      state.cycleWeek[exo.id] = (w >= 5) ? 1 : (w + 1);
    }
  });
  persistAll();
  logSession = null;
  persistLogDraft();
  toast("Seduta salvata ✓");
  render();
}

function stepSet(exId, idx, field, delta){
  var s = logSession.sets[exId][idx];
  if(field === "peso"){
    var cfg = state.exercises[exId];
    s.peso = Math.max(0, Math.round((s.peso + delta * cfg.inc) * 100) / 100);
  } else {
    s.reps = Math.max(0, s.reps + delta);
  }
  persistLogDraft();
  render();
}

function setVal(exId, idx, field, raw){
  var s = logSession.sets[exId][idx];
  var v = parseFloat(String(raw).replace(",", "."));
  if(isNaN(v) || v < 0) v = 0;
  s[field] = (field === "peso") ? (Math.round(v*100)/100) : Math.round(v);
  persistLogDraft();
  render();
}

// Ciclo a 4 stati (tocco singolo): non specificato → Completato → Parziale → Saltato → non specificato.
var STATO_CYCLE = [null, "COMPLETATO", "PARZIALE", "SALTATO"];
function cycleSetStato(exId, idx){
  var s = logSession.sets[exId][idx];
  var cur = STATO_CYCLE.indexOf(s.stato || null);
  s.stato = STATO_CYCLE[(cur + 1) % STATO_CYCLE.length];
  persistLogDraft();
  render();
}

// Passaggio tra serie e mini-feedback di chiusura (la seduta si registra solo al salvataggio finale).
function startCloseSession(){
  if(!logSession) return;
  logSession.closing = true;
  if(!logSession.feedback) logSession.feedback = {};
  persistLogDraft();
  render();
}
function backToSets(){
  if(!logSession) return;
  logSession.closing = false;
  persistLogDraft();
  render();
}
function setFeedbackField(field, value){
  if(!logSession) return;
  if(!logSession.feedback) logSession.feedback = {};
  logSession.feedback[field] = value;
  if(field === "dolore" && value === "NESSUNO"){
    delete logSession.feedback.doloreZona;
    delete logSession.feedback.doloreZonaAltro;
  }
  persistLogDraft();
  render();
}

function sevenDayAvg(){
  if(!state.bodyweight.length) return null;
  var sorted = state.bodyweight.slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; });
  var last7 = sorted.slice(0,7);
  var sum = last7.reduce(function(a,b){ return a+b.peso; }, 0);
  return sum / last7.length;

function rowsToCSVText(rows){
  return rows.map(function(r){
    return r.map(function(v){
      v = String(v);
      if(v.indexOf(",")>-1 || v.indexOf('"')>-1){ v = '"'+v.replace(/"/g,'""')+'"'; }
      return v;
    }).join(",");
  }).join("\n");
}

function toCSV(){
  var rows = [["=== SEDUTE ==="],["data","scheda","variante","esercizio","serie","peso","ripetizioni"]];
  state.workouts.forEach(function(w){
    w.exercises.forEach(function(ex){
      var cfg = state.exercises[ex.id] || {name: ex.id};
      ex.sets.forEach(function(s, idx){
        rows.push([w.date, w.scheda, w.variant?"si":"no", cfg.name, String(idx+1), fmtNum(s.peso), String(s.reps)]);
      });
    });
  });

  rows.push([]);
  rows.push(["=== PESO CORPOREO ==="]);
  rows.push(["data","peso_kg","vita_cm","collo_cm","grasso_percento"]);
  state.bodyweight.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; }).forEach(function(b){
    rows.push([b.date, fmtNum(b.peso), b.vita!=null?fmtNum(b.vita):"", b.collo!=null?fmtNum(b.collo):"", b.bf!=null?fmtNum(b.bf):""]);
  });

  rows.push([]);
  rows.push(["=== ALIMENTAZIONE ==="]);
  rows.push(["data","pasto","testo","kcal","proteine_g","carbo_g","grassi_g"]);
  state.nutrition.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; }).forEach(function(n){
    rows.push([n.date, n.mealType||"Pasto", n.text, hasMacro(n)?fmtNum(n.kcal):"", hasMacro(n)?fmtNum(n.prot):"", hasMacro(n)?fmtNum(n.carb):"", hasMacro(n)?fmtNum(n.fat):""]);
  });

  return rowsToCSVText(rows);
}

function doExport(format){
  var content = format === "csv" ? toCSV() : toJSON();
  var filename = "trainer-registro-"+todayISO()+"."+format;
  var mime = format === "csv" ? "text/csv" : "application/json";

  var box = document.getElementById("exportBox");

  function showFallback(){
    var h = '<div class="field" style="margin-top:12px;">';
    h += '<label>Contenuto '+format.toUpperCase()+' (copia da qui se la condivisione non funziona)</label>';
    h += '<textarea class="export-box" readonly id="exportTextarea">'+content.replace(/</g,"&lt;")+'</textarea>';
    h += '<button class="btn small" style="margin-top:8px;" data-act="copy-export">Copia negli appunti</button>';
    h += '</div>';
    if(box) box.innerHTML = h;
  }

  if(navigator.share && navigator.canShare){
    try{
      var file = new File([content], filename, {type: mime});
      if(navigator.canShare({files:[file]})){
        navigator.share({files:[file], title: filename}).catch(function(){ showFallback(); });
        return;
      }
    }catch(e){}
  }

  try{
    var blob = new Blob([content], {type: mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }catch(e){}

  showFallback();
}

function renderSparkline(){
  var sorted = state.bodyweight.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; }).slice(-14);
  if(sorted.length < 2) return '<p class="muted small">Servono più pesate.</p>';
  var vals = sorted.map(function(b){ return b.peso; });
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  var range = (max - min) || 1;
  var w = 300, h = 56, pad = 4;
  var pts = vals.map(function(v, i){
    var x = pad + (i/(vals.length-1)) * (w - pad*2);
    var y = h - pad - ((v - min)/range) * (h - pad*2);
    return x.toFixed(1)+","+y.toFixed(1);
  }).join(" ");
  return '<svg class="sparkline" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
    '<polyline points="'+pts+'" fill="none" stroke="#4fd18f" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
    '</svg>';
}

var MEAL_SHARE = {
  riposo:      {colazione:{k:.248,p:.300}, mattina:{k:.103,p:.135}, pranzo:{k:.239,p:.211}, pomeriggio:{k:.103,p:.135}, cena:{k:.307,p:.219}},
  allenamento: {colazione:{k:.220,p:.301}, mattina:{k:.085,p:.133}, pranzo:{k:.253,p:.216}, pomeriggio:{k:.129,p:.112}, cena:{k:.314,p:.238}}
};
var mealDate = null; // giorno mostrato nella card Pasti (null = oggi)

function pastoOf(date, k){
  return state.pasti.find(function(x){ return x.date === date && x.pasto === k; }) || null;
}
// Un tocco segna, lo stesso tocco di nuovo toglie.
function setPasto(date, k, esito, fonte){
  var cur = pastoOf(date, k);
  state.pasti = state.pasti.filter(function(x){ return !(x.date === date && x.pasto === k); });
  if(!(cur && cur.esito === esito && (cur.fonte || null) === (fonte || null))){
    var e = {date: date, pasto: k, esito: esito};
    if(fonte) e.fonte = fonte;
    if(cur && cur.nota && esito === "libero") e.nota = cur.nota;
    state.pasti.push(e);
  }
  persistAll();
}
// Calorie e proteine mangiate in un giorno secondo i pasti segnati: target del giorno meno i pasti saltati.
// Il pasto libero conta come da piano (il piano ne prevede uno a settimana). Giorni senza pasti segnati: come da piano.
function dayIntake(date){
  var t = computeTargetsForDate(date);
  var base = computeMesocicloTargets()[t.baseKey];
  var sh = MEAL_SHARE[t.baseKey];
  var kcal = t.kcal, prot = t.prot, segnati = 0, saltati = 0, liberi = 0, piano = 0;
  PASTI.forEach(function(p){
    var e = pastoOf(date, p.k);
    if(!e) return;
    segnati++;
    if(e.esito === "saltato"){ saltati++; kcal -= sh[p.k].k * base.kcal; prot -= sh[p.k].p * base.prot; }
    else if(e.esito === "libero") liberi++;
    else piano++;
  });
  return {kcal: kcal, prot: prot, target: t, segnati: segnati, saltati: saltati, liberi: liberi, piano: piano};
}
function weekStartISO(iso){
  var p = iso.split("-").map(Number), d = new Date(p[0], p[1]-1, p[2]);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return isoFromDate(d);
}
function addDaysISO(iso, n){
  var p = iso.split("-").map(Number), d = new Date(p[0], p[1]-1, p[2]);
  d.setDate(d.getDate() + n);
  return isoFromDate(d);
}
function daysBetween(a, b){
  var pa = a.split("-").map(Number), pb = b.split("-").map(Number);
  return Math.round((new Date(pb[0], pb[1]-1, pb[2]) - new Date(pa[0], pa[1]-1, pa[2])) / 86400000);
}
// Riepilogo dei pasti fra due date incluse (solo giorni fino a oggi).
function mealsSummary(from, to){
  var r = {giorni:0, giorniSegnati:0, segnati:0, piano:0, liberi:0, saltati:0, fonti:{}, prot:0, protTarget:0};
  for(var d = from; d <= to && d <= todayISO(); d = addDaysISO(d, 1)){
    var di = dayIntake(d);
    r.giorni++;
    if(di.segnati){ r.giorniSegnati++; r.prot += di.prot; r.protTarget += di.target.prot; }
    r.segnati += di.segnati; r.piano += di.piano; r.liberi += di.liberi; r.saltati += di.saltati;
    ["pranzo","cena"].forEach(function(k){
      var e = pastoOf(d, k);
      if(e && e.esito === "piano" && e.fonte) r.fonti[e.fonte] = (r.fonti[e.fonte] || 0) + 1;
    });
  }
  return r;
}

    }

  if(!r.segnati){

  } else {
    html += '<div class="grid2" style="margin-top:10px;">';

    html += '<div class="stat"><div class="num">'+r.liberi+'/1</div><div class="label">pasti liberi (il piano ne prevede 1)</div></div>';
    html += '<div class="stat"><div class="num">'+r.saltati+'</div><div class="label">pasti saltati</div></div>';
    html += '<div class="stat"><div class="num">'+(r.giorniSegnati ? Math.round(r.prot / r.giorniSegnati) : "—")+' g</div><div class="label">proteine medie stimate (target '+(r.giorniSegnati ? Math.round(r.protTarget / r.giorniSegnati) : "—")+' g)</div></div>';
    html += '</div>';
    html += '<table style="margin-top:10px;"><thead><tr><th>Fonte a pranzo e cena</th><th>Volte</th><th>Consigliato</th></tr></thead><tbody>';
    FONTI.forEach(function(f){
      html += '<tr><td>'+f.label+'</td><td>'+(r.fonti[f.k] || 0)+'</td><td>'+(FREQ_CONSIGLIATE[f.k] || "—")+'</td></tr>';
    });
    html += '</tbody></table>';
    html += '<div class="muted small" style="margin-top:6px;">Proteine stimate: target del giorno meno i pasti saltati (quota di ogni pasto dal piano). Frequenze consigliate dalle note del piano.</div>';
  }
  html += '</div>';
  return html;
}

/* ============================================================
   WIZARD "FAI IL PUNTO": bilancio della fase, mantenimento misurato, nuova fase
   Metodo in wizard-fasi.md: livello delle calorie dal mantenimento misurato di Marco
   (Piramide della nutrizione; Project Nutrition), forma dai piani del nutrizionista.
   ============================================================ */
var wiz = null; // stato del wizard aperto (non salvato finché non si conferma)

function bodyweightAvg(from, to){
  var v = state.bodyweight.filter(function(b){ return b.date >= from && b.date <= to; });
  if(!v.length) return {n:0, avg:null};
  return {n: v.length, avg: v.reduce(function(a, b){ return a + b.peso; }, 0) / v.length};
}
// Settimane complete della fase, a blocchi di 7 giorni dalla data di inizio.
function phaseWeeks(){
  var start = state.mesociclo.dataInizio || todayISO(), out = [];
  for(var i = 0; ; i++){
    var a = addDaysISO(start, i*7), b = addDaysISO(start, i*7 + 6);
    if(b >= todayISO()) break;
    var w = bodyweightAvg(a, b);
    out.push({i: i, from: a, to: b, n: w.n, avg: w.avg});
  }
  return out;
}
// Mantenimento ≈ calorie mangiate + calo settimanale × 7.700 ÷ 7, dalla 2ª settimana all'ultima completa
// (la 1ª si scarta: acqua e glicogeno). Servono 3 settimane complete e almeno 4 pesate nelle due confrontate.
function estimateMaintenance(){
  var weeks = phaseWeeks();
  var res = {ok:false, weeks: weeks};
  if(weeks.length < 3){ res.motivo = "servono almeno 3 settimane complete di fase (finora " + weeks.length + ")"; return res; }
  var w2 = weeks[1], wl = weeks[weeks.length - 1];
  if(w2.n < 4 || wl.n < 4){ res.motivo = "servono almeno 4 pesate nella 2ª settimana e nell'ultima (ora " + w2.n + " e " + wl.n + ")"; return res; }
  var nW = wl.i - w2.i;
  var rate = (wl.avg - w2.avg) / nW; // kg a settimana (negativo = calo)
  var sumK = 0, days = 0, nonSegnati = 0;
  for(var d = w2.from; d <= wl.to; d = addDaysISO(d, 1)){
    var di = dayIntake(d);
    sumK += di.kcal; days++;
    if(!di.segnati) nonSegnati++;
  }
  var troppiLiberi = 0;
  for(var k = w2.i; k <= wl.i; k++){
    var ms = mealsSummary(weeks[k].from, weeks[k].to);
    if(ms.liberi > 1) troppiLiberi++;
  }
  var intake = sumK / days;
  res.ok = true;
  res.rate = rate;
  res.ratePct = rate / w2.avg;
  res.intake = intake;
  res.mant = Math.round(intake - rate * KCAL_PER_KG / 7);
  res.giorni = days;
  res.nonSegnati = nonSegnati;
  res.troppiLiberi = troppiLiberi;
  res.w2 = w2; res.wl = wl;
  return res;
}
function vitaAt(fromDate, last){
  var v = state.bodyweight.filter(function(b){ return b.vita && b.date >= fromDate; }).sort(function(a, b){ return a.date < b.date ? -1 : 1; });
  if(!v.length) return null;
  return last ? v[v.length - 1] : v[0];
}
function sedutePhase(){
  var start = state.mesociclo.dataInizio || todayISO();
  return state.workouts.filter(function(w){ return w.date >= start; }).length;
}
function currentRitmo(){
  var m = state.mesociclo, ph = PHASES[m.obiettivo];
  if(m.ritmo) return m.ritmo;
  if(ph && ph.tipo === "deficit") return RITMI_DEFICIT[0];
  if(ph && ph.tipo === "surplus") return RITMI_SURPLUS[1];
  return null;
}
// Fase evidenziata come passo successivo (sequenza dei piani del nutrizionista + pausa di Invictus dopo 4-8 settimane di deficit).
function suggestedNext(){
  var m = state.mesociclo, days = daysBetween(m.dataInizio || todayISO(), todayISO());
  if(m.obiettivo === "dimagrimento" || m.obiettivo === "cut") return days >= 28 ? "pausa" : "continua";
  if(m.obiettivo === "reverse") return (m.reverseStep || 1) >= 3 ? "massa" : "reverse";
  if(m.obiettivo === "massa") return "cut";
  if(m.obiettivo === "ricomposizione") return "dimagrimento";
  return null;
}
function wizOpen(){
  var est = estimateMaintenance();
  var avg7 = sevenDayAvg();
  wiz = {step: 1, est: est, mant: est.ok ? est.mant : (state.mesociclo.mantenimento ? state.mesociclo.mantenimento.kcal : null),
         scelta: null, ritmo: null, peso: avg7 ? Math.round(avg7 * 10) / 10 : null, durata: null, aiText: null};
  showTab("mealprep");
}
// Calcola la proposta per la scelta corrente: {ok, targets, T, piano, obiettivo, reverseStep, ritmo, durata, avvisi[], motivo}
function wizProposal(){
  var m = state.mesociclo, n = seduteSettimana(), cur = computeMesocicloTargets();
  var curT = weeklyAvgKcal(cur, n), sc = wiz.scelta, out = {avvisi: []};
  var peso = wiz.peso, M = wiz.mant;
  var curPlan = m.piano || "base";
  if(!sc) return {ok:false, motivo:"scegli cosa fare"};
  if(sc === "continua"){
    out.obiettivo = m.obiettivo; out.piano = curPlan; out.T = curT; out.ritmo = m.ritmo || null; out.reverseStep = m.reverseStep;
    out.targets = {riposo: cur.riposo, allenamento: cur.allenamento};
    out.fattore = PLANS[curPlan] ? cur.riposo.kcal / PLANS[curPlan].riposo.kcal : null;
  } else if(sc === "aggiusta"){
    var e = wiz.est, ritmo = currentRitmo(), ph = PHASES[m.obiettivo];
    if(!e.ok) return {ok:false, motivo:"per aggiustare serve il ritmo misurato: " + e.motivo};
    if(!ritmo || !ph) return {ok:false, motivo:"questa fase non ha un ritmo di riferimento"};
    var atteso = ph.tipo === "deficit" ? -ritmo * e.w2.avg : ritmo * e.w2.avg / 4.33; // kg a settimana
    var adj = -(e.rate - atteso) * KCAL_PER_KG / 7;
    if(Math.abs(adj) < 100) return {ok:false, motivo:"il ritmo reale ("+fmtNum(Math.round(e.rate*100)/100)+" kg/sett.) è in linea con quello previsto ("+fmtNum(Math.round(atteso*100)/100)+" kg/sett.): nessun aggiustamento"};
    adj = Math.max(-200, Math.min(200, adj));
    adj = Math.round(adj / 10) * 10;
    out.obiettivo = m.obiettivo; out.piano = curPlan; out.ritmo = m.ritmo || ritmo; out.reverseStep = m.reverseStep;
    out.T = curT + adj; out.adj = adj;
  } else if(sc === "reverse"){
    var step = m.obiettivo === "reverse" ? Math.min((m.reverseStep || 1) + 1, 3) : 1;
    out.obiettivo = "reverse"; out.reverseStep = step; out.piano = "reverse" + step; out.T = curT + REVERSE_STEP_KCAL;
  } else {
    var phx = PHASES[sc];
    if(!M) return {ok:false, motivo:"serve il mantenimento (stimato o inserito al passo 1)"};
    out.obiettivo = sc;
    out.piano = phx.piano || curPlan;
    if(phx.tipo === "mantenimento") out.T = M;
    if(phx.tipo === "deficit"){
      out.ritmo = wiz.ritmo || RITMI_DEFICIT[0];
      if(!peso) return {ok:false, motivo:"serve il peso medio"};
      var def = out.ritmo * peso * KCAL_PER_KG / 7;
      out.T = M - def;
      out.deficit = def;
      if(def > 500) out.avvisi.push("Deficit di " + Math.round(def) + " kcal/die: oltre circa 500 la perdita di massa magra cresce (Piramide, Murphy & Koehler 2022).");
      var pct = def / M;
      if(pct > 0.20) out.avvisi.push("Deficit pari al " + Math.round(pct*100) + "% del mantenimento, sopra la fascia 10-20% di Project Invictus.");
    }
    if(phx.tipo === "surplus"){
      out.ritmo = wiz.ritmo || RITMI_SURPLUS[1];
      if(!peso) return {ok:false, motivo:"serve il peso medio"};
      out.surplus = out.ritmo * peso / 4.33 * KCAL_PER_KG / 7;
      out.T = M + out.surplus;
    }
  }
  if(!out.targets){
    var bt = buildTargets(out.piano, out.T, n);
    out.targets = {riposo: bt.riposo, allenamento: bt.allenamento};
    out.fattore = bt.fattore;
  }
  if(peso && out.targets.riposo.prot / peso < 1.6) out.avvisi.push("Proteine " + fmtNum(Math.round(out.targets.riposo.prot / peso * 10) / 10) + " g/kg nel giorno di riposo: sotto il minimo di 1,6 g/kg della Piramide.");
  if(M) out.pctMant = out.T / M;
  out.durata = wiz.durata || (sc === "continua" || sc === "aggiusta" ? (m.durataSettimane || 4) : (MESOCICLO_DURATA_DEFAULT[out.obiettivo] || 4));
  out.ok = true;
  return out;
}
function wizConfirm(){
  var p = wizProposal();
  if(!p.ok) return;
  var old = JSON.parse(JSON.stringify(state.mesociclo));
  var storico = old.storico || [];
  delete old.storico;
  old.chiusura = {data: todayISO(), stima: wiz.est.ok ? {mant: wiz.est.mant, rate: wiz.est.rate, intake: Math.round(wiz.est.intake)} : {motivo: wiz.est.motivo}, mantenimentoUsato: wiz.mant || null, scelta: wiz.scelta};
  if(wiz.aiRisposta) old.chiusura.analisiIA = wiz.aiRisposta;
  if(wiz.aiText) old.chiusura.testoIA = wiz.aiText;
  storico.push(old);
  var stessaFase = (wiz.scelta === "continua" || wiz.scelta === "aggiusta");
  var vita = vitaAt("0000-00-00", true);
  state.mesociclo = {
    obiettivo: p.obiettivo, piano: p.piano, dataInizio: todayISO(), durataSettimane: p.durata,
    targets: p.targets, ritmo: p.ritmo || null, sedute: seduteSettimana(),
    pesoInizio: wiz.peso || null, vitaInizio: vita ? vita.vita : null,
    mantenimento: wiz.mant ? {kcal: wiz.mant, data: todayISO(), stimato: !!(wiz.est.ok && wiz.mant === wiz.est.mant)} : (old.mantenimento || null),
    versione: stessaFase ? (old.versione || 1) + 1 : 1,
    fattorePdf: p.fattore ? Math.round(p.fattore * 10000) / 10000 : null,
    pianoPdfMigrato: true, storico: storico
  };
  if(p.reverseStep) state.mesociclo.reverseStep = p.reverseStep;
  persistAll();
  wiz = null;
  toast("Fase confermata ✓");
  render();
}
function wizUndo(){
  var m = state.mesociclo;
  if(!m.storico || !m.storico.length) return;
  var storico = m.storico.slice(), prev = storico.pop();
  delete prev.chiusura;
  prev.storico = storico;
  state.mesociclo = prev;
  persistAll();
  toast("Ultima conferma annullata ✓");
  render();
}
// Testo per l'IA: autosufficiente, nessun nome di persona.
function buildPhaseAIText(){
  var m = state.mesociclo, t = computeMesocicloTargets(), n = seduteSettimana(), e = wiz ? wiz.est : estimateMaintenance();
  var L = [];
  L.push("Bilancio della fase alimentare — " + phaseLabel() + " (versione " + (m.versione || 1) + "), dal " + fmtDateIt(m.dataInizio) + ", " + daysBetween(m.dataInizio, todayISO()) + " giorni su " + (m.durataSettimane || 4) + " settimane previste.");
  L.push("Uomo, " + state.bodyConfig.altezza + " cm, " + state.bodyConfig.eta + " anni, " + n + " sedute di pesi a settimana (schede A/B/C, progressione lineare) più uscite in bici.");
  L.push("Target: giorno di riposo " + t.riposo.kcal + " kcal (P " + t.riposo.prot + " g, C " + t.riposo.carb + " g, G " + t.riposo.grassi + " g); giorno di allenamento " + t.allenamento.kcal + " kcal (P " + t.allenamento.prot + " g, C " + t.allenamento.carb + " g, G " + t.allenamento.grassi + " g). Le kcal includono le fibre. Forma dal " + (PLAN_LABELS[m.piano] || "piano di base") + " di un nutrizionista sportivo, livello riparametrato su di me.");
  if(m.ritmo) L.push("Ritmo previsto: " + fmtNum(m.ritmo * 100) + "% del peso " + (PHASES[m.obiettivo] && PHASES[m.obiettivo].tipo === "surplus" ? "al mese" : "a settimana") + ".");
  L.push("");
  L.push("Peso, medie a blocchi di 7 giorni dall'inizio della fase:");
  var ws = phaseWeeks();
  if(!ws.length) L.push("- nessuna settimana completa");
  ws.forEach(function(w){ L.push("- settimana " + (w.i + 1) + " (" + fmtDateIt(w.from) + "–" + fmtDateIt(w.to) + "): " + (w.avg ? fmtNum(Math.round(w.avg * 10) / 10) + " kg, " + w.n + " pesate" : "nessuna pesata")); });
  var v0 = vitaAt(m.dataInizio, false), v1 = vitaAt(m.dataInizio, true);
  if(v0) L.push("Vita: " + fmtNum(v0.vita) + " cm il " + fmtDateIt(v0.date) + (v1 && v1.date !== v0.date ? ", " + fmtNum(v1.vita) + " cm il " + fmtDateIt(v1.date) : "") + (v1 && v1.bf != null ? "; massa grassa stimata (metodo a nastro) " + fmtNum(v1.bf) + "%" : "") + ".");
  else L.push("Vita: nessuna misura nella fase.");
  L.push("");
  L.push("Pasti segnati per settimana:");
  ws.concat([{i: ws.length, from: addDaysISO(m.dataInizio, ws.length * 7), to: todayISO(), parziale: true}]).forEach(function(w){
    if(w.from > todayISO()) return;
    var r = mealsSummary(w.from, w.to);
    var f = FONTI.map(function(x){ return x.label + " " + (r.fonti[x.k] || 0); }).join(", ");
    L.push("- settimana " + (w.i + 1) + (w.parziale ? " (in corso)" : "") + ": " + r.segnati + " pasti segnati su " + r.giorni * 5 + " — da piano " + r.piano + ", liberi " + r.liberi + ", saltati " + r.saltati + "; pranzo/cena: " + f);
  });
  L.push("");
  var start = m.dataInizio;
  var sed = sortedWorkoutsAsc().filter(function(w){ return w.date >= start; });
  L.push("Sedute di pesi nella fase: " + sed.length + ".");
  ["panca_piana","squat","dips_zavorrate"].forEach(function(id){
    var rows = sed.filter(function(w){ return w.exercises.some(function(x){ return x.id === id; }); }).map(function(w){
      var x = w.exercises.find(function(y){ return y.id === id; });
      return fmtDateIt(w.date) + " " + setsText(x.sets);
    });
    if(rows.length) L.push("- " + state.exercises[id].name + ": " + rows.join(" | "));
  });
  var rides = state.bikeRides.filter(function(r){ return r.date >= start; });
  if(rides.length) L.push("Uscite in bici: " + rides.map(function(r){ return fmtDateIt(r.date) + " " + BIKE_RATES[r.tipo].label + " " + fmtNum(r.ore) + " h"; }).join(", ") + ".");
  L.push("");
  if(e.ok){
    L.push("Mantenimento stimato dall'app: " + e.mant + " kcal/die = calorie mangiate in media " + Math.round(e.intake) + " kcal (target del giorno meno i pasti saltati, " + e.giorni + " giorni) − variazione " + fmtNum(Math.round(e.rate * 100) / 100) + " kg/settimana × 7.700 ÷ 7. Giorni senza pasti segnati (contati come da piano): " + e.nonSegnati + ". Settimane con più di un pasto libero: " + e.troppiLiberi + ".");
  } else {
    L.push("Mantenimento non stimabile dall'app: " + e.motivo + ".");
  }
  L.push("");
  L.push("Regole che uso: deficit per perdere 0,5-1% del peso a settimana, attenzione oltre ~500 kcal/die di deficit (Muscle & Strength Pyramid); deficit 10-20% per 4-8 settimane poi 1-2 settimane al mantenimento (Project Invictus); correzioni di 100-200 kcal dopo almeno 2 settimane; reverse +50-100 kcal ogni 1-2 settimane; massa +0,5-1,5% del peso al mese (intermedio); proteine almeno 1,6 g/kg.");
  L.push("");
  L.push("Dammi una valutazione leggibile della fase (andamento di peso, vita, forza, aderenza) e dimmi cosa conviene fare adesso: continuare, aggiustare le calorie (di quanto) o cambiare fase (quale e con quale ritmo), con i numeri. Se i dati non bastano per decidere, dimmi quali mancano.");
  return L.join("\n");
}

  if(wiz.step === 2){

    Object.keys(PHASES).forEach(function(k){
      var lab = PHASES[k].label;
      if(k === "reverse") lab = "Reverse (gradino " + (m.obiettivo === "reverse" ? Math.min((m.reverseStep||1)+1,3) : 1) + ")";
      opts.push([k, lab, {deficit:"mantenimento − deficit dal ritmo", mantenimento:"calorie al mantenimento, stesso piano", reverse:"+100 kcal rispetto a ora", surplus:"mantenimento + surplus dal ritmo"}[PHASES[k].tipo]]);
    });
    opts.forEach(function(o){
      var on = wiz.scelta === o[0];
      html += '<button class="btn'+(on?' primary':'')+'" style="margin-top:8px;text-align:left;" data-act="wiz-scelta" data-scelta="'+o[0]+'"><div>'+o[1]+(sug === o[0] ? ' · <span style="color:#f2c14e;">suggerita</span>' : '')+'</div><div class="small" style="font-weight:400;opacity:.8;">'+o[2]+'</div></button>';

      html += '<div class="small" style="margin-top:6px;">Ritmo ('+(ph.tipo === "deficit" ? "% del peso a settimana" : "% del peso al mese")+')</div><div class="btn-row" style="flex-wrap:wrap;margin-top:6px;">';
      list.forEach(function(r){
        html += '<button class="btn small'+(cur === r ? ' primary' : '')+'" style="width:auto;" data-act="wiz-ritmo" data-ritmo="'+r+'">'+fmtNum(r*100)+'%</button>';
      });
      html += '</div>';
      html += '<div class="muted small" style="margin-top:6px;">'+(ph.tipo === "deficit" ? "Piramide: 0,5-1% a settimana (fino a 1,5% sopra il 19% di massa grassa). Default 0,5%, il più prudente per la massa magra." : "Piramide, intermedio: 0,5-1,5% al mese. Default 1%.")+'</div>';
    }
    html += '</div>';
  }

  if(wiz.step >= 4){
    var p = wizProposal();
    if(!p.ok){
      html += '<div class="card"><div class="small">Non posso calcolare la proposta: '+p.motivo+'.</div></div>';
    } else {
      html += '<div class="card"><h3 style="margin:0;">'+(wiz.step === 4 ? 'Target e durata' : 'Riepilogo')+'</h3>';
      html += '<div class="small" style="margin-top:6px;"><strong>'+(MESOCICLO_OBJ_LABELS[p.obiettivo] || p.obiettivo)+(p.reverseStep ? ' (gradino '+p.reverseStep+')' : '')+'</strong> · forma dal '+(PLAN_LABELS[p.piano] || p.piano)+'</div>';
      html += '<table style="margin-top:8px;"><thead><tr><th></th><th>Riposo</th><th>Allenamento</th></tr></thead><tbody>';
      [["kcal","Kcal",""],["prot","Proteine"," g"],["carb","Carboidrati"," g"],["grassi","Grassi"," g"]].forEach(function(r){
        html += '<tr><td>'+r[1]+'</td><td>'+p.targets.riposo[r[0]]+r[2]+'</td><td>'+p.targets.allenamento[r[0]]+r[2]+'</td></tr>';

      html += '<div class="small" style="margin-top:6px;">Media settimanale ('+seduteSettimana()+' sedute): '+Math.round(p.T)+' kcal/die'+(p.pctMant ? ' · '+Math.round(p.pctMant*100)+'% del mantenimento' : '')+(p.adj ? ' · aggiustamento '+(p.adj > 0 ? '+' : '')+p.adj+' kcal' : '')+'</div>';

      if(wiz.step === 4){
        html += '<div class="field" style="margin-top:10px;"><label>Durata (settimane)</label><input type="number" step="1" min="1" value="'+p.durata+'" data-act="wiz-field" data-field="durata"></div>';

  if(wiz.step < 5) html += '<button class="btn primary" data-act="wiz-next"'+(wiz.step === 2 && !wiz.scelta ? ' disabled' : '')+'>Avanti</button>';
  else html += '<button class="btn primary" data-act="wiz-confirm"'+(wizProposal().ok ? '' : ' disabled')+'>Conferma</button>';
  html += '</div>';
  return html;
}
function wizNextStep(){
  if(wiz.step === 2){
    var ph = PHASES[wiz.scelta];
    wiz.durata = null;
    wiz.step = (ph && ph.tipo !== "reverse") ? 3 : 4; // continua/aggiusta/reverse saltano ritmo e dati
    return;
  }
  wiz.step = Math.min(5, wiz.step + 1);
}
function wizPrevStep(){
  if(wiz.step === 4){
    var ph = PHASES[wiz.scelta];
    wiz.step = (ph && ph.tipo !== "reverse") ? 3 : 2;
    return;
  }
  wiz.step = Math.max(1, wiz.step - 1);
}

  var sw = document.getElementById("swStatus");

    if(!("serviceWorker" in navigator)){ sw.textContent = "Service worker non supportato in questo contesto."; }
    else if(location.protocol === "file:"){ sw.textContent = "File aperto localmente: funziona lo stesso, ma per la cache offline completa ospita l'app online (vedi istruzioni)."; }
    else if(!window.isSecureContext){ sw.textContent = "Service worker non attivo (serve https): apri l'app online per la cache offline completa."; }
    else{
      navigator.serviceWorker.getRegistration().then(function(r){
        sw.textContent = r ? "Service worker attivo ✓ (cache offline pronta)." : "Service worker non ancora registrato (normale se apri il file da solo, senza sw.js accanto).";
      });
    }
  }
}

/* ============================================================
   EVENTI (delegazione)
   ============================================================ */
document.addEventListener("click", function(e){
  var t = e.target.closest("[data-act]");
  if(!t) return;
  var act = t.getAttribute("data-act");

  if(act === "start-log"){
    startLog(t.getAttribute("data-scheda"), t.getAttribute("data-variant") === "1");
  } else if(act === "cancel-log"){
    cancelLog();
  } else if(act === "close-log"){
    startCloseSession();
  } else if(act === "feedback-back"){
    backToSets();
  } else if(act === "feedback-set"){
    setFeedbackField(t.getAttribute("data-field"), t.getAttribute("data-value"));
  } else if(act === "finish-log"){
    saveLog();
  } else if(act === "step"){
    stepSet(t.getAttribute("data-ex"), parseInt(t.getAttribute("data-idx"),10), t.getAttribute("data-field"), parseFloat(t.getAttribute("data-delta")));
  } else if(act === "cycle-stato"){
    cycleSetStato(t.getAttribute("data-ex"), parseInt(t.getAttribute("data-idx"),10));
  } else if(act === "toggle-session"){
    var id = t.getAttribute("data-id");
    openSessionId = openSessionId === id ? null : id;
    render();
  } else if(act === "edit-session"){
    e.stopPropagation();
    editSession(t.getAttribute("data-id"));
  } else if(act === "delete-session"){
    e.stopPropagation();
    if(confirm("Eliminare questa seduta?")){
      state.workouts = state.workouts.filter(function(w){ return w.id !== t.getAttribute("data-id"); });
      persistAll();
      render();
    }
  } else if(act === "export"){
    doExport(t.getAttribute("data-format"));
  } else if(act === "copy-export"){
    var ta = document.getElementById("exportTextarea");
    if(ta){
      ta.select();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(ta.value).then(function(){ toast("Copiato ✓"); }).catch(function(){ document.execCommand("copy"); toast("Copiato ✓"); });
      } else {
        document.execCommand("copy");
        toast("Copiato ✓");
      }
    }
  } else if(act === "peso-step"){
    var delta = parseFloat(t.getAttribute("data-delta"));
    pesoInput = Math.round((pesoInput + delta) * 10) / 10;
    if(pesoInput < 0) pesoInput = 0;
    render();
  } else if(act === "save-peso"){
    var d = todayISO();
    var vitaVal = (vitaInput === "" || vitaInput == null) ? null : parseFloat(vitaInput);
    var colloVal = (colloInput === "" || colloInput == null) ? null : parseFloat(colloInput);
    var bfVal = navyBodyFatMale(vitaVal, colloVal, state.bodyConfig.altezza);
    var entry = {date: d, peso: pesoInput};
    if(vitaVal != null) entry.vita = vitaVal;
    if(colloVal != null) entry.collo = colloVal;
    if(bfVal != null) entry.bf = bfVal;
    var existing = state.bodyweight.find(function(b){ return b.date === d; });
    if(existing) Object.assign(existing, entry);
    else state.bodyweight.push(entry);
    persistAll();
    toast("Peso salvato ✓");
    render();
  } else if(act === "delete-peso"){
    if(confirm("Eliminare questa pesata?")){
      state.bodyweight = state.bodyweight.filter(function(b){ return b.date !== t.getAttribute("data-date"); });
      persistAll();
      render();
    }
  } else if(act === "bike-set-tipo"){
    bikeTipoInput = t.getAttribute("data-tipo");
    if(!bikeOreInput) bikeOreInput = 2;
    render();
  } else if(act === "bike-ore-step"){
    var oreDelta = parseFloat(t.getAttribute("data-delta"));
    bikeOreInput = Math.max(0.5, Math.round((bikeOreInput + oreDelta) * 10) / 10);
    render();
  } else if(act === "save-bike"){
    var bd = todayISO();
    var existingRide = state.bikeRides.find(function(r){ return r.date === bd; });
    if(existingRide){ existingRide.tipo = bikeTipoInput; existingRide.ore = bikeOreInput; }
    else state.bikeRides.push({date: bd, tipo: bikeTipoInput, ore: bikeOreInput});
    persistAll();
    toast("Uscita salvata ✓");
    render();
  } else if(act === "bike-clear"){
    state.bikeRides = state.bikeRides.filter(function(r){ return r.date !== todayISO(); });
    bikeTipoInput = null;
    persistAll();
    render();
  } else if(act === "copy-training-analysis"){
    var tmode = t.getAttribute("data-mode");
    lastTrainingCopyMode = tmode;
    var trainingText = tmode === "settimana" ? buildWeekAnalysisText(14) : buildSessionAnalysisText();
    var tbox = document.getElementById("trainingTextBox");
    if(tbox){
      tbox.innerHTML = '<div class="field" style="margin-top:12px;"><label>Testo pronto da incollare in chat</label><textarea class="export-box" readonly id="trainingTextarea">'+trainingText.replace(/</g,"&lt;")+'</textarea><button class="btn small" style="margin-top:8px;" data-act="copy-training-analysis-text">Copia negli appunti</button></div>';
    }
    var tta = document.getElementById("trainingTextarea");
    if(tta){
      tta.select();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(trainingText).then(function(){ toast("Copiato ✓"); }).catch(function(){});
      }
    }
  } else if(act === "copy-training-analysis-text"){
    var tta2 = document.getElementById("trainingTextarea");
    if(tta2){
      tta2.select();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(tta2.value).then(function(){ toast("Copiato ✓"); }).catch(function(){ document.execCommand("copy"); toast("Copiato ✓"); });
      } else {
        document.execCommand("copy");
        toast("Copiato ✓");
      }
    }
  } else if(act === "save-training-analysis"){
    var tpi = document.getElementById("trainingPasteInput");
    var tval = tpi ? tpi.value.trim() : "";
    if(tval){
      state.trainingAnalysis = {text: tval, date: todayISO(), mode: lastTrainingCopyMode || "sessione"};
      persistAll();
      toast("Analisi salvata ✓");
      render();
    } else {
      toast("Incolla prima il testo dell'IA");
    }
  } else if(act === "delete-training-analysis"){
    state.trainingAnalysis = null;
    persistAll();
    render();
  } else if(act === "force-rotation"){
    var target = t.getAttribute("data-scheda");
    var idx = ROTATION_SEQUENCE.indexOf(target);
    if(idx === -1) idx = 0;
    state.rotationIndex = idx;
    persistAll();
    toast("Prossima scheda impostata: "+target);
    render();
  } else if(act === "recalc-max"){
    var exIdM = t.getAttribute("data-ex");
    var est = computeEstimatedMaxFromHistory(exIdM);
    if(est){
      state.maxes[exIdM] = {value: est.value, date: est.date, source: "storico", fromWeight: est.fromWeight, fromReps: est.fromReps};
      persistAll();
      toast("Massimale ricalcolato: "+fmtNum(est.value)+" kg");
      render();
    } else {
      toast("Nessuno storico per questo esercizio");
    }
  } else if(act === "wipe-data"){
    if(confirm("Cancellare TUTTI i dati salvati (sedute, pesate, alimentazione, impostazioni)? L'operazione non è reversibile.")){
      localStorage.removeItem(LS.config);
      localStorage.removeItem(LS.workouts);
      localStorage.removeItem(LS.bodyweight);
      localStorage.removeItem(LS.rotation);
      localStorage.removeItem(LS.nutrition);
      localStorage.removeItem(LS.trainingAnalysis);
      localStorage.removeItem(LS.logDraft);
      localStorage.removeItem(LS.maxes);
      localStorage.removeItem(LS.cycleWeek);
      localStorage.removeItem(LS.bikeRides);
      localStorage.removeItem(LS.bodyConfig);
      localStorage.removeItem(LS.weekMenu);
      localStorage.removeItem(LS.cookDays);
      localStorage.removeItem(LS.mesociclo);
      localStorage.removeItem(LS.partner);
      localStorage.removeItem(LS.shoppingChecked);
      localStorage.removeItem(LS.pasti);
      state.exercises = JSON.parse(JSON.stringify(DEFAULT_EXERCISES));
      state.workouts = [];
      state.bodyweight = [];
      state.rotationIndex = 0;
      state.nutrition = [];
      state.maxes = {};
      state.cycleWeek = {};
      state.bikeRides = [];
      state.bodyConfig = {altezza: 168, eta: 38};
      state.mesociclo = {obiettivo: "dimagrimento", dataInizio: todayISO(), durataSettimane: MESOCICLO_DURATA_DEFAULT.dimagrimento, pianoPdfMigrato: true, targets: JSON.parse(JSON.stringify(DIMAGRIMENTO_TARGETS)), piano: "base", versione: 1, storico: []};
      LEGACY_KEYS.forEach(function(k){ state[k] = null; });
      state.pasti = [];
      wiz = null;
      logSession = null;
      toast("Dati cancellati");
      render();
    }
  } else if(act === "save-log-draft"){
    saveLogDraftManual();
  } else if(act === "toggle-consulta"){
    var ckey = t.getAttribute("data-key");
    openConsulta[ckey] = !openConsulta[ckey];
    render();
  } else if(act === "meal-day"){
    var md = addDaysISO(mealDate || todayISO(), parseInt(t.getAttribute("data-delta"), 10));
    if(md > todayISO()) md = todayISO();
    mealDate = (md === todayISO()) ? null : md;
    render();
  } else if(act === "meal-set"){
    setPasto(t.getAttribute("data-date"), t.getAttribute("data-pasto"), t.getAttribute("data-esito"), t.getAttribute("data-fonte"));
    render();
  } else if(act === "wiz-open"){
    wizOpen();
  } else if(act === "wiz-cancel"){
    wiz = null;
    render();
  } else if(act === "wiz-next"){
    if(wiz){ wizNextStep(); render(); window.scrollTo(0, 0); }
  } else if(act === "wiz-back"){
    if(wiz){ wizPrevStep(); render(); window.scrollTo(0, 0); }
  } else if(act === "wiz-scelta"){
    if(wiz){ wiz.scelta = t.getAttribute("data-scelta"); wiz.ritmo = null; wiz.durata = null; render(); }
  } else if(act === "wiz-ritmo"){
    if(wiz){ wiz.ritmo = parseFloat(t.getAttribute("data-ritmo")); render(); }
  } else if(act === "wiz-copy-ai"){
    if(wiz){
      wiz.aiText = buildPhaseAIText();
      render();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(wiz.aiText).then(function(){ toast("Copiato ✓"); }).catch(function(){ var ta = document.getElementById("wizAiText"); if(ta) ta.select(); });
      }
    }
  } else if(act === "wiz-save-ai"){
    var wa = document.getElementById("wizAiAnswer");
    if(wiz && wa){ wiz.aiRisposta = wa.value.trim() || null; toast(wiz.aiRisposta ? "Risposta salvata ✓" : "Risposta tolta"); render(); }
  } else if(act === "wiz-confirm"){
    if(wiz) wizConfirm();
  } else if(act === "wiz-undo"){
    if(confirm("Annullare l'ultima conferma e tornare alla fase precedente?")) wizUndo();
  }
});

document.addEventListener("change", function(e){
  var t = e.target;
  if(t.getAttribute && t.getAttribute("data-act") === "set-date"){
    if(logSession){ logSession.date = t.value || todayISO(); persistLogDraft(); render(); }
  } else if(t.getAttribute && t.getAttribute("data-act") === "ex-nota"){
    if(logSession){
      if(!logSession.exNotes) logSession.exNotes = {};
      logSession.exNotes[t.getAttribute("data-ex")] = t.value;
      persistLogDraft();
    }
  } else if(t.getAttribute && t.getAttribute("data-act") === "feedback-nota"){
    if(logSession){
      if(!logSession.feedback) logSession.feedback = {};
      logSession.feedback.nota = t.value;
      persistLogDraft();
    }
  } else if(t.getAttribute && t.getAttribute("data-act") === "feedback-zona-altro"){
    if(logSession){
      if(!logSession.feedback) logSession.feedback = {};
      logSession.feedback.doloreZonaAltro = t.value;
      persistLogDraft();
    }
  } else if(t.getAttribute && t.getAttribute("data-act") === "set-val"){
    if(logSession) setVal(t.getAttribute("data-ex"), parseInt(t.getAttribute("data-idx"),10), t.getAttribute("data-field"), t.value);
  } else if(t.getAttribute && t.getAttribute("data-act") === "set-inc"){
    var exId = t.getAttribute("data-ex");
    var v = parseFloat(t.value);
    if(!isNaN(v) && v >= 0){
      state.exercises[exId].inc = v;
      persistAll();
      toast("Incremento aggiornato");
    }
  } else if(t.getAttribute && t.getAttribute("data-act") === "set-max"){
    var exIdMax = t.getAttribute("data-ex");
    var vMax = parseFloat(String(t.value).replace(",", "."));
    if(!isNaN(vMax) && vMax > 0){
      state.maxes[exIdMax] = {value: Math.round(vMax*10)/10, date: todayISO(), source: "manuale"};
      persistAll();
      toast("Massimale aggiornato");
      render();
    }
  } else if(t.getAttribute && t.getAttribute("data-act") === "set-cycle-week"){
    var exIdCw = t.getAttribute("data-ex");
    var vCw = parseInt(t.value, 10);
    if(!isNaN(vCw) && vCw >= 1 && vCw <= 5){
      if(!state.cycleWeek) state.cycleWeek = {};
      state.cycleWeek[exIdCw] = vCw;
      persistAll();
      toast("Settimana ciclo impostata: "+vCw);
      render();
    }
  } else if(t.getAttribute && t.getAttribute("data-act") === "set-rest"){
    var exIdR = t.getAttribute("data-ex");
    var vR = parseInt(t.value, 10);
    if(!isNaN(vR) && vR >= 0){
      state.exercises[exIdR].rest = vR;
      persistAll();
      toast("Recupero aggiornato");
    }
  } else if(t.getAttribute && t.getAttribute("data-act") === "meal-nota"){
    var en = pastoOf(t.getAttribute("data-date"), t.getAttribute("data-pasto"));
    if(en){ if(t.value.trim()) en.nota = t.value.trim(); else delete en.nota; persistAll(); }
  } else if(t.getAttribute && t.getAttribute("data-act") === "wiz-field"){
    if(wiz){
      var wf = t.getAttribute("data-field"), wv = parseFloat(String(t.value).replace(",", "."));
      if(wf === "mant") wiz.mant = (isNaN(wv) || wv <= 0) ? null : Math.round(wv);
      if(wf === "peso") wiz.peso = (isNaN(wv) || wv <= 0) ? null : wv;
      if(wf === "durata") wiz.durata = (isNaN(wv) || wv < 1) ? null : Math.round(wv);
      render();
    }
  } else if(t.getAttribute && t.getAttribute("data-act") === "set-mesociclo"){
    var mField = t.getAttribute("data-field");
    if(mField === "dataInizio"){
      if(t.value) state.mesociclo.dataInizio = t.value;
    } else if(mField === "durataSettimane"){
      var durVal = parseInt(t.value, 10);
      if(!isNaN(durVal) && durVal > 0) state.mesociclo.durataSettimane = durVal;
    }
    persistAll();
    toast("Fase aggiornata ✓");
    render();
  } else if(t.getAttribute && t.getAttribute("data-act") === "set-body"){
    var bField = t.getAttribute("data-field");
    var bVal = parseFloat(String(t.value).replace(",", "."));
    if(bField === "sedute" && !isNaN(bVal)) bVal = Math.max(1, Math.min(7, Math.round(bVal)));
    if(!isNaN(bVal) && bVal > 0){
      state.bodyConfig[bField] = bVal;
      persistAll();
      toast("Aggiornato");
      render();
    }
  } else if(t.getAttribute && t.getAttribute("data-act") === "set-circ"){
    var cField = t.getAttribute("data-field");
    var cRaw = String(t.value).replace(",", ".").trim();
    var cVal = cRaw === "" ? "" : parseFloat(cRaw);
    if(cField === "vita") vitaInput = (cVal === "" || isNaN(cVal)) ? "" : cVal;
    else if(cField === "collo") colloInput = (cVal === "" || isNaN(cVal)) ? "" : cVal;
    render();
  } else if(t.getAttribute && t.getAttribute("data-act") === "import-file"){
    var file = t.files && t.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        if(!confirm("Importare questo backup? Sovrascriverà i dati attuali su questo telefono.")) return;
        if(data.exercises) state.exercises = data.exercises;
        if(data.workouts) state.workouts = data.workouts;
        if(data.bodyweight) state.bodyweight = data.bodyweight;
        if(data.nutrition) state.nutrition = data.nutrition;
        if(data.trainingAnalysis) state.trainingAnalysis = data.trainingAnalysis;
        if(data.maxes) state.maxes = data.maxes;
        if(data.cycleWeek) state.cycleWeek = data.cycleWeek;
        if(data.bikeRides) state.bikeRides = data.bikeRides;
        if(data.bodyConfig) state.bodyConfig = data.bodyConfig;
        if(data.mesociclo) state.mesociclo = data.mesociclo;
        if(data.pasti) state.pasti = data.pasti;
        LEGACY_KEYS.forEach(function(k){
          if(data[k] !== undefined && data[k] !== null){ state[k] = data[k]; saveJSON(LS[k], data[k]); }
        });
        persistAll();
        toast("Backup importato ✓");
        render();
      }catch(err){
        alert("File non valido.");
      }
    };
    reader.readAsText(file);
  }
});

function updateHeader(){
  var sub = document.getElementById("headerSub");
  var titles = {oggi:"Allenamento", mealprep:"Alimentazione", consulta:"Consulta", impostazioni:"Impostazioni"};
  sub.textContent = titles[currentTab] || "";
}

function render(){
  updateHeader();
  if(currentTab === "oggi") renderOggi();
  else if(currentTab === "mealprep") renderMealPrep();
  else if(currentTab === "consulta") renderConsulta();
  else if(currentTab === "impostazioni") renderImpostazioni();
}

render();
