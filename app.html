html,body{

  background:var(--bg);
  color:var(--text);

}

}
.view{display:none;}
.view.active{display:block;}
.card{
  background:var(--panel);

}
.card h2{font-size:16px;color:var(--accent);}
.card h3{font-size:14px;color:var(--text);}
.muted{color:var(--muted);}
.small{font-size:12.5px;}
.row{display:flex;align-items:center;gap:10px;}
.row.between{justify-content:space-between;}
.wrap{flex-wrap:wrap;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.stat{
  background:var(--panel2);

button{
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:600;
  -webkit-user-select:none;user-select:none;
}
.btn{
  min-height:52px;
  padding:12px 18px;

  color:var(--text);

}
.btn.primary{background:var(--accent);color:var(--accent-text);border:none;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}

.badge{

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ============================================================
   CONFIG DI DEFAULT
   ============================================================ */
var DEFAULT_EXERCISES = {
  panca_piana:        {name:"Panca piana bilanciere",       kind:"principal", lo:6,  hi:6,  inc:2.5,  unit:"kg", defSets:3, rest:180},
  chest_press:         {name:"Chest press",                  kind:"range",     lo:8,  hi:10, inc:2.5,  unit:"kg", defSets:3, rest:120},
  pulley_basso:        {name:"Pulley basso",                 kind:"range",     lo:8,  hi:10, inc:2.5,  unit:"kg", defSets:3, rest:120},
  bayesan_curl:        {name:"Bayesan curl",                 kind:"range",     lo:10, hi:12, inc:2,    unit:"kg", defSets:3, rest:90},
  curl_manubri_seduto: {name:"Curl manubri seduto",          kind:"range",     lo:10, hi:12, inc:2,    unit:"kg", defSets:3, rest:90},
  leg_raise:           {name:"Leg raise sedia romana",       kind:"legraise",  lo:12, hi:15, inc:1.25, unit:"kg zavorra", defSets:3, rest:60},
  squat:               {name:"Squat bilanciere",             kind:"principal", lo:6,  hi:6,  inc:5,    unit:"kg", defSets:3, rest:180},
  leg_press:           {name:"Leg press",                    kind:"range",     lo:8,  hi:10, inc:5,    unit:"kg", defSets:3, rest:120},
  calf_raise:          {name:"Calf raise",                   kind:"range",     lo:8,  hi:10, inc:2.5,  unit:"kg", defSets:3, rest:120},
  lento_avanti:        {name:"Lento avanti manubri",         kind:"range",     lo:8,  hi:10, inc:2,    unit:"kg", defSets:3, rest:120},
  alzate_laterali:     {name:"Alzate laterali manubri",      kind:"range",     lo:10, hi:12, inc:1,    unit:"kg", defSets:3, rest:90},
  dips_zavorrate:      {name:"Dips zavorrate",                kind:"principal", lo:6,  hi:6,  inc:2.5,  unit:"kg zavorra", defSets:3, rest:180},
  croci_cavi:          {name:"Croci ai cavi",                 kind:"range",     lo:10, hi:12, inc:2.5,  unit:"kg", defSets:3, rest:90},
  trazioni:            {name:"Trazioni",                      kind:"range",     lo:6,  hi:8,  inc:2.5,  unit:"kg zavorra", defSets:3, rest:120},
  push_down:           {name:"Push down al cavo alto",        kind:"range",     lo:8,  hi:10, inc:2.5,  unit:"kg", defSets:3, rest:120},
  french_press:        {name:"French press bilanciere EZ",    kind:"range",     lo:8,  hi:10, inc:2.5,  unit:"kg", defSets:3, rest:120},
  face_pull:           {name:"Face pull al cavo (corda)",      kind:"range",     lo:12, hi:15, inc:2.5,  unit:"kg", defSets:3, rest:60}
};

var SCHEDE = {
  A: {name:"Petto e Dorso", exercises:["panca_piana","chest_press","pulley_basso","bayesan_curl","curl_manubri_seduto","leg_raise"]},
  B: {name:"Gambe e Spalle", exercises:["squat","leg_press","calf_raise","lento_avanti","alzate_laterali","face_pull"]},
  C: {name:"Spinta e Tricipiti", exercises:["dips_zavorrate","croci_cavi","trazioni","push_down","french_press","leg_raise"]}
};

var ROTATION_SEQUENCE = ["A","B","C"];

var MEAL_TYPES = ["Colazione","Metà mattina","Pranzo","Merenda","Cena","Spuntino"];
// Riconosce il tipo pasto scritto come prima riga o come prefisso ("Colazione: ...", "Colazione\n...").
// Le forme più specifiche vanno prima delle generiche (es. "spuntino pomeridiano" prima di "spuntino").
var MEAL_TYPE_RE = /^\s*(prima colazione|colazione|met[aà]\s+mattina|spuntino mattutino|spuntino pomeridiano|spuntino pomeriggio|merenda|pranzo|cena|spuntino)\b[:\-,]?\s*/i;
var MEAL_TYPE_LABELS = {
  "prima colazione":"Colazione", "colazione":"Colazione",
  "meta mattina":"Metà mattina", "metà mattina":"Metà mattina", "spuntino mattutino":"Metà mattina",
  "spuntino pomeridiano":"Merenda", "spuntino pomeriggio":"Merenda", "merenda":"Merenda",
  "pranzo":"Pranzo", "cena":"Cena", "spuntino":"Spuntino"
};
function extractMealType(text){
  var raw = String(text);
  var m = raw.match(MEAL_TYPE_RE);
  if(m){
    var key = m[1].toLowerCase().replace(/\s+/g," ").trim();
    var label = MEAL_TYPE_LABELS[key];
    if(label) return {mealType: label, text: raw.slice(m[0].length)};
  }
  return {mealType: null, text: raw};
}
function guessMealTypeByHour(){
  var h = new Date().getHours();
  if(h < 10) return "Colazione";
  if(h < 12) return "Metà mattina";
  if(h < 15) return "Pranzo";
  if(h < 18) return "Merenda";
  if(h < 22) return "Cena";
  return "Spuntino";
}

/* ============================================================
   STORAGE
   ============================================================ */
var LS = {
  config: "pp_config_v1",
  workouts: "pp_workouts_v1",
  bodyweight: "pp_bodyweight_v1",
  rotation: "pp_rotation_index_v1",
  nutrition: "pp_nutrition_v1",
  restVersion: "pp_rest_version_v1",
  trainingAnalysis: "pp_training_analysis_v1"
};

var TARGETS = {
  allenamento: {kcal: 2250, prot: 150, carb: 250, grassi: 65, label:"Giorno di allenamento"},
  riposo:      {kcal: 1970, prot: 150, carb: 180, grassi: 65, label:"Giorno di riposo"}
};

function loadJSON(key, fallback){
  try{
    var raw = localStorage.getItem(key);
    if(!raw) return fallback;
    return JSON.parse(raw);
  }catch(e){ return fallback; }
}
function saveJSON(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}

var state = {
  exercises: loadJSON(LS.config, null) || JSON.parse(JSON.stringify(DEFAULT_EXERCISES)),
  workouts: loadJSON(LS.workouts, []),
  bodyweight: loadJSON(LS.bodyweight, []),
  rotationIndex: loadJSON(LS.rotation, 0),
  nutrition: loadJSON(LS.nutrition, []),
  trainingAnalysis: loadJSON(LS.trainingAnalysis, null)
};
// Il vecchissimo "check alimentare" (sì/no per kcal/prot/carb/grassi, prima ancora del
// diario) non aveva il campo "text": quelle voci non sono più leggibili, vengono scartate
// al primo avvio. Sia le voci del diario con calcolo (items, versione precedente) sia
// quelle di solo testo libero (versione attuale) hanno sempre "text" e restano valide.
state.nutrition = state.nutrition.filter(function(n){ return typeof n.text === "string"; });

// merge in any new exercise keys added in future updates without wiping user edits
var REST_DEFAULTS_VERSION = 2; // v2 = valori di recupero basati su Project Invictus (bracket per range di ripetizioni)
(function mergeConfig(){
  var changed = false;
  Object.keys(DEFAULT_EXERCISES).forEach(function(k){
    if(!state.exercises[k]){ state.exercises[k] = JSON.parse(JSON.stringify(DEFAULT_EXERCISES[k])); changed = true; }
    else if(state.exercises[k].rest === undefined){ state.exercises[k].rest = DEFAULT_EXERCISES[k].rest; changed = true; }
  });
  var storedRestVersion = loadJSON(LS.restVersion, 0);
  if(storedRestVersion < REST_DEFAULTS_VERSION){
    Object.keys(DEFAULT_EXERCISES).forEach(function(k){
      if(state.exercises[k]) state.exercises[k].rest = DEFAULT_EXERCISES[k].rest;
    });
    saveJSON(LS.restVersion, REST_DEFAULTS_VERSION);
    changed = true;
  }
  if(changed) saveJSON(LS.config, state.exercises);
})();

function formatRest(sec){
  if(!sec) return "—";
  if(sec % 60 === 0) return (sec/60)+" min";
  var m = Math.floor(sec/60), s = sec % 60;
  return m+"'"+s+'"';
}

function persistAll(){
  saveJSON(LS.config, state.exercises);
  saveJSON(LS.workouts, state.workouts);
  saveJSON(LS.bodyweight, state.bodyweight);
  saveJSON(LS.rotation, state.rotationIndex);
  saveJSON(LS.nutrition, state.nutrition);
  saveJSON(LS.trainingAnalysis, state.trainingAnalysis);
}

function dayTypeFor(date){
  var hasWorkout = state.workouts.some(function(w){ return w.date === date; });
  return hasWorkout ? "allenamento" : "riposo";
}

/* ============================================================
   DIARIO ALIMENTARE: registro in testo libero.
   Niente riconoscimento di alimenti/calcolo kcal-macro in locale (matching per
   parole chiave troppo fragile). Il calcolo lo fa l'IA: si copia il diario
   ("Copia diario"), lo si incolla in chat, e la risposta dell'IA — che include
   righe in formato id|kcal|proteine|carbo|grassi — si incolla a sua volta
   nell'app ("Incolla i macro") per popolare i totali e vedere quanto resta
   nella giornata (utile per bilanciare cena/spuntino se un pasto è saltato).
   ============================================================ */
function round1(n){ return Math.round(n*10)/10; }

function mealTypeOrder(mt){
  var i = MEAL_TYPES.indexOf(mt);
  return i === -1 ? MEAL_TYPES.length : i;
}

function nutritionDays(limitDays){
  var byDate = {};
  state.nutrition.forEach(function(n){
    if(!byDate[n.date]) byDate[n.date] = [];
    byDate[n.date].push(n);
  });
  var dates = Object.keys(byDate).sort().reverse();
  if(limitDays) dates = dates.slice(0, limitDays);
  return dates.map(function(d){
    var entries = byDate[d].slice().sort(function(a,b){ return mealTypeOrder(a.mealType) - mealTypeOrder(b.mealType); });
    return {date: d, entries: entries};
  });
}

function hasMacro(n){ return typeof n.kcal === "number"; }

// Totali del giorno calcolati solo sui pasti che hanno già i macro (dopo un
// "Incolla i macro"): utile per sapere quanto resta rispetto al target anche
// se non tutti i pasti della giornata sono stati calcolati.
function nutritionTotalsForDate(date){
  var entries = state.nutrition.filter(function(n){ return n.date === date; });
  var t = {kcal:0, prot:0, carb:0, fat:0};
  var computed = 0;
  entries.forEach(function(n){
    if(hasMacro(n)){ t.kcal+=n.kcal; t.prot+=n.prot; t.carb+=n.carb; t.fat+=n.fat; computed++; }
  });
  return {entries: entries, totals: t, computed: computed};
}

// Testo pronto da incollare in una chat con l'IA per farsi calcolare kcal/macro
// e ricevere consigli — include i target di riferimento, il peso medio e
// l'istruzione sul formato di risposta, così il testo è autosufficiente anche
// in una chat nuova senza altro contesto. Ogni pasto porta il suo id tra parentesi
// graffe per permettere di reincollare i numeri nel pasto giusto; i pasti già
// calcolati mostrano il valore così l'IA non deve ricalcolarli.
function buildDiaryText(limitDays){
  var days = nutritionDays(limitDays);
  var lines = [];
  lines.push("Diario alimentare — " + (limitDays === 1 ? "oggi" : "ultimi " + limitDays + " giorni"));
  lines.push("Target: giorno di allenamento " + TARGETS.allenamento.kcal + " kcal / " + TARGETS.allenamento.prot + "g prot / " + TARGETS.allenamento.carb + "g carb / " + TARGETS.allenamento.grassi + "g grassi — giorno di riposo " + TARGETS.riposo.kcal + " kcal / " + TARGETS.riposo.prot + "g prot / " + TARGETS.riposo.carb + "g carb / " + TARGETS.riposo.grassi + "g grassi.");
  var avg7 = sevenDayAvg();
  if(avg7) lines.push("Peso corporeo (media 7gg): " + fmtNum(avg7) + " kg.");
  lines.push("");
  lines.push("Per ogni pasto qui sotto SENZA valore [già calcolato: ...], calcola kcal/proteine/carboidrati/grassi e includi nella risposta una riga per pasto in questo formato esatto (una riga per pasto, niente altro su quella riga): id|kcal|proteine_g|carbo_g|grassi_g — userò la tua risposta intera, incollata così com'è, per aggiornare l'app.");
  lines.push("");
  if(!days.length){
    lines.push("(nessun pasto registrato)");
  } else {
    days.forEach(function(d){
      var dt = dayTypeFor(d.date);
      lines.push(fmtDateIt(d.date) + " — " + (dt === "allenamento" ? "giorno di allenamento" : "giorno di riposo"));
      d.entries.forEach(function(n){
        var macroTag = hasMacro(n) ? "  [già calcolato: "+fmtNum(n.kcal)+" kcal / "+fmtNum(n.prot)+"g prot / "+fmtNum(n.carb)+"g carb / "+fmtNum(n.fat)+"g grassi]" : "";
        lines.push("- " + (n.mealType || "Pasto") + ": " + n.text + "  {id: "+n.id+"}" + macroTag);
      });
      lines.push("");
    });
  }
  return lines.join("\n").trim();
}

/* ============================================================
   ANALISI ALLENAMENTO (IA) — stesso giro di "copia testo, analizza
   in chat, incolla il report" usato per il diario alimentare.
   Qui però il testo incollato non viene parsato: è salvato così
   com'è e mostrato in cima a "Prossima seduta".
   ============================================================ */
function kindLabel(kind){
  if(kind === "principal") return "principale";
  if(kind === "legraise") return "isolamento/finisher";
  return "accessorio";
}
function setsText(sets){
  return sets.map(function(s){ return fmtNum(s.peso)+"x"+s.reps; }).join(", ");
}
function exerciseLine(exId, sets){
  var cfg = state.exercises[exId];
  return cfg.name + " (" + kindLabel(cfg.kind) + ", target " + cfg.lo + (cfg.lo!==cfg.hi ? "-"+cfg.hi : "") + " rip, incremento " + fmtNum(cfg.inc) + " " + cfg.unit + "): " + setsText(sets);
}
function trainingRulesText(){
  return "Regole di progressione (Project Invictus): esercizi principali (panca piana, squat, dips zavorrate) fissi a 3x6, RPE 7,5-9,5 (1-2 rip di riserva) — quando TUTTE le serie chiudono a 6 rip, alla seduta successiva +5kg su squat/leg press e +2,5kg sul resto. Esercizi accessori (range di ripetizioni), RPE 8,5-10 (0-1 rip di riserva) — si sale prima con le ripetizioni fino al limite alto del range, si aggiunge carico solo quando TUTTE le serie chiudono al limite alto, poi si riparte dal limite basso. Leg raise (isolamento/finisher) può arrivare a RPE 10/cedimento tecnico, ginocchia a 90° per limiti di flessibilità, progressione prima con le ripetizioni poi con zavorra ai piedi. Deload ogni ~5 settimane (dimezzare le serie, stessi carichi). Obiettivo attuale: ricomposizione corporea con deficit leggero; da novembre 2026 fase di massa.";
}
function buildSessionAnalysisText(){
  var list = sortedWorkoutsAsc();
  if(!list.length) return "Nessuna seduta ancora registrata.";
  var w = list[list.length-1];
  var scheda = SCHEDE[w.scheda];
  var lines = [];
  lines.push("Analisi ultima seduta — " + fmtDateIt(w.date) + " — Scheda " + w.scheda + " (" + scheda.name + ")" + (w.variant ? " [variante]" : ""));
  lines.push(trainingRulesText());
  lines.push("");
  lines.push("Per ogni esercizio sotto c'è, se esiste, la seduta precedente dello stesso esercizio per il confronto.");
  lines.push("");
  w.exercises.forEach(function(e){
    lines.push("- " + exerciseLine(e.id, e.sets));
    var prev = lastPerformance(e.id, w.id);
    lines.push("  precedente" + (prev ? (" (" + fmtDateIt(prev.workout.date) + "): " + setsText(prev.ex.sets)) : ": nessuno storico"));
  });
  lines.push("");
  lines.push("Dammi un report leggibile (non serve un formato rigido): valutazione della seduta, se la progressione è coerente con le regole sopra, eventuali segnali di stallo o affaticamento, cosa aspettarmi/puntare alla prossima Scheda " + w.scheda + ".");
  return lines.join("\n").trim();
}
function buildWeekAnalysisText(days){
  days = days || 14;
  var cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - days);
  var cutoffISO = isoFromDate(cutoff);
  var list = sortedWorkoutsAsc().filter(function(w){ return w.date >= cutoffISO; });
  var lines = [];
  lines.push("Analisi settimana — ultimi " + days + " giorni (" + list.length + " sedute registrate)");
  lines.push(trainingRulesText());
  var avg7 = sevenDayAvg();
  if(avg7) lines.push("Peso corporeo (media 7gg): " + fmtNum(avg7) + " kg.");
  lines.push("");
  if(!list.length){
    lines.push("(nessuna seduta in questo periodo)");
  } else {
    list.forEach(function(w){
      var scheda = SCHEDE[w.scheda];
      lines.push(fmtDateIt(w.date) + " — Scheda " + w.scheda + " (" + scheda.name + ")" + (w.variant ? " [variante]" : ""));
      w.exercises.forEach(function(e){ lines.push("  - " + exerciseLine(e.id, e.sets)); });
      lines.push("");
    });
  }
  lines.push("Dammi un report leggibile sull'andamento: quali esercizi progrediscono bene, quali sembrano in stallo, se il deload (ogni ~5 settimane) è vicino o già in ritardo, e qualunque altro segnale utile su questo periodo.");
  return lines.join("\n").trim();
}

/* ============================================================
   UTIL
   ============================================================ */
function fmtNum(n){
  n = Math.round(n * 100) / 100;
  return (n % 1 === 0) ? String(n) : String(n).replace(".", ",");
}
function todayISO(){
  return isoFromDate(new Date());
}
function isoFromDate(d){
  var m = String(d.getMonth()+1).padStart(2,"0");
  var day = String(d.getDate()).padStart(2,"0");
  return d.getFullYear()+"-"+m+"-"+day;
}
function fmtDateIt(iso){
  var parts = iso.split("-");
  return parts[2]+"/"+parts[1]+"/"+parts[0];
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

var toastTimer = null;
function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);

}

/* ============================================================
   LOGICA STORICO / SUGGERIMENTI
   ============================================================ */
// Ordina le sedute per data (crescente); a parità di data, per ordine di inserimento (id).
// Serve perché con la modifica/aggiunta di sedute retroattive l'ordine nell'array
// non è più garantito coincidere con l'ordine cronologico reale.
function sortedWorkoutsAsc(){
  return state.workouts.slice().sort(function(a,b){
    if(a.date !== b.date) return a.date < b.date ? -1 : 1;
    return a.id < b.id ? -1 : (a.id > b.id ? 1 : 0);
  });
}

function lastPerformance(exId, excludeId){
  var list = sortedWorkoutsAsc();
  for(var i = list.length - 1; i >= 0; i--){
    var w = list[i];
    if(excludeId && w.id === excludeId) continue;
    for(var j = 0; j < w.exercises.length; j++){
      if(w.exercises[j].id === exId) return {workout:w, ex:w.exercises[j]};
    }
  }
  return null;
}

// Ritorna {weight, targetLo, targetHi, sets, note, hasHistory}
function suggestFor(exId, setsCount, excludeId){
  var cfg = state.exercises[exId];
  var perf = lastPerformance(exId, excludeId);
  var startWeight = (exId === "leg_raise" || exId === "dips_zavorrate" || exId === "trazioni") ? 0 : 0;
  if(!perf){
    return {
      weight: startWeight,
      reps: new Array(setsCount).fill(cfg.lo),
      note: "Prima volta: parti leggero e trova il carico.",
      noteType:"hold"
    };
  }
  var lastSets = perf.ex.sets;
  var lastWeight = lastSets.length ? lastSets[0].peso : startWeight;
  var allAtTop = lastSets.length > 0 && lastSets.every(function(s){ return s.reps >= cfg.hi; });

  var newWeight = lastWeight;
  var repsGuess;
  var note, noteType;

  if(cfg.kind === "principal"){
    if(allAtTop){
      newWeight = lastWeight + cfg.inc;
      note = "Serie chiuse a " + cfg.hi + ": sali a " + fmtNum(newWeight) + " kg";
      noteType = "up";
      repsGuess = new Array(setsCount).fill(cfg.lo);
    } else {
      note = "Ripeti " + fmtNum(lastWeight) + " kg, punta a " + cfg.hi + " su tutte";
      noteType = "hold";
      repsGuess = lastSets.map(function(s){ return s.reps; });
    }
  } else {
    if(allAtTop){
      newWeight = lastWeight + cfg.inc;
      note = "Top range raggiunto: sali a " + fmtNum(newWeight) + " kg, riparti da " + cfg.lo;
      noteType = "up";
      repsGuess = new Array(setsCount).fill(cfg.lo);
    } else {
      note = "Ripeti " + fmtNum(lastWeight) + " kg, punta a " + cfg.hi;
      noteType = "hold";
      repsGuess = lastSets.map(function(s){ return s.reps; });
    }
  }
  while(repsGuess.length < setsCount) repsGuess.push(cfg.lo);
  repsGuess = repsGuess.slice(0, setsCount);

  return {
    weight: newWeight,
    reps: repsGuess,
    note: note,
    noteType: noteType,
    lastText: lastSets.map(function(s){ return fmtNum(s.peso)+"x"+s.reps; }).join(", "),
    lastDate: perf.workout.date
  };
}

   ============================================================ */
var logSession = null; // {schedaId, variant, date, editId, exIds, sets: {exId: [{peso,reps,done}, ...]}}

function startLog(schedaId, variant){
  var scheda = SCHEDE[schedaId];
  var exIds = scheda.exercises.slice();
  if(schedaId === "B" && variant){
    exIds = exIds.filter(function(id){ return id !== "squat"; });
  }
  var sets = {};
  exIds.forEach(function(exId){
    var cfg = state.exercises[exId];
    var setsCount = cfg.defSets;
    if(schedaId === "B" && variant && exId === "leg_press") setsCount = 4;
    var sug = suggestFor(exId, setsCount);
    var arr = [];
    for(var i=0;i<setsCount;i++){
      arr.push({peso: sug.weight, reps: (sug.reps[i] !== undefined ? sug.reps[i] : cfg.lo), done:false});
    }
    sets[exId] = arr;
  });
  logSession = {schedaId: schedaId, variant: !!variant, date: todayISO(), editId: null, exIds: exIds, sets: sets};
  showTab("oggi");
}

// Riapre una seduta già salvata per correggerla (carichi/rip/data sbagliati,
// o una seduta dimenticata inserita col giorno sbagliato).
function editSession(id){
  var w = state.workouts.find(function(x){ return x.id === id; });
  if(!w) return;
  var exIds = w.exercises.map(function(e){ return e.id; });
  var sets = {};
  w.exercises.forEach(function(e){
    sets[e.id] = e.sets.map(function(s){ return {peso:s.peso, reps:s.reps, done:true}; });
  });
  logSession = {schedaId: w.scheda, variant: !!w.variant, date: w.date, editId: w.id, exIds: exIds, sets: sets};
  showTab("oggi");
}

function cancelLog(){
  logSession = null;
  render();
}

function saveLog(){
  if(!logSession) return;
  var exercisesOut = logSession.exIds.map(function(exId){
    return {id: exId, sets: logSession.sets[exId].map(function(s){ return {peso:s.peso, reps:s.reps}; })};
  });
  if(logSession.editId){
    var idx = state.workouts.findIndex(function(w){ return w.id === logSession.editId; });
    if(idx > -1){
      state.workouts[idx] = {
        id: logSession.editId,
        date: logSession.date || todayISO(),
        scheda: logSession.schedaId,
        variant: logSession.variant,
        exercises: exercisesOut
      };
    }
    persistAll();
    logSession = null;
    toast("Seduta aggiornata ✓");
    render();
    return;
  }
  var workout = {
    id: uid(),
    date: logSession.date || todayISO(),
    scheda: logSession.schedaId,
    variant: logSession.variant,
    exercises: exercisesOut
  };
  state.workouts.push(workout);
  advanceRotation();
  persistAll();
  logSession = null;
  toast("Seduta salvata ✓");
  render();
}

function stepSet(exId, idx, field, delta){
  var s = logSession.sets[exId][idx];
  if(field === "peso"){
    var cfg = state.exercises[exId];
    s.peso = Math.max(0, Math.round((s.peso + delta * cfg.inc) * 100) / 100);
  } else {
    s.reps = Math.max(0, s.reps + delta);
  }
  render();
}

function setVal(exId, idx, field, raw){
  var s = logSession.sets[exId][idx];
  var v = parseFloat(String(raw).replace(",", "."));
  if(isNaN(v) || v < 0) v = 0;
  s[field] = (field === "peso") ? (Math.round(v*100)/100) : Math.round(v);
  render();
}

function toggleDone(exId, idx){
  var s = logSession.sets[exId][idx];
  s.done = !s.done;
  render();
}

function sevenDayAvg(){
  if(!state.bodyweight.length) return null;
  var sorted = state.bodyweight.slice().sort(function(a,b){ return a.date < b.date ? 1 : -1; });

  var sum = last7.reduce(function(a,b){ return a+b.peso; }, 0);
  return sum / last7.length;
}

function rowsToCSVText(rows){
  return rows.map(function(r){
    return r.map(function(v){
      v = String(v);
      if(v.indexOf(",")>-1 || v.indexOf('"')>-1){ v = '"'+v.replace(/"/g,'""')+'"'; }
      return v;
    }).join(",");
  }).join("\n");
}

function toCSV(){
  var rows = [["=== SEDUTE ==="],["data","scheda","variante","esercizio","serie","peso","ripetizioni"]];
  state.workouts.forEach(function(w){
    w.exercises.forEach(function(ex){
      var cfg = state.exercises[ex.id] || {name: ex.id};
      ex.sets.forEach(function(s, idx){
        rows.push([w.date, w.scheda, w.variant?"si":"no", cfg.name, String(idx+1), fmtNum(s.peso), String(s.reps)]);
      });
    });
  });

  rows.push([]);
  rows.push(["=== PESO CORPOREO ==="]);
  rows.push(["data","peso_kg"]);
  state.bodyweight.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; }).forEach(function(b){
    rows.push([b.date, fmtNum(b.peso)]);
  });

  rows.push([]);
  rows.push(["=== ALIMENTAZIONE ==="]);
  rows.push(["data","pasto","testo","kcal","proteine_g","carbo_g","grassi_g"]);
  state.nutrition.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; }).forEach(function(n){
    rows.push([n.date, n.mealType||"Pasto", n.text, hasMacro(n)?fmtNum(n.kcal):"", hasMacro(n)?fmtNum(n.prot):"", hasMacro(n)?fmtNum(n.carb):"", hasMacro(n)?fmtNum(n.fat):""]);
  });

  return rowsToCSVText(rows);
}

function toJSON(){
  return JSON.stringify({
    exportedAt: new Date().toISOString(),
    exercises: state.exercises,
    workouts: state.workouts,
    bodyweight: state.bodyweight,
    nutrition: state.nutrition,
    trainingAnalysis: state.trainingAnalysis
  }, null, 2);
}

function doExport(format){
  var content = format === "csv" ? toCSV() : toJSON();
  var filename = "palestra-registro-"+todayISO()+"."+format;
  var mime = format === "csv" ? "text/csv" : "application/json";

  var box = document.getElementById("exportBox");

  function showFallback(){
    var h = '<div class="field" style="margin-top:12px;">';
    h += '<label>Contenuto '+format.toUpperCase()+' (copia da qui se la condivisione non funziona)</label>';
    h += '<textarea class="export-box" readonly id="exportTextarea">'+content.replace(/</g,"&lt;")+'</textarea>';
    h += '<button class="btn small" style="margin-top:8px;" data-act="copy-export">Copia negli appunti</button>';
    h += '</div>';
    if(box) box.innerHTML = h;
  }

  if(navigator.share && navigator.canShare){
    try{
      var file = new File([content], filename, {type: mime});
      if(navigator.canShare({files:[file]})){
        navigator.share({files:[file], title: filename}).catch(function(){ showFallback(); });
        return;
      }
    }catch(e){}
  }

  try{
    var blob = new Blob([content], {type: mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }catch(e){}

  showFallback();
}

// Applica i macro incollati dall'IA: cerca righe "id|kcal|proteine|carbo|grassi"
// (5 campi separati da |, il primo che combacia con l'id di un pasto salvato,
// gli altri quattro numerici) e ignora silenziosamente tutto il resto — così si
// può incollare l'intera risposta dell'IA, non serve isolare a mano le righe.
function applyMacroPaste(text){
  var lines = String(text || "").split(/\r?\n/);
  var applied = 0;
  lines.forEach(function(line){
    var parts = line.split("|");
    if(parts.length !== 5) return;
    var id = parts[0].trim();
    var n = state.nutrition.find(function(x){ return x.id === id; });
    if(!n) return;
    var kcal = parseFloat(String(parts[1]).replace(",", "."));
    var prot = parseFloat(String(parts[2]).replace(",", "."));
    var carb = parseFloat(String(parts[3]).replace(",", "."));
    var fat = parseFloat(String(parts[4]).replace(",", "."));
    if([kcal,prot,carb,fat].some(function(v){ return isNaN(v) || v < 0; })) return;
    n.kcal = round1(kcal); n.prot = round1(prot); n.carb = round1(carb); n.fat = round1(fat);
    applied++;
  });
  if(applied) persistAll();
  return {applied: applied};
}

function renderSparkline(){
  var sorted = state.bodyweight.slice().sort(function(a,b){ return a.date < b.date ? -1 : 1; }).slice(-14);
  if(sorted.length < 2) return '<p class="muted small">Servono più pesate.</p>';
  var vals = sorted.map(function(b){ return b.peso; });
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  var range = (max - min) || 1;
  var w = 300, h = 56, pad = 4;
  var pts = vals.map(function(v, i){
    var x = pad + (i/(vals.length-1)) * (w - pad*2);
    var y = h - pad - ((v - min)/range) * (h - pad*2);
    return x.toFixed(1)+","+y.toFixed(1);
  }).join(" ");
  return '<svg class="sparkline" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
    '<polyline points="'+pts+'" fill="none" stroke="#4fd18f" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
    '</svg>';
}

    else if(location.protocol === "file:"){ sw.textContent = "File aperto localmente: funziona lo stesso, ma per la cache offline completa ospita l'app online (vedi istruzioni)."; }
    else if(!window.isSecureContext){ sw.textContent = "Service worker non attivo (serve https): apri l'app online per la cache offline completa."; }
    else{
      navigator.serviceWorker.getRegistration().then(function(r){
        sw.textContent = r ? "Service worker attivo ✓ (cache offline pronta)." : "Service worker non ancora registrato (normale se apri il file da solo, senza sw.js accanto).";
      });
    }
  }
}

/* ============================================================
   EVENTI (delegazione)
   ============================================================ */
document.addEventListener("click", function(e){
  var t = e.target.closest("[data-act]");
  if(!t) return;
  var act = t.getAttribute("data-act");

  if(act === "start-log"){
    startLog(t.getAttribute("data-scheda"), t.getAttribute("data-variant") === "1");
  } else if(act === "cancel-log"){
    cancelLog();
  } else if(act === "save-log"){
    saveLog();
  } else if(act === "step"){
    stepSet(t.getAttribute("data-ex"), parseInt(t.getAttribute("data-idx"),10), t.getAttribute("data-field"), parseFloat(t.getAttribute("data-delta")));
  } else if(act === "toggle-done"){
    toggleDone(t.getAttribute("data-ex"), parseInt(t.getAttribute("data-idx"),10));
  } else if(act === "toggle-session"){
    var id = t.getAttribute("data-id");
    openSessionId = openSessionId === id ? null : id;
    render();
  } else if(act === "edit-session"){
    e.stopPropagation();
    editSession(t.getAttribute("data-id"));
  } else if(act === "delete-session"){
    e.stopPropagation();
    if(confirm("Eliminare questa seduta?")){
      state.workouts = state.workouts.filter(function(w){ return w.id !== t.getAttribute("data-id"); });
      persistAll();
      render();
    }
  } else if(act === "export"){
    doExport(t.getAttribute("data-format"));
  } else if(act === "copy-export"){
    var ta = document.getElementById("exportTextarea");
    if(ta){
      ta.select();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(ta.value).then(function(){ toast("Copiato ✓"); }).catch(function(){ document.execCommand("copy"); toast("Copiato ✓"); });
      } else {
        document.execCommand("copy");
        toast("Copiato ✓");
      }
    }
  } else if(act === "peso-step"){
    var delta = parseFloat(t.getAttribute("data-delta"));
    pesoInput = Math.round((pesoInput + delta) * 10) / 10;
    if(pesoInput < 0) pesoInput = 0;
    render();
  } else if(act === "save-peso"){
    var d = todayISO();
    var existing = state.bodyweight.find(function(b){ return b.date === d; });
    if(existing) existing.peso = pesoInput;
    else state.bodyweight.push({date: d, peso: pesoInput});
    persistAll();
    toast("Peso salvato ✓");
    render();
  } else if(act === "delete-peso"){
    if(confirm("Eliminare questa pesata?")){
      state.bodyweight = state.bodyweight.filter(function(b){ return b.date !== t.getAttribute("data-date"); });
      persistAll();
      render();
    }
  } else if(act === "meal-save-new"){
    var mta = document.getElementById("mealTextInput");
    saveNewMeal(mta ? mta.value : "");
  } else if(act === "nutri-edit-open"){
    openNutriEdit(t.getAttribute("data-id"));
  } else if(act === "nutri-edit-type"){
    if(nutriDraft){ nutriDraft.mealType = t.getAttribute("data-type"); render(); }
  } else if(act === "nutri-edit-cancel"){
    nutriDraft = null;
    render();
  } else if(act === "nutri-edit-save"){
    saveNutriEdit();
  } else if(act === "delete-nutri"){
    e.stopPropagation();
    if(confirm("Eliminare questo pasto?")){
      var delId = t.getAttribute("data-id");
      state.nutrition = state.nutrition.filter(function(n){ return n.id !== delId; });
      if(nutriDraft && nutriDraft.id === delId) nutriDraft = null;
      persistAll();
      render();
    }
  } else if(act === "copy-diary"){
    var days2 = parseInt(t.getAttribute("data-days"),10) || 1;
    var diaryText = buildDiaryText(days2);
    var box2 = document.getElementById("diaryTextBox");
    if(box2){
      box2.innerHTML = '<div class="field" style="margin-top:12px;"><label>Testo pronto da incollare in chat</label><textarea class="export-box" readonly id="diaryTextarea">'+diaryText.replace(/</g,"&lt;")+'</textarea><button class="btn small" style="margin-top:8px;" data-act="copy-diary-text">Copia negli appunti</button></div>';
    }
    var ta2 = document.getElementById("diaryTextarea");
    if(ta2){
      ta2.select();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(diaryText).then(function(){ toast("Copiato ✓"); }).catch(function(){});
      }
    }
  } else if(act === "copy-diary-text"){
    var ta3 = document.getElementById("diaryTextarea");
    if(ta3){
      ta3.select();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(ta3.value).then(function(){ toast("Copiato ✓"); }).catch(function(){ document.execCommand("copy"); toast("Copiato ✓"); });
      } else {
        document.execCommand("copy");
        toast("Copiato ✓");
      }
    }
  } else if(act === "apply-macro-paste"){
    var mpi = document.getElementById("macroPasteInput");
    var result = applyMacroPaste(mpi ? mpi.value : "");
    macroPasteMessage = result.applied ? (result.applied + " pasto/i aggiornati ✓") : "Nessuna riga valida trovata (formato atteso: id|kcal|proteine|carbo|grassi).";
    if(result.applied) toast("Macro applicati ✓");
    render();
  } else if(act === "copy-training-analysis"){
    var tmode = t.getAttribute("data-mode");
    lastTrainingCopyMode = tmode;
    var trainingText = tmode === "settimana" ? buildWeekAnalysisText(14) : buildSessionAnalysisText();
    var tbox = document.getElementById("trainingTextBox");
    if(tbox){
      tbox.innerHTML = '<div class="field" style="margin-top:12px;"><label>Testo pronto da incollare in chat</label><textarea class="export-box" readonly id="trainingTextarea">'+trainingText.replace(/</g,"&lt;")+'</textarea><button class="btn small" style="margin-top:8px;" data-act="copy-training-analysis-text">Copia negli appunti</button></div>';
    }
    var tta = document.getElementById("trainingTextarea");
    if(tta){
      tta.select();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(trainingText).then(function(){ toast("Copiato ✓"); }).catch(function(){});
      }
    }
  } else if(act === "copy-training-analysis-text"){
    var tta2 = document.getElementById("trainingTextarea");
    if(tta2){
      tta2.select();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(tta2.value).then(function(){ toast("Copiato ✓"); }).catch(function(){ document.execCommand("copy"); toast("Copiato ✓"); });
      } else {
        document.execCommand("copy");
        toast("Copiato ✓");
      }
    }
  } else if(act === "save-training-analysis"){
    var tpi = document.getElementById("trainingPasteInput");
    var tval = tpi ? tpi.value.trim() : "";
    if(tval){
      state.trainingAnalysis = {text: tval, date: todayISO(), mode: lastTrainingCopyMode || "sessione"};
      persistAll();
      toast("Analisi salvata ✓");
      render();
    } else {
      toast("Incolla prima il testo dell'IA");
    }
  } else if(act === "delete-training-analysis"){
    state.trainingAnalysis = null;
    persistAll();
    render();
  } else if(act === "force-rotation"){
    var target = t.getAttribute("data-scheda");
    var idx = ROTATION_SEQUENCE.indexOf(target);
    if(idx === -1) idx = 0;
    state.rotationIndex = idx;
    persistAll();
    toast("Prossima scheda impostata: "+target);
    render();
  } else if(act === "wipe-data"){
    if(confirm("Cancellare TUTTI i dati salvati (sedute, pesate, alimentazione, impostazioni)? L'operazione non è reversibile.")){
      localStorage.removeItem(LS.config);
      localStorage.removeItem(LS.workouts);
      localStorage.removeItem(LS.bodyweight);
      localStorage.removeItem(LS.rotation);
      localStorage.removeItem(LS.nutrition);
      localStorage.removeItem(LS.trainingAnalysis);
      state.exercises = JSON.parse(JSON.stringify(DEFAULT_EXERCISES));
      state.workouts = [];
      state.bodyweight = [];
      state.rotationIndex = 0;
      state.nutrition = [];
      nutriDraft = null;
      toast("Dati cancellati");
      render();
    }
  }
});

document.addEventListener("change", function(e){
  var t = e.target;
  if(t.getAttribute && t.getAttribute("data-act") === "nutri-edit-date"){
    if(nutriDraft){ nutriDraft.date = t.value || todayISO(); render(); }
  } else if(t.getAttribute && t.getAttribute("data-act") === "nutri-edit-text"){
    if(nutriDraft){ nutriDraft.text = t.value; }
  } else if(t.getAttribute && t.getAttribute("data-act") === "set-date"){
    if(logSession){ logSession.date = t.value || todayISO(); render(); }
  } else if(t.getAttribute && t.getAttribute("data-act") === "set-val"){
    if(logSession) setVal(t.getAttribute("data-ex"), parseInt(t.getAttribute("data-idx"),10), t.getAttribute("data-field"), t.value);
  } else if(t.getAttribute && t.getAttribute("data-act") === "set-inc"){
    var exId = t.getAttribute("data-ex");
    var v = parseFloat(t.value);
    if(!isNaN(v) && v >= 0){
      state.exercises[exId].inc = v;
      persistAll();
      toast("Incremento aggiornato");
    }
  } else if(t.getAttribute && t.getAttribute("data-act") === "set-rest"){
    var exIdR = t.getAttribute("data-ex");
    var vR = parseInt(t.value, 10);
    if(!isNaN(vR) && vR >= 0){
      state.exercises[exIdR].rest = vR;
      persistAll();
      toast("Recupero aggiornato");
    }
  } else if(t.getAttribute && t.getAttribute("data-act") === "import-file"){
    var file = t.files && t.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        if(!confirm("Importare questo backup? Sovrascriverà i dati attuali su questo telefono.")) return;
        if(data.exercises) state.exercises = data.exercises;
        if(data.workouts) state.workouts = data.workouts;
        if(data.bodyweight) state.bodyweight = data.bodyweight;
        if(data.nutrition) state.nutrition = data.nutrition;
        if(data.trainingAnalysis) state.trainingAnalysis = data.trainingAnalysis;
        persistAll();
        toast("Backup importato ✓");
        render();
      }catch(err){
        alert("File non valido.");
      }
    };
    reader.readAsText(file);
  }
});

/* ============================================================
   RENDER PRINCIPALE
   ============================================================ */
function updateHeader(){
  var sub = document.getElementById("headerSub");
  var titles = {oggi:"Oggi", registro:"Registro", peso:"Salute", consulta:"Consulta", impostazioni:"Impostazioni"};
  sub.textContent = titles[currentTab] || "";
}

function render(){
  updateHeader();
  if(currentTab === "oggi") renderOggi();
  else if(currentTab === "registro") renderRegistro();
  else if(currentTab === "peso") renderPeso();
  else if(currentTab === "consulta") renderConsulta();
  else if(currentTab === "impostazioni") renderImpostazioni();
}

render();

/* ============================================================
   SERVICE WORKER (attivo solo se ospitata online, https)
   ============================================================ */
if("serviceWorker" in navigator && window.isSecureContext && location.protocol !== "file:"){
  window.addEventListener("load", function(){
    try{
      navigator.serviceWorker.register("sw.js").catch(function(){ /* nessun sw.js accanto: normale se il file è aperto da solo */ });
    }catch(e){ /* ambiente senza supporto reale: ignora */ }
  });
}

})();
